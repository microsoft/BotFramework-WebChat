name: Publish UNRELEASED.md

# Builds UNRELEASED.md from .changelog/ and commits it to the "changelog-unreleased" branch, which only holds that file.
# The branch is created as an orphan on the first run. This workflow never force-pushes, so protect the branch with a
# ruleset that blocks deletion and force pushes.

on:
  push:
    branches:
      - main
      - test-changelog-base # Test only.
    paths:
      - .changelog/**
      - .github/workflows/publish-changelog-unreleased.yml
      - CHANGELOG.md # For the legend.
      - scripts/changelog/**

  workflow_dispatch: {}

concurrency:
  # The latest run rebuilds everything, older runs can be cancelled.
  cancel-in-progress: true
  group: changelog-unreleased

defaults:
  run:
    shell: bash

env:
  node-version: 24

permissions: {}

jobs:
  publish:
    # Not on forks, which would publish their own branch.
    if: github.repository == 'microsoft/BotFramework-WebChat' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test-changelog-base') # Test only.
    name: Publish UNRELEASED.md
    runs-on: ubuntu-latest

    permissions:
      contents: write # To push to the changelog-unreleased branch.

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Entries are ordered by the time their fragment was added.

      - name: Use Node.js ${{ env.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node-version }}
          cache: npm

      - run: npm clean-install --ignore-scripts --strict-peer-deps

      - name: Build UNRELEASED.md
        run: node ./scripts/changelog/build.mjs --output "$RUNNER_TEMP/UNRELEASED.md"

      - name: Commit UNRELEASED.md to changelog-unreleased
        env:
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
        run: |
          node ./scripts/changelog/publish.mjs "$RUNNER_TEMP/UNRELEASED.md" \
            --branch ${{ github.ref == 'refs/heads/main' && 'changelog-unreleased' || 'test-changelog-unreleased' }} \
            --message "Build from $GITHUB_SHA" \
            | tee --append "$GITHUB_STEP_SUMMARY"
