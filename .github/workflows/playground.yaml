name: playground

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/playground.yaml
      - packages/**

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checking out for ${{ github.ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: npm clean-install --ignore-scripts

      - run: |
          npm run build
          cd packages/playground
          npm run build
          mkdir wwwroot
          mv build wwwroot
          cp host/* wwwroot
          cd wwwroot
          npm ci
          zip -1rq ../build.zip .
        env:
          NODE_ENV: production

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wwwroot
          path: packages/playground/build.zip

      - id: deploy
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: webchat-playground
          slot-name: production
          publish-profile: ${{ secrets.PLAYGROUND_PUBLISH_PROFILE }}
          package: packages/playground/build.zip

      - name: Ping deployment
        run: |
          sleep 15
          curl -s ${{ steps.deploy.outputs.webapp-url }}
