extends:
  - ../../.eslintrc.production.yml
  - ../../.eslintrc.react.yml

# TODO: #3212 When we move to React Native, we should disable this.
env:
  browser: true

rules:
  # Only the Redux providers read the Redux store: hooks read domain contexts, which the providers fill.
  no-restricted-imports:
    - error
    - paths:
        - importNames:
            - ReduxProvider
            - useDispatch
            - useReduxContext
            - useSelector
            - useStore
          message: Only the Redux providers (src/providers/redux/) use the Redux store. Hooks read domain contexts (src/hooks/internal/domains/).
          name: '@msinternal/botframework-webchat-redux-store'
      patterns:
        - group:
            - '**/ReduxStoreProvider'
            - '**/ReduxStoreProvider.*'
          message: Only the Redux providers (src/providers/redux/) use the Redux store. Hooks read domain contexts (src/hooks/internal/domains/).

overrides:
  - files:
      - '**/*.spec.*'
      - src/hooks/internal/ReduxStoreProvider.tsx
      - src/providers/redux/**
    rules:
      no-restricted-imports: off

  # The default providers never use Redux.
  - files:
      - src/providers/default/**
    excludedFiles:
      - '**/*.spec.*'
    rules:
      no-restricted-imports:
        - error
        - paths:
            - importNames:
                - createStore
                - createStoreWithDevTools
                - createStoreWithOptions
              message: The default providers never create a Redux store.
              name: botframework-webchat-core
            - importNames:
                - ReduxProvider
                - ReduxStoreComposer
                - useDispatch
                - useReduxContext
                - useSelector
                - useStore
              message: The default providers never use Redux.
              name: '@msinternal/botframework-webchat-redux-store'
          patterns:
            - group:
                - '**/ReduxStoreProvider'
                - '**/ReduxStoreProvider.*'
                - '**/providers/redux/**'
                - redux
              message: The default providers never use Redux.
