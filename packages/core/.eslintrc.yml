extends:
  - ../../.eslintrc.production.yml
  - ../../.eslintrc.react.yml

# TODO: #3212 When we move to React Native, we should disable this.
env:
  browser: true

rules:
  no-restricted-imports:
    - error
    - patterns:
        - group:
            - '@msinternal/botframework-webchat-api-*'
          message: 'To prevent duplicated import, @msinternal/botframework-webchat-api-* is only allowed to import in botframework-webchat-api.'

overrides:
  # Reducers are pure functions of (state, action), so Redux and React's `useReducer` (Strict Mode, rebases) can call them
  # again with the same result. A time, a new ID or a side effect comes from `prepare/`: `prepareAction()` adds the values
  # to `meta` before the reducers, `afterDispatch()` runs the side effects after them.
  - files:
      - 'src/reducers/**'
    excludedFiles:
      - '*.spec.*'
    rules:
      no-restricted-globals:
        - error
        - name: cancelAnimationFrame
          message: Reducers must be pure, use an effect in prepare/afterDispatch.ts
        - name: cancelIdleCallback
          message: Reducers must be pure, use an effect in prepare/afterDispatch.ts
        - name: clearImmediate
          message: Reducers must be pure, use an effect in prepare/afterDispatch.ts
        - name: clearInterval
          message: Reducers must be pure, use an effect in prepare/afterDispatch.ts
        - name: clearTimeout
          message: Reducers must be pure, use an effect in prepare/afterDispatch.ts
        - name: crypto
          message: Reducers must be pure, read a new ID from the action (prepare/prepareAction.ts)
        - name: Date
          message: Reducers must be pure, read the time from the action (prepare/prepareAction.ts), or parse with utils/parseTimestamp.ts
        - name: performance
          message: Reducers must be pure, read the time from the action (prepare/prepareAction.ts)
        - name: queueMicrotask
          message: Reducers must be pure, use an effect in prepare/afterDispatch.ts
        - name: requestAnimationFrame
          message: Reducers must be pure, use an effect in prepare/afterDispatch.ts
        - name: requestIdleCallback
          message: Reducers must be pure, use an effect in prepare/afterDispatch.ts
        - name: setImmediate
          message: Reducers must be pure, use an effect in prepare/afterDispatch.ts
        - name: setInterval
          message: Reducers must be pure, use an effect in prepare/afterDispatch.ts
        - name: setTimeout
          message: Reducers must be pure, use an effect in prepare/afterDispatch.ts
      no-restricted-imports:
        - error
        - paths:
            - name: uuid
              message: Reducers must be pure, read a new ID from the action (prepare/prepareAction.ts)
          patterns:
            - group:
                - '@msinternal/botframework-webchat-api-*'
              message: 'To prevent duplicated import, @msinternal/botframework-webchat-api-* is only allowed to import in botframework-webchat-api.'
            - group:
                - '**/types/GlobalScopePonyfill'
              message: Reducers must be pure, read the time from the action (prepare/prepareAction.ts) instead of the ponyfill
      no-restricted-properties:
        - error
        - object: Math
          property: random
          message: Reducers must be pure, read a new ID from the action (prepare/prepareAction.ts)
        - object: URL
          property: createObjectURL
          message: Make sure content type is sanitized before presenting the URL in HTML
      no-restricted-syntax:
        - error
        - selector: MemberExpression[object.name='console']
          message: Reducers must be pure, log in prepare/afterDispatch.ts
        - selector: Identifier[name='ponyfill']
          message: Reducers must be pure, read the time from the action (prepare/prepareAction.ts) instead of the ponyfill
