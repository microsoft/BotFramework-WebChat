extends:
  - ../../.eslintrc.production.yml
  - ../../.eslintrc.react.yml

# TODO: #3212 When we move to React Native, we should disable this.
env:
  browser: true

rules:
  no-restricted-imports:
    - error
    - patterns:
        - group:
            - '@msinternal/botframework-webchat-api-*'
          message: 'To prevent duplicated import, @msinternal/botframework-webchat-api-* is only allowed to import in botframework-webchat-api.'

overrides:
  # The services of the default providers (no Redux) do not use Redux, the actions or the sagas.
  - files:
      - src/services/**
    excludedFiles:
      - '**/*.spec.*'
    rules:
      no-restricted-imports:
        - error
        - patterns:
            - group:
                - '@msinternal/botframework-webchat-api-*'
              message: 'To prevent duplicated import, @msinternal/botframework-webchat-api-* is only allowed to import in botframework-webchat-api.'
            - group:
                - redux
                - '**/actions/*'
                - '**/createReducer'
                - '**/createStore'
                - '**/reducers/*'
              message: The services do not use Redux, its actions or reducers.
