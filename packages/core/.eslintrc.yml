extends:
  - ../../.eslintrc.production.yml
  - ../../.eslintrc.react.yml

# TODO: #3212 When we move to React Native, we should disable this.
env:
  browser: true

rules:
  no-restricted-imports:
    - error
    - patterns:
        - group:
            - '@msinternal/botframework-webchat-api-*'
          message: 'To prevent duplicated import, @msinternal/botframework-webchat-api-* is only allowed to import in botframework-webchat-api.'

overrides:
  # The activities core does not depend on the rest of core (Redux, sagas, actions): it only imports its own files and
  # these packages.
  - files:
      - src/reducers/activities/sort/**

    settings:
      import/resolver:
        node:
          extensions: [.ts, .js]

    rules:
      import/no-restricted-paths:
        - error
        - zones:
            - target: ./src/reducers/activities/sort
              from: ./src
              except:
                - ./reducers/activities/sort
              message: The activities core must not import from the rest of core.
