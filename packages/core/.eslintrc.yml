extends:
  - ../../.eslintrc.production.yml
  - ../../.eslintrc.react.yml

# TODO: #3212 When we move to React Native, we should disable this.
env:
  browser: true

rules:
  no-restricted-imports:
    - error
    - patterns:
        - group:
            - '@msinternal/botframework-webchat-api-*'
          message: 'To prevent duplicated import, @msinternal/botframework-webchat-api-* is only allowed to import in botframework-webchat-api.'

overrides:
  # Reducers, and the code of core they import, are pure functions of (state, action): the time and new IDs come in the
  # action's `meta`, side effects run in prepare/runEffects.ts. The base config bans `Date` and the timers already.
  # Not linted: the packages they import (base, core-graph, core-json-ld); the parts that reducers use are pure.
  - files:
      - src/prepare/prepareAction.ts
      - src/reducer.ts
      - src/reducers/**
      - src/utils/getActivityLivestreamingMetadata.ts
      - src/utils/getOrgSchemaMessage.ts
      - src/utils/isDate.ts
      - src/utils/parseTimestamp.ts
    excludedFiles:
      - '*.spec.*'
    rules:
      no-console: [error, {}]
      no-restricted-syntax:
        - error
        - selector: "ImportDeclaration[source.value='uuid'], ImportDeclaration[source.value=/GlobalScopePonyfill$/], Identifier[name=/^(crypto|performance|ponyfill)$/], MemberExpression[object.name='Math'][property.name='random']"
          message: Reducers must be pure, read the time and new IDs from the action's meta (prepare/prepareAction.ts)
        - selector: Identifier[name='queueMicrotask']
          message: Reducers must be pure, run side effects in prepare/runEffects.ts
