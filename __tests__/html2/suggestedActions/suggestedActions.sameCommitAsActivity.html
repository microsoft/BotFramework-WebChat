<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "botframework-webchat/": "/__dist__/packages/bundle/static/botframework-webchat/",
          "react": "/__dist__/packages/bundle/static/react.js",
          "react-dom": "/__dist__/packages/bundle/static/react-dom.js",
          "react-dom/client": "/__dist__/packages/bundle/static/react-dom/client.js",
          "react-jsx-runtime": "/__dist__/packages/bundle/static/react/jsx-runtime.js"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { waitFor } from '@testduet/wait-for';
      import { createStoreWithOptions, ReactWebChat } from 'botframework-webchat';
      import { createElement } from 'react';
      import { version } from 'react-dom';
      import { createRoot } from 'react-dom/client';

      // TODO: This is for `createDirectLineEmulator` only, should find ways to eliminate this line.
      window.WebChat = { createStoreWithOptions };

      run(async function () {
        // GIVEN: React 18, which renders store changes at sync priority.
        expect(version).toMatch(/^18\./u);

        const { directLine, store } = testHelpers.createDirectLineEmulator();

        createRoot(document.getElementById('webchat')).render(createElement(ReactWebChat, { directLine, store }));

        await pageConditions.uiConnected();

        // Every callback of a MutationObserver sees the DOM of 1 or more commits, never half of a commit.
        const samples = [];
        const mutationObserver = new MutationObserver(() =>
          samples.push({
            activityShown: pageElements
              .activityContents()
              .some(content => content?.textContent.includes('What is your favorite color?')),
            numSuggestedActions: pageElements.suggestedActions().length
          })
        );

        mutationObserver.observe(document.getElementById('webchat'), { childList: true, subtree: true });

        // WHEN: The bot sends a message with suggested actions.
        await directLine.emulateIncomingActivity({
          suggestedActions: {
            actions: [
              { title: 'Red', type: 'imBack', value: 'Red' },
              { title: 'Green', type: 'imBack', value: 'Green' },
              { title: 'Blue', type: 'imBack', value: 'Blue' }
            ]
          },
          text: 'What is your favorite color?',
          type: 'message'
        });

        await waitFor(() => expect(pageElements.suggestedActions()).toHaveLength(3));

        mutationObserver.disconnect();

        // THEN: The message and its suggested actions should show in the same commit.
        expect(samples.some(({ activityShown }) => activityShown)).toBe(true);
        expect(
          samples.filter(({ activityShown, numSuggestedActions }) => activityShown && !numSuggestedActions)
        ).toEqual([]);

        // THEN: The message and its suggested actions should show.
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
