<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "botframework-webchat/": "/__dist__/packages/bundle/static/botframework-webchat/",
          "react": "/__dist__/packages/bundle/static/react.js",
          "react-dom": "/__dist__/packages/bundle/static/react-dom.js",
          "react-dom/client": "/__dist__/packages/bundle/static/react-dom/client.js"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { waitFor } from '@testduet/wait-for';
      import { createStoreWithOptions, ReactWebChat, testIds } from 'botframework-webchat';
      import { createElement } from 'react';
      import { createRoot } from 'react-dom/client';

      // TODO: Should find ways to eliminate this line.
      window.WebChat = { createStoreWithOptions, testIds };

      run(async function () {
        const { directLine, store } = testHelpers.createDirectLineEmulator();

        createRoot(document.getElementById('webchat')).render(createElement(ReactWebChat, { directLine, store }));

        await pageConditions.uiConnected();

        const getFlipperLabels = () =>
          Array.from(document.querySelectorAll('.webchat__suggested-actions .carousel-flipper'), flipper =>
            flipper.getAttribute('aria-label')
          );

        const longTitles = ['Yes, continue with the next step', 'No, go back to the main menu'];

        // GIVEN: 2 long suggested actions.
        await directLine.emulateIncomingActivity({
          from: { role: 'bot' },
          suggestedActions: {
            actions: longTitles.map(title => ({ title, type: 'imBack', value: title })),
            to: []
          },
          text: 'Do you want to continue?',
          type: 'message'
        });

        await pageConditions.numActivitiesShown(1);
        await pageConditions.suggestedActionsShown();

        // THEN: The suggested actions overflow, both flippers are shown.
        // Starts long: before the first measurement, there are no flippers either, so "no flippers" proves nothing.
        await waitFor(() => expect(getFlipperLabels()).toEqual(['Previous', 'Next']));

        await host.snapshot('local');

        // WHEN: The bot replaces them with 2 short suggested actions.
        await directLine.emulateIncomingActivity({
          from: { role: 'bot' },
          suggestedActions: {
            actions: ['Yes', 'No'].map(title => ({ title, type: 'imBack', value: title })),
            to: []
          },
          text: 'Are you sure?',
          type: 'message'
        });

        await pageConditions.numActivitiesShown(2);
        await waitFor(() => expect(pageElements.suggestedActions()[0].textContent).toBe('Yes'));

        // THEN: Both suggested actions fit, the flippers are gone.
        await waitFor(() => expect(getFlipperLabels()).toEqual([]));

        await host.snapshot('local');

        // WHEN: The bot replaces them with the 2 long suggested actions again.
        // The suggested action elements are reused and grow, their list keeps its width.
        await directLine.emulateIncomingActivity({
          from: { role: 'bot' },
          suggestedActions: {
            actions: longTitles.map(title => ({ title, type: 'imBack', value: title })),
            to: []
          },
          text: 'Really?',
          type: 'message'
        });

        await pageConditions.numActivitiesShown(3);
        await waitFor(() =>
          expect(pageElements.suggestedActions()[0].textContent).toBe('Yes, continue with the next step')
        );

        // THEN: The suggested actions overflow again, both flippers are shown.
        await waitFor(() => expect(getFlipperLabels()).toEqual(['Previous', 'Next']));

        await host.snapshot('local');
      });
    </script>
  </body>
</html>
