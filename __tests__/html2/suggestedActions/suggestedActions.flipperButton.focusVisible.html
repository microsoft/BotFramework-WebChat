<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "botframework-webchat/": "/__dist__/packages/bundle/static/botframework-webchat/",
          "react": "/__dist__/packages/bundle/static/react.js",
          "react-dom": "/__dist__/packages/bundle/static/react-dom.js",
          "react-dom/client": "/__dist__/packages/bundle/static/react-dom/client.js"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { waitFor } from '@testduet/wait-for';
      import { createStoreWithOptions, ReactWebChat, testIds } from 'botframework-webchat';
      import { createElement } from 'react';
      import { createRoot } from 'react-dom/client';

      // TODO: Should find ways to eliminate this line.
      window.WebChat = { createStoreWithOptions, testIds };

      run(async function () {
        const { directLine, store } = testHelpers.createDirectLineEmulator();

        createRoot(document.getElementById('webchat')).render(createElement(ReactWebChat, { directLine, store }));

        await pageConditions.uiConnected();

        await directLine.emulateIncomingActivity({
          from: { role: 'bot' },
          suggestedActions: {
            actions: [1, 2, 3, 4, 5, 6].map(index => ({
              title: `Action ${index}`,
              type: 'imBack',
              value: `Action ${index}`
            })),
            to: []
          },
          text: 'Please select one of the actions below',
          type: 'message'
        });

        await pageConditions.numActivitiesShown(1);

        // The suggested actions overflow, react-film shows the flippers after measuring the filmstrip.
        await waitFor(() =>
          expect(document.querySelectorAll('.webchat__suggested-actions .react-film__flipper')).toHaveLength(2)
        );

        const nextFlipper = document.querySelector('.webchat__suggested-actions button[aria-label="Next"]');
        const previousFlipper = document.querySelector('.webchat__suggested-actions button[aria-label="Previous"]');

        const getFlipperBody = flipper => flipper.querySelector('.react-film__flipper__body');

        const getFocusIndicatorStyle = flipper => {
          const { boxShadow, outlineColor, outlineOffset, outlineStyle, outlineWidth } = getComputedStyle(
            getFlipperBody(flipper)
          );

          return { boxShadow, outlineColor, outlineOffset, outlineStyle, outlineWidth };
        };

        // The flipper button clips its content, the focus indicator (4px around the flipper) must fit inside the button.
        const getMinFlipperBodyClearance = flipper => {
          const bodyRect = getFlipperBody(flipper).getBoundingClientRect();
          const buttonRect = flipper.getBoundingClientRect();

          return Math.min(
            bodyRect.top - buttonRect.top,
            bodyRect.left - buttonRect.left,
            buttonRect.right - bodyRect.right,
            buttonRect.bottom - bodyRect.bottom
          );
        };

        // The background color of the flipper transitions in 100ms when focus changes.
        const waitForFlipperBackgroundColor = (flipper, backgroundColor) =>
          waitFor(() =>
            expect(getComputedStyle(getFlipperBody(flipper))).toHaveProperty('backgroundColor', backgroundColor)
          );

        // Two-tone focus indicator: an outer ring in the suggested actions keyboard indicator color (black, 2px),
        // separated from the flipper by a band in the flipper foreground color (white, 2px).
        // It has at least 3:1 contrast against the flipper and against the background.
        const visibleFocusIndicatorStyle = {
          boxShadow: 'rgb(255, 255, 255) 0px 0px 0px 2px',
          outlineColor: 'rgb(0, 0, 0)',
          outlineOffset: '2px',
          outlineStyle: 'solid',
          outlineWidth: '2px'
        };

        // GIVEN: The suggested actions are scrolled to the start.
        expect(document.querySelector('.webchat__suggested-actions .react-film__filmstrip').scrollLeft).toBe(0);

        // WHEN: Press SHIFT-TAB from the send box to move focus to the "Next" flipper.
        pageObjects.focusSendBoxTextBox();
        await host.sendShiftTab(2);

        // THEN: The "Next" flipper should have a visible focus indicator.
        expect(document.activeElement).toBe(nextFlipper);
        expect(nextFlipper.matches(':focus-visible')).toBe(true);
        expect(getFocusIndicatorStyle(nextFlipper)).toEqual(visibleFocusIndicatorStyle);
        expect(getMinFlipperBodyClearance(nextFlipper)).toBeGreaterThanOrEqual(4);

        await waitForFlipperBackgroundColor(nextFlipper, 'rgba(0, 0, 0, 0.8)');
        await host.snapshot('local');

        // WHEN: Press SHIFT-TAB twice to move focus to the "Previous" flipper, through the first suggested action.
        await host.sendShiftTab(2);

        // THEN: The "Previous" flipper should have a visible focus indicator, although the suggested actions cannot scroll back.
        expect(document.activeElement).toBe(previousFlipper);
        expect(previousFlipper.matches(':focus-visible')).toBe(true);
        expect(getFocusIndicatorStyle(previousFlipper)).toEqual(visibleFocusIndicatorStyle);
        expect(getMinFlipperBodyClearance(previousFlipper)).toBeGreaterThanOrEqual(4);

        // THEN: The "Next" flipper should not show the focus indicator after losing focus.
        expect(getFocusIndicatorStyle(nextFlipper)).toHaveProperty('outlineStyle', 'none');

        await waitForFlipperBackgroundColor(nextFlipper, 'rgba(0, 0, 0, 0.6)');
        await waitForFlipperBackgroundColor(previousFlipper, 'rgba(0, 0, 0, 0.8)');
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
