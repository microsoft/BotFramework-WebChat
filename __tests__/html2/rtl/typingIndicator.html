<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "react": "/__dist__/packages/bundle/static/react.js",
          "react-dom": "/__dist__/packages/bundle/static/react-dom.js"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { createStoreWithOptions, renderWebChat, testIds } from 'botframework-webchat';

      // TODO: Should find ways to eliminate this line.
      window.WebChat = { createStoreWithOptions, testIds };

      // A static image instead of the animated one: a purple outline with a filled block on its left side.
      const image = `<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
        <rect fill="none" height="100%" stroke="purple" stroke-width="4" width="100%" />
        <rect fill="purple" height="100%" width="25%" />
      </svg>`;

      run(async function () {
        const { directLine, store } = testHelpers.createDirectLineEmulator();

        // GIVEN: Web Chat in Hebrew (right-to-left) on a left-to-right page.
        renderWebChat(
          {
            directLine,
            locale: 'he-IL',
            store,
            styleOptions: {
              hideSendBox: true,
              typingAnimationBackgroundImage: `url("data:image/svg+xml,${encodeURIComponent(image)}")`
            }
          },
          document.getElementById('webchat')
        );

        await pageConditions.uiConnected();

        // WHEN: The bot is typing.
        await directLine.emulateIncomingActivity({
          channelData: { webChat: { styleOptions: { typingAnimationDuration: 'Infinity' } } }, // Never expires.
          from: { id: 'bot', role: 'bot' },
          type: 'typing'
        });

        await pageConditions.typingIndicatorShown();

        // THEN: The image is mirrored (filled block on its right side), 10 pixels from the right of the transcript.
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
