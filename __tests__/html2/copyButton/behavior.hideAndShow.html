<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
    <script crossorigin="anonymous" src="https://unpkg.com/@babel/standalone@7.26.5/babel.min.js"></script>
    <script crossorigin="anonymous" src="https://unpkg.com/react@16.8.6/umd/react.production.min.js"></script>
    <script crossorigin="anonymous" src="https://unpkg.com/react-dom@16.8.6/umd/react-dom.production.min.js"></script>
    <script crossorigin="anonymous" src="/test-harness.js"></script>
    <script crossorigin="anonymous" src="/test-page-object.js"></script>
    <script crossorigin="anonymous" src="/__dist__/webchat-es5.js"></script>
  </head>
  <body>
    <main id="webchat" style="position: relative"></main>
    <script type="text/babel">
      run(async function () {
        const {
          React,
          ReactDOM: { render },
          WebChat: { ReactWebChat }
        } = window; // Imports in UMD fashion.

        const clock = lolex.createClock();
        const { directLine, store } = testHelpers.createDirectLineEmulator({ ponyfill: clock });

        render(
          <ReactWebChat directLine={directLine} ponyfill={clock} store={store} />,
          document.getElementById('webchat')
        );

        await pageConditions.webChatRendered();

        clock.tick(600);

        await pageConditions.uiConnected();

        expect(window.isSecureContext).toBe(true);

        await host.sendDevToolsCommand('Browser.setPermission', {
          permission: { name: 'clipboard-write' },
          setting: 'granted'
        });

        await expect(navigator.permissions.query({ name: 'clipboard-write' })).resolves.toHaveProperty(
          'state',
          'granted'
        );

        await directLine.emulateIncomingActivity({
          entities: [
            {
              '@context': 'https://schema.org',
              '@id': '',
              '@type': 'Message',
              keywords: ['AllowCopy'],
              type: 'https://schema.org/Message'
            }
          ],
          text: 'Mollit *aute* **aute** dolor ea ex magna incididunt nostrud sit nisi.',
          type: 'message'
        });

        await pageConditions.numActivitiesShown(1);

        await pageConditions.became(
          'copy button is available',
          () => !!document.querySelector(`[data-testid="${WebChat.testIds.copyButton}"]`),
          1000
        );

        // axe-core is crazy about empty button name while swapping name
        const { checkAccessibility } = window;
        window.checkAccessibility = async () => {};

        const copyButton = document.querySelector(`[data-testid="${WebChat.testIds.copyButton}"]`);
        const isCopiedShown = () => getComputedStyle(copyButton.lastElementChild).visibility === 'visible';
        const hideAndShowWebChat = () => {
          document.getElementById('webchat').style.display = 'none';
          document.body.offsetWidth; // Need for browser to refresh the layout.
          document.getElementById('webchat').style.display = '';
        };

        // WHEN: Click on the "Copy" button.
        await host.click(copyButton);

        // THEN: The "Copy" button should say "Copied".
        await pageConditions.became('"Copied" is shown', isCopiedShown, 1_000);
        await host.snapshot('local');

        // WHEN: Hiding Web Chat and showing it back while "Copied" is shown.
        clock.tick(1_000);
        hideAndShowWebChat();

        // THEN: "Copied" should still be shown.
        expect(isCopiedShown()).toBe(true);

        // WHEN: Just before 5 seconds after the click.
        clock.tick(3_999);

        // THEN: "Copied" should still be shown.
        expect(isCopiedShown()).toBe(true);

        // WHEN: 5 seconds after the click.
        clock.tick(1);

        // THEN: The "Copy" button should be back to normal, hiding Web Chat should not extend the confirmation.
        await pageConditions.became('"Copied" is hidden', () => !isCopiedShown(), 1_000);
        await host.snapshot('local');

        window.checkAccessibility = checkAccessibility;

        // WHEN: Hiding Web Chat and showing it back.
        hideAndShowWebChat();

        // THEN: The "Copy" button should be kept at normal.
        await host.snapshot('local');

        expect(copyButton.innerText).toBe('Copy');
      });
    </script>
  </body>
</html>
