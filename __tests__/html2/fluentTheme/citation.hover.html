<!doctype html>
<html lang="en-US">
  <head>
    <title>Fluent Theme: citation link on hover</title>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
    <script type="importmap">
      {
        "imports": {
          "@fluentui/react-provider": "/__dist__/packages/test/test-assets/out/@fluentui/react-provider.js",
          "@fluentui/tokens": "/__dist__/packages/test/test-assets/out/@fluentui/tokens.js",
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "react": "https://esm.sh/react@18",
          "react-dom": "https://esm.sh/react-dom@18",
          "react-dom/": "https://esm.sh/react-dom@18/",
          "react-jsx-runtime": "https://esm.sh/react@18/jsx-runtime"
        }
      }
    </script>
    <script crossorigin="anonymous" src="/test-harness.js"></script>
    <script crossorigin="anonymous" src="/test-page-object.js"></script>
    <script type="module">
      import React from 'react';
      window.React = React;
    </script>
    <script defer crossorigin="anonymous" src="/__dist__/webchat-es5.js"></script>
    <script defer crossorigin="anonymous" src="/__dist__/botframework-webchat-fluent-theme.production.min.js"></script>
    <style>
      .fui-FluentProvider {
        display: contents;
      }
    </style>
  </head>
  <body>
    <main id="webchat"></main>
    <script type="module">
      import { FluentProvider } from '@fluentui/react-provider';
      import { webLightTheme } from '@fluentui/tokens';
      import { waitFor } from '@testduet/wait-for';
      import React from 'react';
      import { createRoot } from 'react-dom/client';

      run(async function () {
        const {
          WebChat: { FluentThemeProvider, ReactWebChat }
        } = window; // Imports in UMD fashion.

        const { directLine, store } = testHelpers.createDirectLineEmulator();

        await host.sendDevToolsCommand('Emulation.setEmulatedMedia', {
          features: [{ name: 'prefers-reduced-motion', value: 'reduce' }]
        });

        createRoot(document.getElementById('webchat')).render(
          React.createElement(
            FluentProvider,
            { className: 'fui-FluentProvider', theme: { ...webLightTheme, colorNeutralForeground1: '#1b1b1b' } },
            React.createElement(FluentThemeProvider, null, React.createElement(ReactWebChat, { directLine, store }))
          )
        );

        await pageConditions.uiConnected();

        // GIVEN: A message with a citation.
        await directLine.emulateIncomingActivity({
          entities: [
            {
              '@context': 'https://schema.org',
              '@id': 'cite:1',
              '@type': 'Claim',
              name: 'Benefits overview',
              text: 'Benefits start on your first day.',
              type: 'https://schema.org/Claim'
            }
          ],
          from: { id: 'bot', name: 'Bot', role: 'bot' },
          text: 'Your benefits start on your first day[1].\n\n[1]: cite:1 "Benefits overview"',
          type: 'message'
        });

        await pageConditions.numActivitiesShown(1);
        await pageConditions.scrollToBottomCompleted();

        const citation = pageElements.activities()[0].querySelector('.render-markdown__citation');

        // WHEN: The pointer hovers over the citation.
        await host.hover(citation);

        // THEN: The citation should be hovered.
        await waitFor(() => expect(citation.matches(':hover')).toBe(true));

        // THEN: The citation border should use the Fluent brand stroke color for hover, not the text color.
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
