<!doctype html>
<html lang="en-US">
  <head>
    <title>Fluent Theme (dark): focused modal dialog close button on hover</title>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
    <script type="importmap">
      {
        "imports": {
          "@fluentui/react-provider": "/__dist__/packages/test/test-assets/out/@fluentui/react-provider.js",
          "@fluentui/tokens": "/__dist__/packages/test/test-assets/out/@fluentui/tokens.js",
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "react": "https://esm.sh/react@18",
          "react-dom": "https://esm.sh/react-dom@18",
          "react-dom/": "https://esm.sh/react-dom@18/",
          "react-jsx-runtime": "https://esm.sh/react@18/jsx-runtime"
        }
      }
    </script>
    <script crossorigin="anonymous" src="/test-harness.js"></script>
    <script crossorigin="anonymous" src="/test-page-object.js"></script>
    <script type="module">
      import React from 'react';
      window.React = React;
    </script>
    <script defer crossorigin="anonymous" src="/__dist__/webchat-es5.js"></script>
    <script defer crossorigin="anonymous" src="/__dist__/botframework-webchat-fluent-theme.production.min.js"></script>
    <style>
      .fui-FluentProvider {
        display: contents;
      }
    </style>
  </head>
  <body>
    <main id="webchat"></main>
    <script type="module">
      import { FluentProvider } from '@fluentui/react-provider';
      import { webDarkTheme } from '@fluentui/tokens';
      import { waitFor } from '@testduet/wait-for';
      import React from 'react';
      import { createRoot } from 'react-dom/client';

      run(async function () {
        const {
          WebChat: { FluentThemeProvider, ReactWebChat, testIds }
        } = window; // Imports in UMD fashion.

        const { directLine, store } = testHelpers.createDirectLineEmulator();

        // Fluent shortens its transitions with reduced motion, so the hover background shows without fading in.
        await host.sendDevToolsCommand('Emulation.setEmulatedMedia', {
          features: [{ name: 'prefers-reduced-motion', value: 'reduce' }]
        });

        createRoot(document.getElementById('webchat')).render(
          React.createElement(
            FluentProvider,
            { className: 'fui-FluentProvider', theme: webDarkTheme },
            React.createElement(
              FluentThemeProvider,
              null,
              React.createElement(ReactWebChat, { directLine, store, styleOptions: { hideSendBox: true } })
            )
          )
        );

        await pageConditions.uiConnected();

        // GIVEN: A message with AI-generated code.
        await directLine.emulateIncomingActivity({
          entities: [
            {
              '@context': 'https://schema.org',
              '@id': '',
              '@type': 'Message',
              isBasedOn: { '@type': 'SoftwareSourceCode', programmingLanguage: 'javascript', text: 'const x = 1;' },
              keywords: ['AIGeneratedContent'],
              type: 'https://schema.org/Message'
            }
          ],
          from: { role: 'bot' },
          text: 'Here is a sample in JavaScript.',
          type: 'message'
        });

        await pageConditions.numActivitiesShown(1);

        // WHEN: The "View code" dialog is opened with the keyboard.
        document.querySelector(`[data-testid="${testIds.viewCodeButton}"]`).focus();
        await host.sendKeys('ENTER');

        await waitFor(() => expect(document.querySelector('dialog[open] pre.shiki')).toBeTruthy());

        const closeButton = document.querySelector('dialog[open] button[aria-label="Close"]');

        // THEN: The close button should have focus.
        expect(document.activeElement).toBe(closeButton);

        // THEN: The focused close button shows the focus border.
        await host.snapshot('local');

        // WHEN: The pointer hovers over the focused close button.
        await host.hover(closeButton);

        await waitFor(() => expect(closeButton.matches(':hover')).toBe(true));
        expect(document.activeElement).toBe(closeButton);

        // THEN: The close button background should turn darker (Fluent's dark hover color), not light gray.
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
