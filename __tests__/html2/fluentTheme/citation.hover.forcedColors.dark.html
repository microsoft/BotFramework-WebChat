<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
    <style>
      .fui-FluentProvider {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "@fluentui/react-provider": "/__dist__/packages/test/test-assets/out/@fluentui/react-provider.js",
          "@fluentui/tokens": "/__dist__/packages/test/test-assets/out/@fluentui/tokens.js",
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "botframework-webchat/": "/__dist__/packages/bundle/static/botframework-webchat/",
          "botframework-webchat-fluent-theme": "/__dist__/packages/fluent-theme/static/botframework-webchat-fluent-theme.js",
          "react": "/__dist__/packages/bundle/static/react.js",
          "react-dom": "/__dist__/packages/bundle/static/react-dom.js",
          "react-dom/client": "/__dist__/packages/bundle/static/react-dom/client.js",
          "react-jsx-runtime": "/__dist__/packages/bundle/static/react/jsx-runtime.js"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { FluentProvider } from '@fluentui/react-provider';
      import { webDarkTheme } from '@fluentui/tokens';
      import { waitFor } from '@testduet/wait-for';
      import { createStoreWithOptions, ReactWebChat } from 'botframework-webchat';
      import { FluentThemeProvider } from 'botframework-webchat-fluent-theme';
      import { createElement } from 'react';
      import { createRoot } from 'react-dom/client';

      // TODO: This is for `createDirectLineEmulator` only, should find ways to eliminate this line.
      window.WebChat = { createStoreWithOptions };

      run(async function () {
        // GIVEN: A dark high contrast theme (such as "Aquatic" on Windows) is active before Web Chat renders.
        await host.sendDevToolsCommand('Emulation.setEmulatedMedia', {
          features: [
            { name: 'forced-colors', value: 'active' },
            { name: 'prefers-color-scheme', value: 'dark' },
            { name: 'prefers-reduced-motion', value: 'reduce' } // Skips the color transition on hover.
          ]
        });

        expect(window.matchMedia('(forced-colors: active) and (prefers-color-scheme: dark)').matches).toBe(true);

        const { directLine, store } = testHelpers.createDirectLineEmulator();

        createRoot(document.getElementById('webchat')).render(
          createElement(
            FluentProvider,
            { theme: webDarkTheme },
            createElement(
              FluentThemeProvider,
              { variant: 'fluent' },
              createElement(ReactWebChat, { directLine, store })
            )
          )
        );

        await pageConditions.uiConnected();

        // GIVEN: A message with a citation.
        await directLine.emulateIncomingActivity({
          entities: [
            {
              '@context': 'https://schema.org',
              '@id': 'cite:1',
              '@type': 'Claim',
              name: 'Benefits overview',
              text: 'Benefits start on your first day.',
              type: 'https://schema.org/Claim'
            }
          ],
          from: { role: 'bot' },
          // [1] points to the "cite:1" claim above, so it is rendered as a citation button.
          text: 'Your benefits start on your first day[1].\n\n[1]: cite:1 "Benefits overview"',
          type: 'message'
        });

        await pageConditions.numActivitiesShown(1);
        await pageConditions.scrollToBottomCompleted();

        const citation = pageElements.activities()[0].querySelector('.render-markdown__citation');

        expect(citation.tagName).toBe('BUTTON');

        // WHEN: The pointer hovers over the citation.
        await host.hover(citation);

        // THEN: The citation should be hovered.
        await waitFor(() => expect(citation.matches(':hover')).toBe(true));

        // THEN: The hovered citation "1" and its border should stay in the link color, same as the reference chip below.
        // THEN: The message should have a border.
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
