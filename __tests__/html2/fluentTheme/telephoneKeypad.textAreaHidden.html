<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "botframework-webchat/": "/__dist__/packages/bundle/static/botframework-webchat/",
          "botframework-webchat-fluent-theme": "/__dist__/packages/fluent-theme/static/botframework-webchat-fluent-theme.js",
          "react": "/__dist__/packages/bundle/static/react.js",
          "react-dom": "/__dist__/packages/bundle/static/react-dom.js",
          "react-dom/client": "/__dist__/packages/bundle/static/react-dom/client.js"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { waitFor } from '@testduet/wait-for';
      import { createStoreWithOptions, ReactWebChat } from 'botframework-webchat';
      import { FluentThemeProvider, testIds } from 'botframework-webchat-fluent-theme';
      import { createElement } from 'react';
      import { createRoot } from 'react-dom/client';

      // TODO: This is for `createDirectLineEmulator` only, should find ways to eliminate this line.
      window.WebChat = { createStoreWithOptions };

      run(async function () {
        const { directLine, store } = testHelpers.createDirectLineEmulator();

        createRoot(document.getElementById('webchat')).render(
          createElement(
            FluentThemeProvider,
            { variant: 'fluent' },
            createElement(ReactWebChat, { directLine, store, styleOptions: { hideTelephoneKeypadButton: false } })
          )
        );

        // GIVEN: Web Chat with the Fluent send box.
        await pageConditions.uiConnected();

        const textArea = document.querySelector(`[data-testid="${testIds.sendBoxTextBox}"]`);
        const getKeypadButton1 = () =>
          document.querySelector(`[data-testid="${testIds.sendBoxTelephoneKeypadButton1}"]`);

        // WHEN: The telephone keypad is shown.
        await host.click(document.querySelector(`[data-testid="${testIds.sendBoxTelephoneKeypadToolbarButton}"]`));

        // THEN: The keypad should take focus from the text area.
        await waitFor(() => expect(document.activeElement).toBe(getKeypadButton1()));

        // THEN: The text area underneath the keypad should be hidden from assistive technologies with `aria-hidden`, not with the invalid role "hidden".
        expect(textArea.parentElement.getAttribute('aria-hidden')).toBe('true');
        expect(textArea.parentElement.hasAttribute('role')).toBe(false);
        expect(await testHelpers.getAccessibilityNode(textArea)).toHaveProperty('ignored', true);

        // WHEN: The telephone keypad is closed by ESCAPE key.
        await host.sendKeys('ESCAPE');

        // THEN: The text area should be exposed to assistive technologies again.
        await waitFor(() => expect(getKeypadButton1()).toBeNull());
        expect(textArea.parentElement.hasAttribute('aria-hidden')).toBe(false);
        expect(await testHelpers.getAccessibilityNode(textArea)).toHaveProperty('ignored', false);
        expect(await testHelpers.getAccessibleName(textArea)).toBe('Message input box');
      });
    </script>
  </body>
</html>
