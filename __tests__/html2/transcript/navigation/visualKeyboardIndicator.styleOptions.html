<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for"
        }
      }
    </script>
    <script crossorigin="anonymous" src="/test-harness.js"></script>
    <script crossorigin="anonymous" src="/test-page-object.js"></script>
    <script crossorigin="anonymous" src="/__dist__/webchat-es5.js"></script>
  </head>
  <body>
    <main id="webchat"></main>
    <script type="module">
      import { waitFor } from '@testduet/wait-for';

      run(async function () {
        const { directLine, store } = testHelpers.createDirectLineEmulator();

        WebChat.renderWebChat(
          {
            directLine,
            store,
            styleOptions: {
              transcriptVisualKeyboardIndicatorColor: 'Red',
              transcriptVisualKeyboardIndicatorStyle: 'dotted',
              transcriptVisualKeyboardIndicatorWidth: 4
            }
          },
          document.getElementById('webchat')
        );

        await pageConditions.uiConnected();

        await directLine.emulateIncomingActivity('Hello, World!');
        await directLine.emulateIncomingActivity('Aloha!');

        await pageConditions.numActivitiesShown(2);
        await pageConditions.scrollToBottomCompleted();

        // GIVEN: Focus on the send box.
        await pageObjects.focusSendBoxTextBox();

        // WHEN: SHIFT-TAB key is pressed from the send box.
        await host.sendShiftTab();

        // THEN: The upload button should have keyboard focus.
        expect(document.activeElement).toHaveProperty('title', 'Upload file');

        // THEN: The upload button shows its focus indicator, the transcript shows none.
        await host.snapshot('local');

        // WHEN: SHIFT-TAB key is pressed from the upload button.
        await host.sendShiftTab();

        // THEN: The "End of chat history" terminator should have keyboard focus.
        await waitFor(() => expect(document.activeElement).toBe(pageElements.transcriptTerminator()));
        expect(pageElements.transcriptTerminator().matches(':focus-visible')).toBe(true);

        // THEN: The focus indicator around the transcript should be red, dotted, and 4px wide, with the "End of chat history" label.
        await host.snapshot('local');

        // WHEN: SHIFT-TAB key is pressed from the terminator.
        await host.sendShiftTab();

        // THEN: The transcript should have keyboard focus, with the last activity active.
        await waitFor(() => expect(document.activeElement).toBe(pageElements.transcript()));
        await waitFor(() => expect(pageElements.focusedActivity()).toBe(pageElements.activities()[1]));
        expect(pageElements.transcript().matches(':focus-visible')).toBe(true);

        // THEN: The focus indicator around the transcript should be red, dotted, and 4px wide, the "Aloha!" activity shows a dashed indicator.
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
