<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "botframework-webchat/": "/__dist__/packages/bundle/static/botframework-webchat/",
          "botframework-webchat-fluent-theme": "/__dist__/packages/fluent-theme/static/botframework-webchat-fluent-theme.js",
          "react": "/__dist__/packages/bundle/static/react.js",
          "react-dom": "/__dist__/packages/bundle/static/react-dom.js",
          "react-dom/client": "/__dist__/packages/bundle/static/react-dom/client.js"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { waitFor } from '@testduet/wait-for';
      import { createStoreWithOptions, ReactWebChat } from 'botframework-webchat';
      import { FluentThemeProvider } from 'botframework-webchat-fluent-theme';
      import { createElement } from 'react';
      import { createRoot } from 'react-dom/client';

      // TODO: This is for `createDirectLineEmulator` only, should find ways to eliminate this line.
      window.WebChat = { createStoreWithOptions };

      // The native controls of the audio player are in a closed shadow tree, `document.activeElement` is always the <audio> element.
      async function getFocusedControl() {
        const { name, role } = await testHelpers.getFocusedAccessibilityNode();

        return { name: name?.value, role: role?.value };
      }

      run(async function () {
        const { directLine, store } = testHelpers.createDirectLineEmulator();
        const variant = new URLSearchParams(location.search).get('variant');
        const webChatElement = createElement(ReactWebChat, { directLine, store });

        createRoot(document.getElementById('webchat')).render(
          variant ? createElement(FluentThemeProvider, { variant }, webChatElement) : webChatElement
        );

        await pageConditions.uiConnected();

        // GIVEN: The bot sends an audio attachment, similar to the "audio" command of the mock bot.
        await directLine.emulateIncomingActivity({
          attachments: [{ contentType: 'audio/wav', contentUrl: '/assets/hello-world.wav', name: 'Hello, World!' }],
          from: { role: 'bot' },
          type: 'message'
        });

        await pageConditions.numActivitiesShown(1);

        const audioElement = document.querySelector('audio');

        await pageConditions.mediaBufferStabilized(audioElement);

        // WHEN: Focus on the audio player via keyboard.
        pageObjects.focusTranscript();
        await host.sendKeys('ENTER');

        // THEN: The audio player should have the keyboard focus.
        await waitFor(() => expect(document.activeElement).toBe(audioElement));
        await waitFor(async () => expect(await getFocusedControl()).toEqual({ name: 'Hello, World!', role: 'Audio' }));

        // WHEN: TAB is pressed repeatedly.
        // THEN: The focus should move through every control of the audio player, in order.
        for (const control of [
          { name: 'play', role: 'button' },
          { name: 'audio time scrubber', role: 'slider' },
          { name: 'volume', role: 'slider' },
          { name: 'mute', role: 'button' },
          { name: 'show more media controls', role: 'button' }
        ]) {
          await host.sendTab();
          await waitFor(async () => expect(await getFocusedControl()).toEqual(control));
        }

        // WHEN: TAB is pressed on the last control.
        await host.sendTab();

        // THEN: The focus should stay in the activity and wrap to the audio player.
        await waitFor(async () => expect(await getFocusedControl()).toEqual({ name: 'Hello, World!', role: 'Audio' }));
        expect(document.activeElement).toBe(audioElement);

        // WHEN: SHIFT+TAB is pressed on the audio player.
        await host.sendShiftTab();

        // THEN: The focus should wrap to the last control of the audio player.
        await waitFor(async () =>
          expect(await getFocusedControl()).toEqual({ name: 'show more media controls', role: 'button' })
        );

        // WHEN: SHIFT+TAB is pressed again.
        await host.sendShiftTab();

        // THEN: The focus should move back through the controls of the audio player.
        await waitFor(async () => expect(await getFocusedControl()).toEqual({ name: 'mute', role: 'button' }));
        expect(document.activeElement).toBe(audioElement);
      });
    </script>
  </body>
</html>
