<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "botframework-webchat/": "/__dist__/packages/bundle/static/botframework-webchat/",
          "react": "/__dist__/packages/bundle/static/react.js",
          "react-dom": "/__dist__/packages/bundle/static/react-dom.js",
          "react-dom/client": "/__dist__/packages/bundle/static/react-dom/client.js"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { waitFor } from '@testduet/wait-for';
      import { createStoreWithOptions, ReactWebChat } from 'botframework-webchat';
      import { createElement } from 'react';
      import { createRoot } from 'react-dom/client';

      // TODO: This is for `createDirectLineEmulator` only, should find ways to eliminate this line.
      window.WebChat = { createStoreWithOptions };

      // The native controls of the video player are in a closed shadow tree, `document.activeElement` is always the <video> element.
      // The focused control is found in the accessibility tree instead.
      async function expectFocusedControl(mediaElement, expected) {
        await waitFor(async () => {
          const { name, role } = await testHelpers.getFocusedAccessibilityNode();

          expect({ name: name?.value, role: role?.value }).toEqual(expected);
        });

        expect(document.activeElement).toBe(mediaElement);
      }

      run(async function () {
        const { directLine, store } = testHelpers.createDirectLineEmulator();

        createRoot(document.getElementById('webchat')).render(createElement(ReactWebChat, { directLine, store }));

        await pageConditions.uiConnected();

        // GIVEN: The bot sends an animation card with a video and without `profile`, similar to the "animationcard" command of the mock bot.
        await directLine.emulateIncomingActivity({
          attachments: [
            {
              content: {
                autoloop: true,
                autostart: false,
                // `VideoContent` parses the URL with `new URL()`, so it must be absolute.
                media: [{ url: new URL('/assets/dark-green-video.webm', location.href).href }],
                subtitle: 'Animation test',
                text: 'No buttons, No Image, Autoloop, Sharable',
                title: 'Dark green video'
              },
              contentType: 'application/vnd.microsoft.card.animation'
            }
          ],
          from: { role: 'bot' },
          type: 'message'
        });

        await pageConditions.numActivitiesShown(1);

        const videoElement = document.querySelector('video');

        await pageConditions.mediaBufferStabilized(videoElement);

        // WHEN: Focus on the animation card via keyboard.
        pageObjects.focusTranscript();
        await host.sendKeys('ENTER');

        // THEN: The video player should have the keyboard focus, named after the title of the card.
        await expectFocusedControl(videoElement, { name: 'Dark green video', role: 'Video' });
        await host.snapshot('local');

        // WHEN: TAB is pressed.
        await host.sendTab();

        // THEN: The focus should move to the play button, the first control of the video player.
        await expectFocusedControl(videoElement, { name: 'play', role: 'button' });
        await host.snapshot('local');

        // WHEN: TAB is pressed.
        await host.sendTab();

        // THEN: The focus should move to the "enter full screen" button.
        await expectFocusedControl(videoElement, { name: 'enter full screen', role: 'button' });
        await host.snapshot('local');

        // WHEN: TAB is pressed.
        await host.sendTab();

        // THEN: The focus should move to the "show more media controls" button.
        await expectFocusedControl(videoElement, { name: 'show more media controls', role: 'button' });
        await host.snapshot('local');

        // WHEN: TAB is pressed.
        await host.sendTab();

        // THEN: The focus should move to the time scrubber, the last control of the video player.
        await expectFocusedControl(videoElement, { name: 'video time scrubber', role: 'slider' });
        await host.snapshot('local');

        // WHEN: TAB is pressed on the last control.
        await host.sendTab();

        // THEN: The focus should stay in the activity and wrap to the video player.
        await expectFocusedControl(videoElement, { name: 'Dark green video', role: 'Video' });
        await host.snapshot('local');

        // WHEN: SHIFT+TAB is pressed on the video player.
        await host.sendShiftTab();

        // THEN: The focus should stay in the activity and wrap to the last control of the video player.
        await expectFocusedControl(videoElement, { name: 'video time scrubber', role: 'slider' });
        await host.snapshot('local');

        // WHEN: SHIFT+TAB is pressed.
        await host.sendShiftTab();

        // THEN: The focus should move back to the "show more media controls" button.
        await expectFocusedControl(videoElement, { name: 'show more media controls', role: 'button' });
        await host.snapshot('local');

        // WHEN: SHIFT+TAB is pressed.
        await host.sendShiftTab();

        // THEN: The focus should move back to the "enter full screen" button.
        await expectFocusedControl(videoElement, { name: 'enter full screen', role: 'button' });
        await host.snapshot('local');

        // WHEN: SHIFT+TAB is pressed.
        await host.sendShiftTab();

        // THEN: The focus should move back to the play button.
        await expectFocusedControl(videoElement, { name: 'play', role: 'button' });
        await host.snapshot('local');

        // WHEN: SHIFT+TAB is pressed on the first control.
        await host.sendShiftTab();

        // THEN: The focus should move back to the video player.
        await expectFocusedControl(videoElement, { name: 'Dark green video', role: 'Video' });
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
