<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "botframework-webchat/": "/__dist__/packages/bundle/static/botframework-webchat/",
          "react": "/__dist__/packages/bundle/static/react.js",
          "react-dom": "/__dist__/packages/bundle/static/react-dom.js",
          "react-dom/client": "/__dist__/packages/bundle/static/react-dom/client.js"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { waitFor } from '@testduet/wait-for';
      import { createStoreWithOptions, ReactWebChat } from 'botframework-webchat';
      import { createElement } from 'react';
      import { createRoot } from 'react-dom/client';

      // TODO: This is for `createDirectLineEmulator` only, should find ways to eliminate this line.
      window.WebChat = { createStoreWithOptions };

      // The native controls of the video player are in a closed shadow tree, `document.activeElement` is always the <video> element.
      async function getFocusedControl() {
        const { name, role } = await testHelpers.getFocusedAccessibilityNode();

        return { name: name?.value, role: role?.value };
      }

      run(async function () {
        const { directLine, store } = testHelpers.createDirectLineEmulator();

        createRoot(document.getElementById('webchat')).render(createElement(ReactWebChat, { directLine, store }));

        await pageConditions.uiConnected();

        // GIVEN: The bot sends a video card without buttons, similar to the "videocard" command of the mock bot.
        await directLine.emulateIncomingActivity({
          attachments: [
            {
              content: {
                autoloop: true,
                autostart: false,
                // `VideoContent` parses the URL with `new URL()`, so it must be absolute.
                media: [{ profile: 'videocard', url: new URL('/assets/dark-green-video.webm', location.href).href }],
                subtitle: 'Video test',
                text: 'No buttons, No Image, Autoloop, No Sharable',
                title: 'Dark green video'
              },
              contentType: 'application/vnd.microsoft.card.video'
            }
          ],
          from: { role: 'bot' },
          type: 'message'
        });

        await pageConditions.numActivitiesShown(1);

        const videoElement = document.querySelector('video');

        await pageConditions.mediaBufferStabilized(videoElement);

        // WHEN: Focus on the video card via keyboard.
        pageObjects.focusTranscript();
        await host.sendKeys('ENTER');

        // THEN: The video player should have the keyboard focus, named after the title of the card.
        await waitFor(() => expect(document.activeElement).toBe(videoElement));
        await waitFor(async () =>
          expect(await getFocusedControl()).toEqual({ name: 'Dark green video', role: 'Video' })
        );

        // WHEN: SHIFT+TAB is pressed on the video player.
        await host.sendShiftTab();

        // THEN: The focus should wrap to the last control of the video player.
        await waitFor(async () =>
          expect(await getFocusedControl()).toEqual({ name: 'video time scrubber', role: 'slider' })
        );
        expect(document.activeElement).toBe(videoElement);

        // THEN: The time scrubber should show the focus indicator.
        await host.snapshot('local');

        // WHEN: TAB is pressed on the last control.
        await host.sendTab();

        // THEN: The focus should stay in the activity and wrap to the video player.
        await waitFor(async () =>
          expect(await getFocusedControl()).toEqual({ name: 'Dark green video', role: 'Video' })
        );
        expect(document.activeElement).toBe(videoElement);
      });
    </script>
  </body>
</html>
