<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
    <script crossorigin="anonymous" src="/test-harness.js"></script>
    <script crossorigin="anonymous" src="/test-page-object.js"></script>
    <script crossorigin="anonymous" src="/__dist__/webchat-es5.js"></script>
    <script type="importmap">
      {
        "imports": {
          "jest-mock": "https://esm.sh/jest-mock"
        }
      }
    </script>
  </head>
  <body>
    <main id="webchat"></main>
    <script type="module">
      import { spyOn } from 'jest-mock';

      run(async function () {
        // Direct Line starts the conversation with an XHR `POST /conversations`, its body carries the locale.
        const openSpy = spyOn(XMLHttpRequest.prototype, 'open');
        const sendSpy = spyOn(XMLHttpRequest.prototype, 'send');

        // WHEN: Web Chat connects with the locale in `conversationStartProperties`.
        WebChat.renderWebChat(
          {
            directLine: WebChat.createDirectLine({
              conversationStartProperties: {
                locale: 'en-US'
              },
              token: await testHelpers.token.fetchDirectLineToken()
            }),
            store: testHelpers.createStore()
          },
          document.getElementById('webchat')
        );

        await pageConditions.uiConnected();

        const startConversationRequest =
          openSpy.mock.contexts[
            openSpy.mock.calls.findIndex(
              ([method, url]) => method === 'POST' && new URL(url).pathname.endsWith('/conversations')
            )
          ];

        // THEN: The request to start the conversation should send the locale.
        expect(
          JSON.parse(sendSpy.mock.calls[sendSpy.mock.contexts.indexOf(startConversationRequest)][0])
        ).toHaveProperty('locale', 'en-US');
      });
    </script>
  </body>
</html>
