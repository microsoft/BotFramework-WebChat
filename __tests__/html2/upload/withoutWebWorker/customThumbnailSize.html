<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
    <script crossorigin="anonymous" src="/test-harness.js"></script>
    <script crossorigin="anonymous" src="/test-page-object.js"></script>
    <script crossorigin="anonymous" src="/__dist__/webchat-es5.js"></script>
  </head>
  <body>
    <main id="webchat"></main>
    <script>
      run(async function () {
        const { directLine, store } = testHelpers.createDirectLineEmulator();

        window.Worker = undefined;

        WebChat.renderWebChat(
          {
            directLine,
            store,
            styleOptions: {
              sendAttachmentOn: 'attach',
              uploadThumbnailContentType: 'image/png',
              uploadThumbnailHeight: 60,
              uploadThumbnailWidth: 120
            }
          },
          document.getElementById('webchat')
        );

        await pageConditions.uiConnected();

        await (
          await directLine.actPostActivity(() => pageObjects.uploadFile('seaofthieves.jpg', { waitForSend: false }))
        ).resolveAll();

        // Emulated, same as the mock bot's reply to an upload: it links the file.
        await directLine.emulateIncomingActivity({
          attachments: [
            {
              contentType: 'application/octet-stream',
              contentUrl: 'https://example.com/seaofthieves.jpg',
              name: 'seaofthieves.jpg'
            }
          ],
          text: 'You have uploaded:',
          type: 'message'
        });

        await pageConditions.minNumActivitiesShown(2);
        await pageConditions.allOutgoingActivitiesSent();
        await pageConditions.allImagesLoaded();

        // THEN: The uploaded image shows its 120 × 60 PNG thumbnail, scaled up.
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
