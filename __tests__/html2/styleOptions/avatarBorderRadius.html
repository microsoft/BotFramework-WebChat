<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "react": "/__dist__/packages/bundle/static/react.js",
          "react-dom": "/__dist__/packages/bundle/static/react-dom.js"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { createStoreWithOptions, renderWebChat } from 'botframework-webchat';

      // TODO: This is for `createDirectLineEmulator` only, should find ways to eliminate this line.
      window.WebChat = { createStoreWithOptions };

      run(async function () {
        const { directLine, store } = testHelpers.createDirectLineEmulator();

        // GIVEN: Web Chat with a number for the avatar border radius, instead of the default '50%'.
        renderWebChat(
          {
            directLine,
            store,
            styleOptions: {
              avatarBorderRadius: 4, // A number is in pixels.
              botAvatarInitials: 'WC',
              hideSendBox: true,
              userAvatarInitials: 'WW'
            }
          },
          document.getElementById('webchat')
        );

        await pageConditions.uiConnected();

        // WHEN: The user and the bot send a message.
        await directLine.emulateIncomingActivity({ from: { role: 'user' }, text: 'Hello, World!', type: 'message' });
        await directLine.emulateIncomingActivity({ from: { role: 'bot' }, text: 'Hello, World!', type: 'message' });

        await pageConditions.numActivitiesShown(2);

        // THEN: Both avatars should be squares with 4 pixel rounded corners.
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
