<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "react": "/__dist__/packages/bundle/static/react.js",
          "react-dom": "/__dist__/packages/bundle/static/react-dom.js"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { createStoreWithOptions, renderWebChat, testIds } from 'botframework-webchat';
      import { waitFor } from 'https://esm.sh/@testduet/wait-for';

      // TODO: Should find ways to eliminate this line.
      window.WebChat = { createStoreWithOptions, testIds };

      run(async function () {
        const { directLine, store } = testHelpers.createDirectLineEmulator();

        // GIVEN: A disabled Web Chat with a disabled text color.
        renderWebChat(
          {
            directLine,
            disabled: true,
            store,
            styleOptions: {
              sendBoxDisabledTextColor: 'DarkOrange',
              sendBoxTextColor: 'DarkGreen' // Not used while disabled.
            }
          },
          document.getElementById('webchat')
        );

        await pageConditions.uiConnected();

        // WHEN: The send box has text.
        store.dispatch({ type: 'WEB_CHAT/SET_SEND_BOX', payload: { text: 'Hello, World!' } });

        await waitFor(() => expect(pageElements.sendBoxTextBox().value).toBe('Hello, World!'));

        // THEN: The text is dark orange.
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
