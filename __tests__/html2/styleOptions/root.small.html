<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "react": "/__dist__/packages/bundle/static/react.js",
          "react-dom": "/__dist__/packages/bundle/static/react-dom.js"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { waitFor } from '@testduet/wait-for';
      import { createStoreWithOptions, renderWebChat, testIds } from 'botframework-webchat';

      // TODO: This is for `createDirectLineEmulator` and `pageElements` only, should find ways to eliminate this line.
      window.WebChat = { createStoreWithOptions, testIds };

      run(async function () {
        const { directLine, store } = testHelpers.createDirectLineEmulator();

        // GIVEN: A 180 pixels tall Web Chat with a multi-line send box.
        renderWebChat(
          {
            directLine,
            store,
            styleOptions: {
              backgroundColor: 'LightYellow',
              rootHeight: '180px', // Less than the expanded toaster and the 4-line send box together.
              sendBoxTextWrap: true
            }
          },
          document.getElementById('webchat')
        );

        await pageConditions.uiConnected();

        await directLine.emulateIncomingActivity('Hello, World!');
        await pageConditions.numActivitiesShown(1);

        // WHEN: 3 notifications are shown and the toaster is expanded.
        store.dispatch({
          payload: { id: 'info', level: 'info', message: 'Information notification.' },
          type: 'WEB_CHAT/SET_NOTIFICATION'
        });

        await pageConditions.toastShown(1);

        store.dispatch({
          payload: { id: 'warn', level: 'warn', message: 'Warning notification.' },
          type: 'WEB_CHAT/SET_NOTIFICATION'
        });

        await pageConditions.toasterExpandable();
        await pageObjects.clickToasterHeader();
        await pageConditions.toasterExpanded();
        await pageConditions.toastShown(2);

        store.dispatch({
          payload: { id: 'error', level: 'error', message: 'Error notification.' },
          type: 'WEB_CHAT/SET_NOTIFICATION'
        });

        await pageConditions.toastShown(3);

        // WHEN: The send box has 4 lines of text.
        store.dispatch({ type: 'WEB_CHAT/SET_SEND_BOX', payload: { text: 'One\nTwo\nThree\nFour' } });

        await waitFor(() => expect(pageElements.sendBoxTextBox().value).toBe('One\nTwo\nThree\nFour'));

        // THEN: The toaster and the send box keep their full height and overflow the root, and the transcript shrinks to nothing.
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
