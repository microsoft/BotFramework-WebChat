<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
    <style type="text/css">
      #webchat {
        /* The root is a flex item, so its z-index applies. */
        display: flex;
        flex-direction: column;
      }

      .band {
        background-color: Tomato;
        height: 40px;
        inset-inline: 0;
        position: fixed;
        top: 100px;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <main id="webchat"></main>
    <div class="band"></div>
    <script type="importmap">
      {
        "imports": {
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "react": "/__dist__/packages/bundle/static/react.js",
          "react-dom": "/__dist__/packages/bundle/static/react-dom.js"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { createStoreWithOptions, renderWebChat } from 'botframework-webchat';

      // TODO: This is for `createDirectLineEmulator` only, should find ways to eliminate this line.
      window.WebChat = { createStoreWithOptions };

      run(async function () {
        const searchParams = new URLSearchParams(location.search);
        const { directLine, store } = testHelpers.createDirectLineEmulator();

        // GIVEN: The root style options set to custom values, to `undefined`, or not set (defaults).
        renderWebChat(
          {
            directLine,
            store,
            styleOptions: searchParams.has('default')
              ? {}
              : searchParams.has('undefined')
                ? {
                    backgroundColor: undefined,
                    rootHeight: undefined,
                    rootWidth: undefined,
                    rootZIndex: undefined
                  }
                : {
                    backgroundColor: 'LightYellow',
                    rootHeight: 480, // Numbers are in pixels.
                    rootWidth: '75%', // Strings are used as is.
                    rootZIndex: 2 // Above the tomato band (z-index 1).
                  }
          },
          document.getElementById('webchat')
        );

        await pageConditions.uiConnected();

        await directLine.emulateIncomingActivity('Hello, World!');
        await pageConditions.numActivitiesShown(1);

        // THEN: Custom values: a light yellow Web Chat, 480 pixels tall and 75% wide, painted over the tomato band.
        // THEN: Defaults: a white Web Chat filling the page, under the tomato band.
        // THEN: `undefined`: a transparent Web Chat as tall as its content, under the tomato band.
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
