<!doctype html>
<html lang="en-US">
  <head>
    <title>Code: shows the title of the programming language</title>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "react": "https://esm.sh/react@18",
          "react-dom": "https://esm.sh/react-dom@18",
          "react-dom/": "https://esm.sh/react-dom@18/"
        }
      }
    </script>
    <script crossorigin="anonymous" src="/test-harness.js"></script>
    <script crossorigin="anonymous" src="/test-page-object.js"></script>
    <script type="module">
      import React from 'react';
      window.React = React;
    </script>
    <script defer crossorigin="anonymous" src="/__dist__/webchat-es5.js"></script>
  </head>
  <body>
    <main id="webchat"></main>
    <script type="module">
      import { waitFor } from '@testduet/wait-for';
      import React from 'react';
      import { createRoot } from 'react-dom/client';

      run(async function () {
        const {
          WebChat: { ReactWebChat, testIds }
        } = window; // Imports in UMD fashion.

        const { directLine, store } = testHelpers.createDirectLineEmulator();

        await host.windowSize(360, 1024, document.getElementById('webchat'));

        createRoot(document.getElementById('webchat')).render(
          React.createElement(ReactWebChat, {
            directLine,
            overrideLocalizedStrings: { PROGRAMMING_LANGUAGE_SHELL: 'Shell script' },
            store
          })
        );

        await pageConditions.uiConnected();

        const aiMessageEntity = Object.freeze({
          '@context': 'https://schema.org',
          '@id': '',
          '@type': 'Message',
          keywords: Object.freeze(['AIGeneratedContent']),
          type: 'https://schema.org/Message'
        });

        // Programming languages are sent as-is in "programmingLanguage", often in lowercase or as an alias.
        // Only JavaScript, Python, and TypeScript are highlighted by the bundled highlighter.
        const collapsibleSamples = Object.freeze([
          Object.freeze({
            isHighlighted: true,
            programmingLanguage: 'javascript',
            text: "console.log('Hello, World!');",
            title: 'JavaScript'
          }),
          Object.freeze({
            isHighlighted: true,
            programmingLanguage: 'TS',
            text: "const greeting: string = 'Hello, World!';",
            title: 'TypeScript'
          }),
          Object.freeze({
            isHighlighted: false,
            programmingLanguage: 'c#',
            text: 'Console.WriteLine("Hello, World!");',
            title: 'C#'
          }),
          // The title of "sh" ("Shell") is overridden via "overrideLocalizedStrings" above.
          Object.freeze({
            isHighlighted: false,
            programmingLanguage: 'sh',
            text: 'echo "Hello, World!"',
            title: 'Shell script'
          }),
          // Shell dialects keep their own name: only the first letter is capitalized.
          Object.freeze({
            isHighlighted: false,
            programmingLanguage: 'bash',
            text: "echo 'Hello, World!'",
            title: 'Bash'
          }),
          // Unknown programming language: only the first letter is capitalized.
          Object.freeze({
            isHighlighted: false,
            programmingLanguage: 'cobol',
            text: 'DISPLAY "Hello, World!".',
            title: 'Cobol'
          })
        ]);

        // WHEN: The bot sends collapsible messages with code (emulated).
        for (const { programmingLanguage, text } of collapsibleSamples) {
          await directLine.emulateIncomingActivity({
            entities: [
              {
                ...aiMessageEntity,
                abstract: `Code in ${programmingLanguage}`,
                isBasedOn: { '@type': 'SoftwareSourceCode', programmingLanguage, text },
                keywords: [...aiMessageEntity.keywords, 'Collapsible']
              }
            ],
            from: { role: 'bot' },
            text: '',
            type: 'message'
          });
        }

        await pageConditions.numActivitiesShown(collapsibleSamples.length);

        // WHEN: Expand every message.
        for (const summary of document.querySelectorAll('summary.collapsible-content__summary')) {
          await host.click(summary);

          await waitFor(() => expect(summary.getAttribute('aria-expanded')).toBe('true'));
        }

        // THEN: Code in JavaScript and TypeScript should be highlighted, regardless of the case of the programming language.
        await waitFor(() =>
          expect(
            Array.from(document.querySelectorAll('.code-block-content pre'), pre => pre.classList.contains('shiki'))
          ).toEqual(collapsibleSamples.map(({ isHighlighted }) => isHighlighted))
        );

        await pageConditions.scrollStabilized();

        // THEN: The code blocks should show the title of the programming language.
        expect(
          Array.from(document.querySelectorAll('.code-block-content__title'), ({ textContent }) => textContent)
        ).toEqual(collapsibleSamples.map(({ title }) => title));

        // THEN: The 6 expanded messages show their code under the titles JavaScript, TypeScript, C#, Shell script, Bash, and Cobol, only the first 2 highlighted.
        await host.snapshot('local');

        // WHEN: The bot sends a message with code in "py" (emulated).
        await directLine.emulateIncomingActivity({
          entities: [
            {
              ...aiMessageEntity,
              isBasedOn: { '@type': 'SoftwareSourceCode', programmingLanguage: 'py', text: "print('Hello, World!')" }
            }
          ],
          from: { role: 'bot' },
          text: 'Here is a sample in Python.',
          type: 'message'
        });

        await pageConditions.numActivitiesShown(collapsibleSamples.length + 1);
        await pageConditions.scrollStabilized();

        // WHEN: Click the "View code" button.
        await host.click(document.querySelector(`[data-testid="${testIds.viewCodeButton}"]`));

        // THEN: The "View code" dialog should show and be labelled with the title of the programming language.
        await waitFor(() => expect(document.querySelector('dialog[open] pre.shiki')).toBeTruthy());
        expect(document.querySelector('dialog[open] h2').textContent).toBe('Python');
        await expect(testHelpers.getAccessibleName(document.querySelector('dialog[open]'))).resolves.toBe(
          'Code sample: Python'
        );

        // THEN: The "View code" dialog shows the Python code under the "Python" title.
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
