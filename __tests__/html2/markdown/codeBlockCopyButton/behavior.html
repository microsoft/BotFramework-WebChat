<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
    <script crossorigin="anonymous" src="https://unpkg.com/@babel/standalone@7.26.5/babel.min.js"></script>
    <script crossorigin="anonymous" src="https://unpkg.com/react@16.8.6/umd/react.production.min.js"></script>
    <script crossorigin="anonymous" src="https://unpkg.com/react-dom@16.8.6/umd/react-dom.production.min.js"></script>
    <script crossorigin="anonymous" src="/test-harness.js"></script>
    <script crossorigin="anonymous" src="/test-page-object.js"></script>
    <script crossorigin="anonymous" src="/__dist__/webchat-es5.js"></script>
  </head>
  <body>
    <main id="webchat" style="position: relative"></main>
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for"
        }
      }
    </script>
    <script data-type="module" type="text/babel">
      import { waitFor } from '@testduet/wait-for';

      run(async function () {
        await host.sendDevToolsCommand('Browser.setPermission', {
          permission: { name: 'clipboard-write' },
          setting: 'granted'
        });

        await expect(navigator.permissions.query({ name: 'clipboard-write' })).resolves.toHaveProperty(
          'state',
          'granted'
        );

        const {
          ReactDOM: { render },
          WebChat: { ReactWebChat, testIds }
        } = window; // Imports in UMD fashion.

        const clock = lolex.createClock();
        const { directLine, store } = testHelpers.createDirectLineEmulator({ ponyfill: clock });

        const App = () => (
          <React.Fragment>
            <ReactWebChat directLine={directLine} ponyfill={clock} store={store} />
            <div style={{ gap: 8, position: 'absolute', top: 0, width: '100%' }}>
              <label>
                <div>Paste box</div>
                <textarea
                  data-testid="paste box"
                  spellCheck={false}
                  style={{ background: '#f0f0f0', border: 0, height: 100, padding: 0, resize: 'none', width: '100%' }}
                />
              </label>
            </div>
          </React.Fragment>
        );

        render(<App />, document.getElementById('webchat'));

        await pageConditions.webChatRendered();

        clock.tick(600);

        await pageConditions.uiConnected();

        await directLine.emulateIncomingActivity({
          text: `Laboris ut proident dolore nisi sint ullamco proident veniam est.

\`\`\`
In do pariatur id enim nisi adipisicing incididunt consectetur do velit quis aliqua ad.

Et proident est fugiat duis exercitation qui sunt amet ipsum.
\`\`\`

Ea sint elit anim enim voluptate aliquip aliqua nulla veniam.

<pre><code>Ea et pariatur sint Lorem ex veniam adipisicing.

Aliqua magna aliquip nisi quis.
</code></pre>

Cupidatat nulla duis dolor nulla ut pariatur minim incididunt quis adipisicing velit id Lorem.`,
          type: 'message'
        });

        await pageConditions.numActivitiesShown(1);

        const copyButton = document.querySelector(`[data-testid="${testIds.codeBlockCopyButton}"]`);

        const hideAndShowWebChat = () => {
          document.getElementById('webchat').style.display = 'none';
          document.body.offsetWidth; // Need for browser to refresh the layout.
          document.getElementById('webchat').style.display = '';
        };

        // WHEN: Focus on the "Copy" button via keyboard.
        await host.click(document.querySelector(`[data-testid="${testIds.sendBoxTextBox}"]`));
        await host.sendShiftTab(3);
        await host.sendKeys('ENTER');

        // THEN: Should focus on the "Copy" button.
        expect(document.activeElement).toBe(copyButton);
        expect(await testHelpers.getAccessibleName(copyButton)).toBe('Copy');
        await host.snapshot('local');

        // WHEN: Press ENTER on the "Copy" button.
        await host.sendKeys('ENTER');

        // THEN: The copy button should change to "Copied", including its accessible name.
        await waitFor(async () => expect(await testHelpers.getAccessibleName(copyButton)).toBe('Copied'));
        await host.snapshot('local');

        // WHEN: 1 second later, Web Chat is hidden and shown again.
        clock.tick(1_000);
        hideAndShowWebChat();

        // THEN: "Copied" should still be shown.
        // It should be a plain button: not a toggle button, and not a live region, which would raise another event for "Copied" and an assertive "Copy" later.
        const { name, properties, role } = await testHelpers.getAccessibilityNode(copyButton);

        expect(name.value).toBe('Copied');
        expect(role.value).toBe('button');
        expect(properties.map(property => property.name)).not.toContain('live');
        expect(properties.map(property => property.name)).not.toContain('pressed');

        // WHEN: Paste into the paste box.
        await host.click(document.querySelector('[data-testid="paste box"]'));
        await host.sendKeys('+CONTROL', 'v', '-CONTROL');

        // THEN: Should paste the code.
        expect(document.querySelector('[data-testid="paste box"]').value).toBe(
          'In do pariatur id enim nisi adipisicing incididunt consectetur do velit quis aliqua ad.\n\nEt proident est fugiat duis exercitation qui sunt amet ipsum.\n'
        );

        // WHEN: Just before 5 seconds after pressing the "Copy" button.
        clock.tick(3_999);

        // THEN: "Copied" should still be shown.
        expect(await testHelpers.getAccessibleName(copyButton)).toBe('Copied');

        // WHEN: 5 seconds after pressing the "Copy" button.
        clock.tick(1);

        // THEN: The "Copy" button should be back to normal.
        await waitFor(async () => expect(await testHelpers.getAccessibleName(copyButton)).toBe('Copy'));

        // WHEN: Hiding Web Chat and showing it back.
        await host.click(document.querySelector(`[data-testid="${testIds.sendBoxTextBox}"]`));
        hideAndShowWebChat();

        // THEN: The "Copy" button should be kept at normal.
        await host.snapshot('local');
        expect(await testHelpers.getAccessibleName(copyButton)).toBe('Copy');
      });
    </script>
  </body>
</html>
