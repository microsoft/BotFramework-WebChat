<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "react": "/__dist__/packages/bundle/static/react.js",
          "react-dom": "/__dist__/packages/bundle/static/react-dom.js"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { waitFor } from '@testduet/wait-for';
      import { createStoreWithOptions, renderWebChat } from 'botframework-webchat';

      // TODO: This is for `createDirectLineEmulator` only, should find ways to eliminate this line.
      window.WebChat = { createStoreWithOptions };

      run(
        async function () {
          const { directLine, store } = testHelpers.createDirectLineEmulator();

          // GIVEN: A custom accent color.
          renderWebChat(
            {
              directLine,
              store,
              styleOptions: {
                accent: 'DarkOrange',
                hideSendBox: true
              }
            },
            document.getElementById('webchat')
          );

          await pageConditions.uiConnected();

          // WHEN: The user sends a message and it fails to send.
          const sendMessage = await directLine.emulateOutgoingActivity('Hello, World!');

          sendMessage.rejectPostActivity(new Error('artificial error'));

          await waitFor(() => expect(pageElements.activityStatuses()[0].innerText).toBe('Send failed. Retry.'));

          // THEN: The "Retry" link is dark orange.
          await host.snapshot('local');

          // WHEN: The "Retry" link is focused.
          const retryButton = pageElements.activityStatuses()[0].querySelector('button');

          retryButton.focus();

          await waitFor(() => expect(document.activeElement).toBe(retryButton));

          // THEN: The dark orange "Retry" link has a focus indicator.
          await host.snapshot('local');
        },
        { ignoreErrors: 'artificial error' }
      );
    </script>
  </body>
</html>
