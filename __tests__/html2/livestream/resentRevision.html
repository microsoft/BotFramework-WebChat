<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
    <link href="./css/pauseAnimation.css" rel="stylesheet" type="text/css" />
    <script crossorigin="anonymous" src="https://unpkg.com/react@16.8.6/umd/react.production.min.js"></script>
    <script crossorigin="anonymous" src="https://unpkg.com/react-dom@16.8.6/umd/react-dom.production.min.js"></script>
    <script crossorigin="anonymous" src="/test-harness.js"></script>
    <script crossorigin="anonymous" src="/test-page-object.js"></script>
    <script crossorigin="anonymous" src="/__dist__/webchat-es5.js"></script>
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for"
        }
      }
    </script>
    <script type="module">
      import { waitFor } from '@testduet/wait-for';

      const streamingFormat = new URL(window.location.href).searchParams.get('streamingFormat') ?? 'channelData'; // can be entity or channelData

      function addLivestreamingMetadata(activity, livestreamingMetadata) {
        return streamingFormat === 'entity'
          ? {
              ...activity,
              entities: [...(activity.entities ?? []), { ...livestreamingMetadata, type: 'streaminfo' }]
            }
          : {
              ...activity,
              channelData: { ...activity.channelData, ...livestreamingMetadata }
            };
      }

      run(async function () {
        const {
          React: { createElement },
          ReactDOM: { render },
          WebChat: {
            Components: { BasicWebChat, Composer },
            decorator: { WebChatDecorator },
            hooks: { useActivityKeys, useGetActivitiesByKey }
          }
        } = window; // Imports in UMD fashion.

        const { directLine, store } = testHelpers.createDirectLineEmulator();
        let currentActivityKeysWithId = [];

        const Monitor = () => {
          const [activityKeys] = useActivityKeys();
          const getActivitiesByKey = useGetActivitiesByKey();

          currentActivityKeysWithId = Object.freeze(
            activityKeys.map(key => [key, getActivitiesByKey(key).map(({ id }) => id)])
          );

          return false;
        };

        render(
          createElement(
            WebChatDecorator,
            {},
            createElement(
              Composer,
              {
                directLine,
                store,
                styleOptions: { hideSendBox: true }
              },
              createElement(BasicWebChat),
              createElement(Monitor)
            )
          ),
          document.getElementById('webchat')
        );

        await pageConditions.uiConnected();

        // GIVEN: Bot is streaming a message with 2 revisions.
        const firstRevision = addLivestreamingMetadata(
          {
            from: { id: 'u-00001', name: 'Bot', role: 'bot' },
            id: 't-00001',
            text: 'A quick',
            timestamp: 1,
            type: 'typing'
          },
          { streamSequence: 1, streamType: 'streaming' }
        );

        const secondRevision = addLivestreamingMetadata(
          {
            from: { id: 'u-00001', name: 'Bot', role: 'bot' },
            id: 't-00002',
            text: 'A quick brown fox',
            timestamp: 2,
            type: 'typing'
          },
          { streamId: 't-00001', streamSequence: 2, streamType: 'streaming' }
        );

        await directLine.emulateIncomingActivity(firstRevision);
        await directLine.emulateIncomingActivity(secondRevision);

        // WHEN: The second revision is received again (same ID), e.g. after a reconnect.
        await directLine.emulateIncomingActivity(secondRevision);

        // WHEN: Bot continues with the third revision.
        // The store processes activities in order, so the re-sent revision is processed once this one appears.
        await directLine.emulateIncomingActivity(
          addLivestreamingMetadata(
            {
              from: { id: 'u-00001', name: 'Bot', role: 'bot' },
              id: 't-00003',
              text: 'A quick brown fox jumped over',
              timestamp: 3,
              type: 'typing'
            },
            { streamId: 't-00001', streamSequence: 3, streamType: 'streaming' }
          )
        );

        // THEN: Should keep each revision once in the store.
        expect(store.getState().activities.map(({ id }) => id)).toEqual(['t-00001', 't-00002', 't-00003']);

        // THEN: Should have 1 activity key with each revision once.
        await waitFor(() =>
          expect(currentActivityKeysWithId).toEqual([[expect.any(String), ['t-00001', 't-00002', 't-00003']]])
        );

        // THEN: Should display 1 message with the third revision.
        await pageConditions.numActivitiesShown(1);
        expect(pageElements.activityContents()[0]).toHaveProperty('textContent', 'A quick brown fox jumped over');
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
