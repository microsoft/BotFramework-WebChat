<!doctype html>
<html lang="en-US">
  <head>
    <title>Web Chat element: the Fluent theme renders into the shadow root of the element</title>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main>
      <webchat-element></webchat-element>
    </main>
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "botframework-webchat/": "/__dist__/packages/bundle/static/botframework-webchat/",
          "botframework-webchat-fluent-theme": "/__dist__/packages/fluent-theme/static/botframework-webchat-fluent-theme.js",
          "react": "/__dist__/packages/bundle/static/react.js",
          "react-dom": "/__dist__/packages/bundle/static/react-dom.js",
          "react-dom/client": "/__dist__/packages/bundle/static/react-dom/client.js"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { waitFor } from '@testduet/wait-for';
      import { createStoreWithOptions, testIds } from 'botframework-webchat';
      import { WebChatElement } from 'botframework-webchat/custom-element.js';
      import { FluentThemeProvider } from 'botframework-webchat-fluent-theme';

      run(async function () {
        // TODO: This is for `createDirectLineEmulator` and `pageElements` only, should find ways to eliminate this line.
        window.WebChat = { createStoreWithOptions, testIds };

        const { directLine, store } = testHelpers.createDirectLineEmulator();
        const webChatElement = document.querySelector('webchat-element');

        // WHEN: The element is defined, then the Fluent theme and props are set.
        customElements.define('webchat-element', WebChatElement);

        webChatElement.themeProvider = FluentThemeProvider;
        webChatElement.props = { directLine, store, styleOptions: { disableFileUpload: true } };

        const { shadowRoot } = webChatElement;

        pageElements.root(shadowRoot);

        await pageConditions.uiConnected();

        await directLine.emulateIncomingActivity({
          suggestedActions: { actions: [{ title: 'USA', type: 'imBack', value: 'USA' }] },
          text: 'Where are you from?'
        });

        // The Fluent theme renders suggested actions with its own test ID.
        await waitFor(() => expect(pageElements.allByTestId('send box suggested action')).toHaveLength(1));

        // THEN: Web Chat and all of its styles, the Fluent theme's included, are inside the shadow root, none in the document.
        expect(shadowRoot.contains(pageElements.transcript())).toBe(true);
        expect(document.querySelectorAll('style[data-emotion], style[data-webchat-injected]')).toHaveLength(0);

        // THEN: The bot asks "Where are you from?" with the "USA" suggested action, in the Fluent theme.
        await host.snapshot('local');

        // WHEN: The element is removed from the document.
        webChatElement.remove();

        // THEN: Web Chat and its styles are removed from the shadow root.
        await waitFor(() => expect(shadowRoot.childNodes).toHaveLength(0));
      });
    </script>
  </body>
</html>
