<!doctype html>
<html lang="en-US">
  <head>
    <title>
      Web Chat element: React 16 from the import map, without "react-dom/client", renders with ReactDOM.render()
    </title>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
    <style>
      /* Same as "body.jest input" in index.css, which does not reach into the shadow root: caret-color is inherited. */
      webchat-element {
        caret-color: transparent;
      }
    </style>
  </head>
  <body>
    <main>
      <webchat-element nonce="a1b2c3"></webchat-element>
      <div id="other-parent"></div>
    </main>
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "botframework-webchat/": "/__dist__/packages/bundle/static/botframework-webchat/",
          "react": "/__dist__/packages/bundle/static/react.baseline.js",
          "react-dom": "/__dist__/packages/bundle/static/react-dom.baseline.js"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import runWebChatElementTest from './private/runWebChatElementTest.mjs';

      // React 16.8.6, Web Chat's baseline.
      runWebChatElementTest({ reactMajorVersion: '16' });
    </script>
  </body>
</html>
