<!doctype html>
<html lang="en-US">
  <head>
    <title>React 16: renderWebChat() throws for an element inside a shadow root</title>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
    <script crossorigin="anonymous" src="/test-harness.js"></script>
    <script crossorigin="anonymous" src="/test-page-object.js"></script>
    <!-- No React on the page: Web Chat uses the React DOM 16.8.6 it bundles. -->
    <script crossorigin="anonymous" src="/__dist__/webchat-es5.js"></script>
  </head>
  <body>
    <main id="webchat">
      <template shadowrootmode="open">
        <div id="element-in-shadow-root"></div>
      </template>
    </main>
    <script>
      run(async function () {
        const { directLine, store } = testHelpers.createDirectLineEmulator();
        const { shadowRoot } = document.getElementById('webchat');
        const props = { directLine, store, styleOptions: { hideSendBox: true, stylesRoot: shadowRoot } };

        // GIVEN: Web Chat with React DOM 16.8.6, which would ignore clicks and typing in an element inside a shadow root.
        // WHEN: Web Chat is rendered by renderWebChat() into an element inside a shadow root.
        // THEN: It throws, suggesting the shadow root itself or React 17 or later.
        expect(() => WebChat.renderWebChat(props, shadowRoot.getElementById('element-in-shadow-root'))).toThrow(
          'renderWebChat() on React 16 does not support an element inside a shadow root, React 16 would ignore clicks and typing. Pass the shadow root itself instead of the element, or use React 17 or later (with webchat.js, set window.React and window.ReactDOM before loading it).'
        );

        expect(shadowRoot.getElementById('element-in-shadow-root').childNodes).toHaveLength(0);

        // WHEN: Web Chat is rendered by renderWebChat() into the shadow root itself, as the error says.
        WebChat.renderWebChat(props, shadowRoot);

        pageElements.root(shadowRoot);

        await pageConditions.uiConnected();

        await directLine.emulateIncomingActivity('Hello, World!');
        await pageConditions.numActivitiesShown(1);

        // THEN: Web Chat shows the message, rendered into the shadow root.
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
