<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "botframework-webchat/": "/__dist__/packages/bundle/static/botframework-webchat/",
          "react": "/__dist__/packages/bundle/static/react.js",
          "react-dom": "/__dist__/packages/bundle/static/react-dom.js",
          "react-dom/client": "/__dist__/packages/bundle/static/react-dom/client.js"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { waitFor } from '@testduet/wait-for';
      import { createStoreWithOptions, ReactWebChat } from 'botframework-webchat';
      import { createElement } from 'react';
      import { createRoot } from 'react-dom/client';

      // TODO: This is for `createDirectLineEmulator` only, should find ways to eliminate this line.
      window.WebChat = { createStoreWithOptions };

      run(async function () {
        const { directLine, store } = testHelpers.createDirectLineEmulator();
        const dir = new URLSearchParams(location.search).get('dir') || 'ltr';

        createRoot(document.getElementById('webchat')).render(
          createElement(ReactWebChat, { dir, directLine, store, styleOptions: { hideSendBox: true } })
        );

        await pageConditions.uiConnected();

        // GIVEN: A carousel with 4 hero cards.
        await directLine.emulateIncomingActivity({
          attachmentLayout: 'carousel',
          attachments: [1, 2, 3, 4].map(index => ({
            content: {
              buttons: [{ title: `Buy item ${index}`, type: 'imBack', value: `Buy item ${index}` }],
              text: 'Price: $XXX.XX USD',
              title: `Details about item ${index}`
            },
            contentType: 'application/vnd.microsoft.card.hero'
          })),
          from: { role: 'bot' },
          type: 'message'
        });

        await pageConditions.numActivitiesShown(1);

        const carouselLayout = document.querySelector('.carousel-layout');
        const cards = Array.from(carouselLayout.querySelectorAll('[aria-roledescription="attachment"]'));

        // GIVEN: Focus on the first card via keyboard, then press END.
        pageObjects.focusTranscript();
        await host.sendKeys('ENTER');
        await host.sendKeys('END');

        // THEN: The last card has focus, the carousel is scrolled to the end.
        expect(document.activeElement).toBe(cards[3]);
        await waitFor(() => expect(testHelpers.isCardInView(cards[3])).toBe(true));
        await pageConditions.carouselSettled(carouselLayout);
        await host.snapshot('local');

        // WHEN: Press TAB.
        await host.sendTab();

        // THEN: The button in the last card has focus.
        expect(document.activeElement).toBe(cards[3].querySelector('button'));
        await pageConditions.carouselSettled(carouselLayout);
        await host.snapshot('local');

        // WHEN: Press TAB.
        await host.sendTab();

        // THEN: The "Previous" flipper has focus, it is at the inline-start side: left in LTR, right in RTL.
        expect(document.activeElement).toBe(carouselLayout.querySelector('.carousel-flipper--previous'));
        expect(document.activeElement.getAttribute('aria-label')).toBe('Previous');
        await waitFor(() => expect(testHelpers.isFlipperShown(document.activeElement)).toBe(true));
        await host.snapshot('local');

        // WHEN: Press TAB.
        await host.sendTab();

        // THEN: The "Next" flipper has focus, it is at the inline-end side: right in LTR, left in RTL.
        // The carousel is at the end, the flipper is shown only because it has keyboard focus.
        expect(document.activeElement).toBe(carouselLayout.querySelector('.carousel-flipper--next'));
        expect(document.activeElement.getAttribute('aria-label')).toBe('Next');
        await waitFor(() => expect(testHelpers.isFlipperShown(document.activeElement)).toBe(true));

        // The "Previous" flipper slides out 1 second after it lost focus.
        await waitFor(
          () =>
            expect(testHelpers.isFlipperHidden(carouselLayout.querySelector('.carousel-flipper--previous'))).toBe(true),
          { timeout: 2000 }
        );
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
