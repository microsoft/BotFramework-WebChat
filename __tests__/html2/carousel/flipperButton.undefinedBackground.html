<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "react": "/__dist__/packages/bundle/static/react.js",
          "react-dom": "/__dist__/packages/bundle/static/react-dom.js"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { waitFor } from '@testduet/wait-for';
      import { createStoreWithOptions, renderWebChat } from 'botframework-webchat';

      // TODO: This is for `createDirectLineEmulator` only, should find ways to eliminate this line.
      window.WebChat = { createStoreWithOptions };

      run(async function () {
        const { directLine, store } = testHelpers.createDirectLineEmulator();

        // GIVEN: The focus and hover backgrounds of the flippers are explicitly undefined.
        renderWebChat(
          {
            directLine,
            store,
            styleOptions: {
              hideSendBox: true,
              transcriptOverlayButtonBackground: 'Navy',
              transcriptOverlayButtonBackgroundOnFocus: undefined, // Explicitly undefined: replaces the default of rgba(0, 0, 0, .8).
              transcriptOverlayButtonBackgroundOnHover: undefined,
              transcriptOverlayButtonColor: 'Yellow'
            }
          },
          document.getElementById('webchat')
        );

        await pageConditions.uiConnected();

        await directLine.emulateIncomingActivity({
          attachmentLayout: 'carousel',
          attachments: [1, 2, 3, 4].map(index => ({
            content: {
              buttons: [{ title: `Buy item ${index}`, type: 'imBack', value: `Buy item ${index}` }],
              subtitle: 'This is the subtitle',
              text: 'Price: $XXX.XX USD',
              title: `Details about item ${index}`
            },
            contentType: 'application/vnd.microsoft.card.hero'
          })),
          from: { role: 'bot' },
          type: 'message'
        });

        await pageConditions.numActivitiesShown(1);

        const nextFlipper = document.querySelector('.carousel-layout button[aria-label="Next"]');

        // The flipper is shown when its body has slid into the center of the flipper button.
        const getFlipperBodyOffset = () => {
          const bodyRect = nextFlipper.querySelector('.react-film__flipper__body').getBoundingClientRect();
          const buttonRect = nextFlipper.getBoundingClientRect();

          return Math.round(bodyRect.left + bodyRect.width / 2 - (buttonRect.left + buttonRect.width / 2));
        };

        // WHEN: The "Next" flipper is focused via keyboard.
        pageObjects.focusTranscript();
        await host.sendKeys('ENTER');
        await host.sendShiftTab();

        await waitFor(() => expect(document.activeElement).toBe(nextFlipper));
        await waitFor(() => expect(getFlipperBodyOffset()).toBe(0));
        expect(nextFlipper.matches(':hover')).toBe(false);

        // THEN: The focused "Next" flipper keeps its navy background, inside the focus indicator.
        await host.snapshot('local');

        // WHEN: The "Next" flipper loses focus and is hovered.
        nextFlipper.blur();
        await host.hover(nextFlipper);

        await waitFor(() => expect(nextFlipper.matches(':hover')).toBe(true));
        await waitFor(() => expect(getFlipperBodyOffset()).toBe(0));
        expect(nextFlipper.matches(':focus')).toBe(false);

        // THEN: The hovered "Next" flipper keeps its navy background, without the focus indicator.
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
