<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "botframework-webchat/": "/__dist__/packages/bundle/static/botframework-webchat/",
          "botframework-webchat-fluent-theme": "/__dist__/packages/fluent-theme/static/botframework-webchat-fluent-theme.js",
          "react": "/__dist__/packages/bundle/static/react.js",
          "react-dom": "/__dist__/packages/bundle/static/react-dom.js",
          "react-dom/client": "/__dist__/packages/bundle/static/react-dom/client.js"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { waitFor } from '@testduet/wait-for';
      import { createStoreWithOptions, ReactWebChat } from 'botframework-webchat';
      import { FluentThemeProvider } from 'botframework-webchat-fluent-theme';
      import { createElement } from 'react';
      import { createRoot } from 'react-dom/client';

      // TODO: This is for `createDirectLineEmulator` only, should find ways to eliminate this line.
      window.WebChat = { createStoreWithOptions };

      run(async function () {
        const { directLine, store } = testHelpers.createDirectLineEmulator();
        const variant = new URLSearchParams(location.search).get('variant');
        // The send box is not under test: hide it, including the send box of the Fluent theme.
        const webChatElement = createElement(ReactWebChat, {
          directLine,
          sendBoxMiddleware: [() => () => () => false],
          store
        });

        createRoot(document.getElementById('webchat')).render(
          variant ? createElement(FluentThemeProvider, { variant }, webChatElement) : webChatElement
        );

        await pageConditions.uiConnected();

        await directLine.emulateIncomingActivity({
          attachmentLayout: 'carousel',
          attachments: [1, 2, 3, 4].map(index => ({
            content: {
              buttons: [{ title: `Buy item ${index}`, type: 'imBack', value: `Buy item ${index}` }],
              subtitle: 'This is the subtitle',
              text: 'Price: $XXX.XX USD',
              title: `Details about item ${index}`
            },
            contentType: 'application/vnd.microsoft.card.hero'
          })),
          from: { role: 'bot' },
          type: 'message'
        });

        await pageConditions.numActivitiesShown(1);

        const nextFlipper = document.querySelector('.carousel-layout button[aria-label="Next"]');
        const previousFlipper = document.querySelector('.carousel-layout button[aria-label="Previous"]');

        const getFocusIndicatorStyle = flipper => {
          const { boxShadow, outlineColor, outlineOffset, outlineStyle, outlineWidth } = getComputedStyle(
            flipper.querySelector('.carousel-flipper__body')
          );

          return { boxShadow, outlineColor, outlineOffset, outlineStyle, outlineWidth };
        };

        // The flipper is shown when its body has slid into the center of the flipper button.
        const getFlipperBodyOffset = flipper => {
          const bodyRect = flipper.querySelector('.carousel-flipper__body').getBoundingClientRect();
          const buttonRect = flipper.getBoundingClientRect();

          return Math.round(bodyRect.left + bodyRect.width / 2 - (buttonRect.left + buttonRect.width / 2));
        };

        // Two-tone focus indicator: an outer ring in the transcript keyboard indicator color (black, 2px),
        // separated from the flipper by a band in the flipper foreground color (white, 2px).
        // It has at least 3:1 contrast against the flipper and against any content behind it.
        const visibleFocusIndicatorStyle = {
          boxShadow: 'rgb(255, 255, 255) 0px 0px 0px 2px',
          outlineColor: 'rgb(0, 0, 0)',
          outlineOffset: '2px',
          outlineStyle: 'solid',
          outlineWidth: '2px'
        };

        // GIVEN: The carousel is scrolled to the start, the "Previous" flipper is hidden.
        expect(document.querySelector('.carousel-filmstrip').scrollLeft).toBe(0);
        expect(previousFlipper.querySelector('.carousel-flipper__slider--at-edge')).toBeTruthy();

        // WHEN: Focus on the first attachment of the carousel via keyboard.
        pageObjects.focusTranscript();
        await host.sendKeys('ENTER');

        // THEN: The first attachment should have the focus, both flippers should stay hidden.
        await waitFor(() => expect(document.activeElement).toBe(pageElements.activityAttachments()[0][0]));
        expect(getFlipperBodyOffset(nextFlipper)).toBe(50);
        expect(previousFlipper.querySelector('.carousel-flipper__slider--at-edge')).toBeTruthy();

        // THEN: The first card shows the focus indicator, no flipper is shown.
        await host.snapshot('local');

        // WHEN: Press SHIFT-TAB to move focus to the "Next" flipper.
        await host.sendShiftTab();

        // THEN: The "Next" flipper should be shown with a visible focus indicator.
        expect(document.activeElement).toBe(nextFlipper);
        expect(nextFlipper.matches(':focus-visible')).toBe(true);
        await waitFor(() => expect(getFlipperBodyOffset(nextFlipper)).toBe(0));
        expect(getFocusIndicatorStyle(nextFlipper)).toEqual(visibleFocusIndicatorStyle);

        // THEN: The "Next" flipper shows at the right edge with a two-tone focus indicator, the first card has no focus indicator.
        await host.snapshot('local');

        // WHEN: Press SHIFT-TAB to move focus to the "Previous" flipper.
        await host.sendShiftTab();

        // THEN: The "Previous" flipper should be shown with a visible focus indicator, although the carousel cannot scroll back.
        expect(document.activeElement).toBe(previousFlipper);
        expect(previousFlipper.matches(':focus-visible')).toBe(true);
        await waitFor(() => expect(getFlipperBodyOffset(previousFlipper)).toBe(0));
        expect(getFocusIndicatorStyle(previousFlipper)).toEqual(visibleFocusIndicatorStyle);

        // THEN: The "Next" flipper should not show the focus indicator after losing focus.
        expect(getFocusIndicatorStyle(nextFlipper)).toHaveProperty('outlineStyle', 'none');

        // THEN: The "Next" flipper should auto-hide after losing focus (1s delay, then 300ms slide out).
        await waitFor(() => expect(getFlipperBodyOffset(nextFlipper)).toBe(50), { timeout: 2000 });

        // THEN: The "Previous" flipper shows at the left edge with a two-tone focus indicator, the "Next" flipper is hidden.
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
