<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "botframework-webchat/": "/__dist__/packages/bundle/static/botframework-webchat/",
          "botframework-webchat-fluent-theme": "/__dist__/packages/fluent-theme/static/botframework-webchat-fluent-theme.js",
          "react": "/__dist__/packages/bundle/static/react.js",
          "react-dom": "/__dist__/packages/bundle/static/react-dom.js",
          "react-dom/client": "/__dist__/packages/bundle/static/react-dom/client.js"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { waitFor } from '@testduet/wait-for';
      import { createStoreWithOptions, ReactWebChat } from 'botframework-webchat';
      import { FluentThemeProvider } from 'botframework-webchat-fluent-theme';
      import { createElement } from 'react';
      import { createRoot } from 'react-dom/client';

      // TODO: This is for `createDirectLineEmulator` only, should find ways to eliminate this line.
      window.WebChat = { createStoreWithOptions };

      run(async function () {
        const { directLine, store } = testHelpers.createDirectLineEmulator();
        const variant = new URLSearchParams(location.search).get('variant');
        // Hide the send box, it is not under test. The Fluent theme does not honor the `hideSendBox` style option.
        const webChatElement = createElement(ReactWebChat, {
          directLine,
          sendBoxMiddleware: [() => () => () => false],
          store
        });

        createRoot(document.getElementById('webchat')).render(
          variant ? createElement(FluentThemeProvider, { variant }, webChatElement) : webChatElement
        );

        await pageConditions.uiConnected();

        const createAdaptiveCard = index => ({
          content: {
            $schema: 'http://adaptivecards.io/schemas/adaptive-card.json',
            actions: [{ title: `Add item ${index}`, type: 'Action.Submit' }],
            body: [
              { size: 'large', text: `Item ${index}`, type: 'TextBlock', wrap: true },
              { id: `note-${index}`, label: `Note for item ${index}`, type: 'Input.Text', value: 'Hello' }
            ],
            type: 'AdaptiveCard',
            version: '1.5'
          },
          contentType: 'application/vnd.microsoft.card.adaptive'
        });

        // GIVEN: A carousel with Adaptive Card forms (text input and submit button) and a hero card with a button.
        await directLine.emulateIncomingActivity({
          attachmentLayout: 'carousel',
          attachments: [
            createAdaptiveCard(1),
            {
              content: {
                buttons: [{ title: 'Buy item 2', type: 'imBack', value: 'Buy item 2' }],
                text: 'Price: $XXX.XX USD',
                title: 'Details about item 2'
              },
              contentType: 'application/vnd.microsoft.card.hero'
            },
            createAdaptiveCard(3)
          ],
          from: { role: 'bot' },
          type: 'message'
        });

        await pageConditions.numActivitiesShown(1);

        const carouselLayout = document.querySelector('.carousel-layout');
        const carouselFilmstrip = carouselLayout.querySelector('.carousel-filmstrip');
        const cards = Array.from(carouselFilmstrip.querySelectorAll('[aria-roledescription="attachment"]'));
        const flippers = Array.from(carouselLayout.querySelectorAll('.react-film__flipper'));
        const input = cards[0].querySelector('input');
        const submitButton = cards[0].querySelector('button');
        const heroCardButton = cards[1].querySelector('button');

        const isCardInView = card => {
          const cardRect = card.getBoundingClientRect();
          const filmstripRect = carouselFilmstrip.getBoundingClientRect();

          return cardRect.left >= filmstripRect.left && cardRect.right <= filmstripRect.right;
        };

        // The flipper is hidden when its body has slid out of the flipper button (1s delay after scroll stops, then 300ms slide).
        const isFlipperHidden = flipper => {
          const bodyRect = flipper.querySelector('.react-film__flipper__body').getBoundingClientRect();
          const buttonRect = flipper.getBoundingClientRect();

          return bodyRect.right <= buttonRect.left || bodyRect.left >= buttonRect.right;
        };

        const waitForCarouselSettled = () =>
          waitFor(
            () => {
              expect(carouselLayout.querySelector('.react-film__main--scrolling')).toBeNull();
              expect(flippers.every(isFlipperHidden)).toBe(true);
            },
            { timeout: 5000 }
          );

        // Focus should be on the card itself, not on the form controls inside it.
        const expectFocusOnCard = async index => {
          expect(document.activeElement).toBe(cards[index]);
          expect(document.activeElement.matches(':focus-visible')).toBe(true);

          await waitFor(() => expect(isCardInView(cards[index])).toBe(true));
          await waitForCarouselSettled();

          expect(isCardInView(cards[index])).toBe(true);
        };

        expect(cards).toHaveLength(3);
        expect(input).toHaveProperty('value', 'Hello');
        expect(submitButton).toHaveProperty('textContent', 'Add item 1');
        expect(heroCardButton).toHaveProperty('textContent', 'Buy item 2');
        expect(carouselFilmstrip.scrollLeft).toBe(0);

        // WHEN: Focus on the first card via keyboard.
        pageObjects.focusTranscript();
        await host.sendKeys('ENTER');

        // THEN: The first card should have focus.
        await expectFocusOnCard(0);

        // WHEN: Press RIGHT.
        await host.sendKeys('ARROW_RIGHT');

        // THEN: The hero card should have focus, not its button.
        await expectFocusOnCard(1);

        await host.snapshot('local');

        // WHEN: Press RIGHT again.
        await host.sendKeys('ARROW_RIGHT');

        // THEN: The third card should have focus, not its form controls.
        await expectFocusOnCard(2);

        // WHEN: Press LEFT twice.
        await host.sendKeys('ARROW_LEFT');

        // THEN: Focus should move back over the form controls, from card to card.
        await expectFocusOnCard(1);

        await host.sendKeys('ARROW_LEFT');

        await expectFocusOnCard(0);
        expect(carouselFilmstrip.scrollLeft).toBe(0);

        // WHEN: Press TAB to focus on the text input inside the first card.
        await host.sendTab();

        // THEN: The text input should have focus.
        expect(document.activeElement).toBe(input);

        // WHEN: Press END, LEFT, and RIGHT inside the text input.
        // THEN: They should move the caret, without moving focus to another card or scrolling the carousel.
        await host.sendKeys('END');
        expect(document.activeElement).toBe(input);
        expect(input).toHaveProperty('selectionStart', 5);

        await host.sendKeys('ARROW_LEFT', 'ARROW_LEFT');
        expect(document.activeElement).toBe(input);
        expect(input).toHaveProperty('selectionStart', 3);

        await host.sendKeys('ARROW_RIGHT');
        expect(document.activeElement).toBe(input);
        expect(input).toHaveProperty('selectionStart', 4);

        await waitForCarouselSettled();
        expect(carouselFilmstrip.scrollLeft).toBe(0);

        await host.snapshot('local');

        // WHEN: Press TAB to focus on the submit button inside the first card.
        await host.sendTab();

        // THEN: The submit button should have focus.
        expect(document.activeElement).toBe(submitButton);

        // WHEN: Press LEFT and RIGHT on the submit button.
        // THEN: The submit button should keep focus.
        await host.sendKeys('ARROW_LEFT');
        expect(document.activeElement).toBe(submitButton);
        expect(carouselFilmstrip.scrollLeft).toBe(0);

        await host.sendKeys('ARROW_RIGHT');
        expect(document.activeElement).toBe(submitButton);

        // RIGHT on a button does not scroll the carousel.
        await waitForCarouselSettled();
        expect(carouselFilmstrip.scrollLeft).toBe(0);

        await host.snapshot('local');

        // WHEN: Press TAB to focus on the partially visible hero card.
        await host.sendTab();

        // THEN: The hero card should have focus and be scrolled fully into view.
        await expectFocusOnCard(1);

        const heroCardScrollLeft = carouselFilmstrip.scrollLeft;

        expect(heroCardScrollLeft).toBeGreaterThan(0);

        await host.snapshot('local');

        // WHEN: Press TAB to focus on the button inside the hero card.
        await host.sendTab();

        // THEN: The button inside the hero card should have focus, the carousel should not scroll.
        expect(document.activeElement).toBe(heroCardButton);
        await waitForCarouselSettled();
        expect(carouselFilmstrip.scrollLeft).toBe(heroCardScrollLeft);

        await host.snapshot('local');

        // WHEN: Press LEFT on the button inside the hero card.
        await host.sendKeys('ARROW_LEFT');

        // THEN: The button inside the hero card should keep focus, the carousel should not scroll.
        expect(document.activeElement).toBe(heroCardButton);
        await waitForCarouselSettled();
        expect(carouselFilmstrip.scrollLeft).toBe(heroCardScrollLeft);

        await host.snapshot('local');

        // WHEN: Press RIGHT on the button inside the hero card.
        await host.sendKeys('ARROW_RIGHT');

        // THEN: The button inside the hero card should keep focus, the carousel should not scroll.
        expect(document.activeElement).toBe(heroCardButton);
        await waitForCarouselSettled();
        expect(carouselFilmstrip.scrollLeft).toBe(heroCardScrollLeft);

        await host.snapshot('local');

        // WHEN: Press SHIFT-TAB to focus on the hero card, then press RIGHT.
        await host.sendShiftTab();

        expect(document.activeElement).toBe(cards[1]);

        await host.sendKeys('ARROW_RIGHT');

        // THEN: Arrow keys should move focus between cards again.
        await expectFocusOnCard(2);

        await host.snapshot('local');
      });
    </script>
  </body>
</html>
