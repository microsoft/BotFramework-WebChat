<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "react": "/__dist__/packages/bundle/static/react.js",
          "react-dom": "/__dist__/packages/bundle/static/react-dom.js"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { createStoreWithOptions, renderWebChat, testIds } from 'botframework-webchat';

      // TODO: Should find ways to eliminate this line.
      window.WebChat = { createStoreWithOptions, testIds };

      run(async function () {
        await host.windowSize(640, 640, document.getElementById('webchat'));

        const { directLine, store } = testHelpers.createDirectLineEmulator();

        renderWebChat({ directLine, store }, document.getElementById('webchat'));

        await pageConditions.uiConnected();

        await (
          await directLine.actPostActivity(() =>
            pageObjects.sendMessageViaSendBox('layout single', { waitForSend: false })
          )
        ).resolveAll();

        // Emulated, same as the mock bot's "layout single" command, with a local copy of its image.
        await directLine.emulateIncomingActivity({
          attachments: [
            {
              contentType: 'image/jpg',
              contentUrl: '/__tests__/html2/basic/assets/surface1.jpg',
              name: 'Microsoft Surface'
            }
          ],
          text: 'This command show single attachment in **default (stacked)** layout',
          type: 'message'
        });

        await pageConditions.numActivitiesShown(2);
        await pageConditions.allImagesLoaded();
        await pageConditions.allOutgoingActivitiesSent();
        await pageConditions.scrollStabilized();

        // THEN: The image is stacked below the message, in a bubble as wide as the message.
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
