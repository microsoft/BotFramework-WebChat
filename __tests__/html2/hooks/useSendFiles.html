<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "botframework-webchat/": "/__dist__/packages/bundle/static/botframework-webchat/",
          "react": "https://esm.sh/react@18",
          "react-dom": "https://esm.sh/react-dom@18",
          "react-dom/": "https://esm.sh/react-dom@18/"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { createStoreWithOptions, testIds } from 'botframework-webchat';
      import { useSendFiles } from 'botframework-webchat/hook.js';
      import createRenderHook from '/assets/esm/createRenderHook.js';

      window.WebChat = { createStoreWithOptions, testIds };

      run(
        async function () {
          const { directLine, store } = testHelpers.createDirectLineEmulator();
          const renderHook = createRenderHook(
            document.getElementById('webchat'),
            { directLine, store },
            { renderWebChat: true }
          );

          const sendFiles = await renderHook(() => useSendFiles());

          await pageConditions.uiConnected();

          const blob1 = new Blob([new ArrayBuffer(1024)]);
          const blob2 = new Blob([new ArrayBuffer(1024)]);

          blob1.name = 'index.png';
          blob2.name = 'index2.png';

          await (await directLine.actPostActivity(() => sendFiles([blob1, blob2]))).resolveAll();

          // Emulated, same as the mock bot's reply to an upload: it links each file.
          await directLine.emulateIncomingActivity({
            attachments: [
              {
                contentType: 'application/octet-stream',
                contentUrl: 'https://example.com/index.png',
                name: 'index.png'
              },
              {
                contentType: 'application/octet-stream',
                contentUrl: 'https://example.com/index2.png',
                name: 'index2.png'
              }
            ],
            text: 'You have uploaded:',
            type: 'message'
          });

          await pageConditions.numActivitiesShown(2);
          await pageConditions.allOutgoingActivitiesSent();

          // THEN: Both files are sent in one message with their sizes, followed by the bot's reply.
          await host.snapshot('local');
        },
        { ignoreErrors: true }
      );
    </script>
  </body>
</html>
