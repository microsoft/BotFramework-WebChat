<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
    <script crossorigin="anonymous" src="https://unpkg.com/react@16.8.6/umd/react.production.min.js"></script>
    <script crossorigin="anonymous" src="https://unpkg.com/react-dom@16.8.6/umd/react-dom.production.min.js"></script>
    <script crossorigin="anonymous" src="/test-harness.js"></script>
    <script crossorigin="anonymous" src="/test-page-object.js"></script>
    <script crossorigin="anonymous" src="/__dist__/webchat-es5.js"></script>
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for"
        }
      }
    </script>
    <script type="module">
      import { waitFor } from '@testduet/wait-for';

      run(async function () {
        const {
          React: { createElement },
          ReactDOM: { render },
          WebChat: { ReactWebChat }
        } = window; // Imports in UMD fashion.

        const { directLine, store } = testHelpers.createDirectLineEmulator();

        const renderWebChat = locale =>
          render(
            createElement(ReactWebChat, {
              directLine,
              locale,
              store,
              styleOptions: { hideSendBox: true, timestampFormat: 'absolute' }
            }),
            document.getElementById('webchat')
          );

        renderWebChat('en-US');

        await pageConditions.uiConnected();

        // WHEN: A message is received in the afternoon.
        await directLine.emulateIncomingActivity({
          from: { id: 'bot', role: 'bot' },
          text: 'Hello, World!',
          timestamp: '2019-08-08T16:41:12.000Z', // The test browser runs in UTC.
          type: 'message'
        });

        await pageConditions.numActivitiesShown(1);

        // THEN: In "en-US", the timestamp should use the 12-hour clock of the locale.
        expect(testHelpers.getAllTextContents(pageElements.activityStatuses()[0])).toEqual([
          'Sent at August 8 at 4:41 PM', // Screen reader text.
          'August 8 at 4:41 PM' // Visible text.
        ]);

        // THEN: Should show "August 8 at 4:41 PM".
        await host.snapshot('local');

        // WHEN: The locale is changed to "de-DE".
        renderWebChat('de-DE');

        // THEN: In "de-DE", the timestamp should use the 24-hour clock of the locale, without "PM".
        await waitFor(() =>
          expect(testHelpers.getAllTextContents(pageElements.activityStatuses()[0])).toEqual([
            'Gesendet um 8. August um 16:41', // Screen reader text.
            '8. August um 16:41' // Visible text.
          ])
        );

        // THEN: Should show "8. August um 16:41".
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
