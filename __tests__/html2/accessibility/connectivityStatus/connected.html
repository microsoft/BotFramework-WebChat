<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
    <script crossorigin="anonymous" src="/test-harness.js"></script>
    <script crossorigin="anonymous" src="/test-page-object.js"></script>
    <script crossorigin="anonymous" src="/__dist__/webchat-es5.js"></script>
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for"
        }
      }
    </script>
    <script type="module">
      import { waitFor } from '@testduet/wait-for';

      run(async function () {
        const { directLine, store } = testHelpers.createDirectLineEmulator();

        // GIVEN: Web Chat with the send box, as the issue is about what is read right before it.
        WebChat.renderWebChat(
          {
            directLine,
            store,
            styleOptions: { spinnerAnimationBackgroundImage: 'url(/assets/staticspinner.png)' }
          },
          document.getElementById('webchat')
        );

        await pageConditions.uiConnected();

        // WHEN: Connected and the bot sent a message.
        await directLine.emulateIncomingActivity('Hello, World!');
        await pageConditions.scrollToBottomCompleted();

        // Text in DOM order, as read in browse mode, from the end of the transcript to the send box (which has no text).
        const getTextsFromTerminator = () => {
          const texts = testHelpers.getAllTextContents(document.getElementById('webchat'));

          return texts.slice(texts.indexOf('End of chat history'));
        };

        // THEN: Connected, no status bar under the transcript.
        await host.snapshot('local');

        // THEN: Nothing is read between "End of chat history" and the send box.
        expect(getTextsFromTerminator()).toEqual(['End of chat history']);

        // ---

        // WHEN: The connection is interrupted.
        const { resolve } = directLine.emulateReconnect();

        await pageConditions.connectivityStatusShown('Network interruption occurred. Reconnecting…');
        await pageConditions.scrollToBottomCompleted(); // The transcript shrinks and sticks to the bottom.

        // THEN: The status bar shows "Network interruption occurred. Reconnecting…".
        await host.snapshot('local');

        // THEN: The status is read after "End of chat history", as before.
        expect(getTextsFromTerminator()).toEqual([
          'End of chat history',
          'Connectivity Status: Network interruption occurred. Reconnecting…',
          'Network interruption occurred. Reconnecting…' // Visible text, aria-hidden.
        ]);

        // ---

        // WHEN: Reconnected.
        resolve();

        await waitFor(() => expect(pageElements.connectivityStatus()).toBeFalsy());
        await pageConditions.scrollToBottomCompleted();

        // THEN: The status bar is gone.
        await host.snapshot('local');

        // THEN: Nothing is read between "End of chat history" and the send box again.
        expect(getTextsFromTerminator()).toEqual(['End of chat history']);
      });
    </script>
  </body>
</html>
