<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
    <!-- Shows the live region, so the snapshot shows the copy the announcements are computed from. -->
    <link href="/assets/accessibility.liveRegionAttachment.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "botframework-webchat/": "/__dist__/packages/bundle/static/botframework-webchat/",
          "jest-mock": "https://esm.sh/jest-mock",
          "react": "/__dist__/packages/bundle/static/react.js",
          "react-dom": "/__dist__/packages/bundle/static/react-dom.js",
          "react-dom/client": "/__dist__/packages/bundle/static/react-dom/client.js"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { waitFor } from '@testduet/wait-for';
      import { createStoreWithOptions, ReactWebChat } from 'botframework-webchat';
      import { spyOn } from 'jest-mock';
      import { createElement } from 'react';
      import { createRoot } from 'react-dom/client';

      // TODO: This is for `createDirectLineEmulator` only, should find ways to eliminate this line.
      window.WebChat = { createStoreWithOptions };

      run(async function () {
        // GIVEN: The browser supports `ariaNotify()`, recorded instead of announced.
        const ariaNotify = spyOn(Element.prototype, 'ariaNotify').mockImplementation(() => {});

        const { directLine, store } = testHelpers.createDirectLineEmulator();
        const root = createRoot(document.getElementById('webchat'));
        const renderWebChat = assistiveTechnologyAnnouncementTransport =>
          root.render(
            createElement(ReactWebChat, {
              directLine,
              store,
              styleOptions: {
                assistiveTechnologyAnnouncementTransport,
                hideSendBox: true,
                internalLiveRegionFadeAfter: 60000
              }
            })
          );

        // GIVEN: Web Chat sends announcements via the live region, and keeps its entries for 60 seconds.
        renderWebChat('live-region');

        await pageConditions.uiConnected();

        // GIVEN: The bot sent a message, read from the live region.
        await directLine.emulateIncomingActivity({ from: { role: 'bot' }, text: 'First message', type: 'message' });
        await pageConditions.numActivitiesShown(1);
        await waitFor(() => expect(pageElements.liveRegion().textContent).toContain('First message'));

        // WHEN: Web Chat is switched to send announcements via `ariaNotify()`.
        renderWebChat('aria-notify');

        await waitFor(() => expect(pageElements.liveRegion().getAttribute('aria-hidden')).toBe('true'));

        // WHEN: The bot sends another message.
        await directLine.emulateIncomingActivity({ from: { role: 'bot' }, text: 'Second message', type: 'message' });
        await pageConditions.numActivitiesShown(2);

        // THEN: Only the second message is announced: "connected" and the first message, already in the live region, are not repeated.
        await waitFor(() =>
          expect(ariaNotify.mock.calls).toEqual([['Bot said Second message', { priority: 'normal' }]])
        );

        // THEN: The live region is emptied, without waiting 60 seconds: after the switch, it is not read anymore.
        await waitFor(() => expect(pageElements.liveRegion().childElementCount).toBe(0));

        // THEN: The live region (top) is empty; the transcript shows both messages.
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
