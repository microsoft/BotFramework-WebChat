<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
    <script crossorigin="anonymous" src="/test-harness.js"></script>
    <script crossorigin="anonymous" src="/test-page-object.js"></script>
    <script crossorigin="anonymous" src="/__dist__/webchat-es5.js"></script>
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for"
        }
      }
    </script>
    <script type="module">
      import { waitFor } from '@testduet/wait-for';

      async function getSelectedButtonTexts() {
        const selectedButtonTexts = [];

        for (const pushButton of document.querySelectorAll('.ac-pushButton')) {
          const { description, properties } = await testHelpers.getAccessibilityNode(pushButton);

          // Action buttons are plain buttons, not toggle buttons.
          expect(properties?.find(({ name }) => name === 'pressed')).toBeUndefined();

          description?.value === 'Selected' && selectedButtonTexts.push(pushButton.innerText);
        }

        return selectedButtonTexts;
      }

      run(async function () {
        const directLine = await testHelpers.createDirectLineWithTranscript([
          {
            attachments: [
              {
                contentType: 'application/vnd.microsoft.card.adaptive',
                content: {
                  $schema: 'http://adaptivecards.io/schemas/adaptive-card.json',
                  type: 'AdaptiveCard',
                  version: '1.3',
                  body: [
                    {
                      type: 'TextBlock',
                      text: 'Do you want to take a survey?',
                      size: 'Large',
                      weight: 'Bolder',
                      wrap: true
                    },
                    {
                      type: 'ActionSet',
                      actions: [
                        {
                          type: 'Action.Submit',
                          title: 'Yes'
                        },
                        {
                          type: 'Action.Submit',
                          title: 'No'
                        }
                      ]
                    },
                    {
                      type: 'TextBlock',
                      text: 'Card action below',
                      size: 'Large',
                      weight: 'Bolder',
                      wrap: true
                    }
                  ],
                  actions: [
                    {
                      type: 'Action.Submit',
                      title: 'Submit card'
                    }
                  ]
                }
              }
            ],
            from: {
              id: 'bot',
              role: 'bot'
            },
            id: '1',
            timestamp: new Date().toISOString(),
            type: 'message'
          }
        ]);

        WebChat.renderWebChat(
          {
            directLine,
            store: testHelpers.createStore(),
            styleOptions: {
              autoScrollSnapOnActivity: 1,
              hideSendBox: true
            }
          },
          document.getElementById('webchat')
        );

        await pageConditions.uiConnected();
        await pageConditions.numActivitiesShown(1);
        await pageConditions.scrollToBottomCompleted();

        // SETUP: There should be 2 set of `ac-actionSet` containers.
        expect(document.querySelectorAll('.ac-actionSet')).toHaveLength(2);

        // SETUP: No 'ac-pushButton' should be selected.
        expect(await getSelectedButtonTexts()).toEqual([]);

        // SETUP: Focus on the transcript, the card is the last and only activity.
        pageObjects.focusTranscript();

        // WHEN: Pressing ENTER to focus inside the card.
        await host.sendKeys('ENTER');

        // THEN: The "Yes" button should have focus and nothing should be selected.
        await waitFor(() => expect(document.activeElement).toHaveProperty('innerText', 'Yes'));
        expect(await getSelectedButtonTexts()).toEqual([]);
        await host.snapshot('local');

        // WHEN: Pressing TAB.
        await host.sendTab();

        // THEN: The "No" button should have focus.
        await waitFor(() => expect(document.activeElement).toHaveProperty('innerText', 'No'));
        await host.snapshot('local');

        // WHEN: Pressing TAB.
        await host.sendTab();

        // THEN: The "Submit card" button should have focus.
        await waitFor(() => expect(document.activeElement).toHaveProperty('innerText', 'Submit card'));
        await host.snapshot('local');

        // WHEN: Pressing ENTER on the "Submit card" button.
        await host.sendKeys('ENTER');

        // THEN: Only the "Submit card" button should be selected, and it should keep focus.
        expect(document.activeElement).toHaveProperty('innerText', 'Submit card');
        await waitFor(() => expect(document.activeElement.hasAttribute('aria-describedby')).toBe(true)); // "Selected" description attached
        expect(await getSelectedButtonTexts()).toEqual(['Submit card']);
        await host.snapshot('local');

        // WHEN: Pressing SHIFT-TAB.
        await host.sendShiftTab();

        // THEN: The "No" button should have focus, the "Submit card" button should stay selected.
        await waitFor(() => expect(document.activeElement).toHaveProperty('innerText', 'No'));
        await host.snapshot('local');

        // WHEN: Pressing SHIFT-TAB.
        await host.sendShiftTab();

        // THEN: The "Yes" button should have focus, the "Submit card" button should stay selected.
        await waitFor(() => expect(document.activeElement).toHaveProperty('innerText', 'Yes'));
        await host.snapshot('local');

        // WHEN: Pressing ENTER on the "Yes" button.
        await host.sendKeys('ENTER');

        // THEN: Both the "Yes" and "Submit card" buttons should be selected, the "Yes" button should keep focus.
        expect(document.activeElement).toHaveProperty('innerText', 'Yes');
        await waitFor(() => expect(document.activeElement.hasAttribute('aria-describedby')).toBe(true)); // "Selected" description attached
        expect(await getSelectedButtonTexts()).toEqual(['Yes', 'Submit card']);
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
