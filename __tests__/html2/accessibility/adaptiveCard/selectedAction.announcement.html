<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
    <link href="/assets/accessibility.liveRegionAttachment.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "react": "/__dist__/packages/bundle/static/react.js",
          "react-dom": "/__dist__/packages/bundle/static/react-dom.js",
          "react-dom/client": "/__dist__/packages/bundle/static/react-dom/client.js"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { waitFor } from '@testduet/wait-for';
      import { createStoreWithOptions, ReactWebChat } from 'botframework-webchat';
      import { createElement } from 'react';
      import { createRoot } from 'react-dom/client';

      // TODO: This is for `createDirectLineEmulator` only, should find ways to eliminate this line.
      window.WebChat = { createStoreWithOptions };

      function getLiveRegionTexts() {
        return Array.from(pageElements.liveRegion().children, child =>
          testHelpers.getAllTextContents(child).join('\n')
        );
      }

      run(async function () {
        const { directLine, store } = testHelpers.createDirectLineEmulator();

        createRoot(document.getElementById('webchat')).render(
          createElement(ReactWebChat, {
            directLine,
            store,
            // Keep everything announced in the live region, which is made visible by the CSS above.
            styleOptions: { hideSendBox: true, internalLiveRegionFadeAfter: 60_000 }
          })
        );

        await pageConditions.uiConnected();

        // GIVEN: A hero card with two "IM back" buttons, similar to the "herocard" command of the mock bot.
        await directLine.emulateIncomingActivity({
          attachments: [
            {
              content: {
                buttons: [
                  { title: 'Places To Buy', type: 'imBack', value: 'Places To Buy' },
                  { title: 'Related Products', type: 'imBack', value: 'Related Products' }
                ],
                title: 'Details about image 1'
              },
              contentType: 'application/vnd.microsoft.card.hero'
            }
          ],
          from: { role: 'bot' },
          type: 'message'
        });

        await pageConditions.numActivitiesShown(1);
        await pageConditions.liveRegionStabilized();

        const [placesToBuyButton, relatedProductsButton] = document.querySelectorAll('.ac-pushButton');
        const liveRegionTextsBeforePress = getLiveRegionTexts();

        expect(placesToBuyButton).toHaveProperty('textContent', 'Places To Buy');
        expect(relatedProductsButton).toHaveProperty('textContent', 'Related Products');
        expect(liveRegionTextsBeforePress).not.toContain('Selected');

        // WHEN: Focus on the transcript and press ENTER to move focus into the card, i.e. the "Places To Buy" button.
        pageObjects.focusTranscript();
        await host.sendKeys('ENTER');

        // THEN: The "Places To Buy" button should be focused and nothing new is announced.
        expect(document.activeElement).toBe(placesToBuyButton);
        expect(getLiveRegionTexts()).toEqual(liveRegionTextsBeforePress);
        await pageConditions.scrollStabilized();
        await host.snapshot('local');

        // WHEN: Press ENTER to press the "Places To Buy" button.
        (await directLine.actPostActivity(() => host.sendKeys('ENTER'))).resolveAll();

        await pageConditions.numActivitiesShown(2);
        await pageConditions.allOutgoingActivitiesSent();

        // THEN: "Selected" should be announced once, right before the message sent by the button.
        await waitFor(() =>
          expect(getLiveRegionTexts()).toEqual([...liveRegionTextsBeforePress, 'Selected', 'You said\nPlaces To Buy'])
        );

        // THEN: The live region should show "Selected", and the "Places To Buy" button should look selected and keep the focus.
        expect(document.activeElement).toBe(placesToBuyButton);
        await pageConditions.scrollToBottomCompleted();
        await host.snapshot('local');

        // WHEN: Press TAB to move focus to the "Related Products" button.
        await host.sendTab();

        // THEN: The "Related Products" button should be focused and nothing new is announced.
        expect(document.activeElement).toBe(relatedProductsButton);
        expect(getLiveRegionTexts()).toEqual([...liveRegionTextsBeforePress, 'Selected', 'You said\nPlaces To Buy']);
        await host.snapshot('local');

        // WHEN: Press SHIFT + TAB to revisit the selected "Places To Buy" button.
        await host.sendShiftTab();

        // THEN: The "Places To Buy" button should be focused and "Selected" should not be announced again.
        //       On revisit, screen readers read "Selected" from the description of the button instead.
        expect(document.activeElement).toBe(placesToBuyButton);
        expect((await testHelpers.getAccessibilityNode(placesToBuyButton)).description?.value).toBe('Selected');
        expect(getLiveRegionTexts()).toEqual([...liveRegionTextsBeforePress, 'Selected', 'You said\nPlaces To Buy']);
        await host.snapshot('local');

        // WHEN: Press ENTER to press the selected "Places To Buy" button again.
        (await directLine.actPostActivity(() => host.sendKeys('ENTER'))).resolveAll();

        await pageConditions.numActivitiesShown(3);
        await pageConditions.allOutgoingActivitiesSent();

        // THEN: The button performs its action again, so "Selected" should be announced again, right before the second message.
        await waitFor(() =>
          expect(getLiveRegionTexts()).toEqual([
            ...liveRegionTextsBeforePress,
            'Selected',
            'You said\nPlaces To Buy',
            'Selected',
            'You said\nPlaces To Buy'
          ])
        );

        // THEN: The live region should show "Selected" twice, and the "Places To Buy" button should still look selected and keep the focus.
        expect(document.activeElement).toBe(placesToBuyButton);
        await pageConditions.scrollToBottomCompleted();
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
