<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
    <!-- Shows the live region, so the snapshots show the copy sent to screen readers. -->
    <link href="/assets/accessibility.liveRegionAttachment.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "botframework-webchat/": "/__dist__/packages/bundle/static/botframework-webchat/",
          "react": "/__dist__/packages/bundle/static/react.js",
          "react-dom": "/__dist__/packages/bundle/static/react-dom.js",
          "react-dom/client": "/__dist__/packages/bundle/static/react-dom/client.js"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { waitFor } from '@testduet/wait-for';
      import { createStoreWithOptions, ReactWebChat } from 'botframework-webchat';
      import { createElement } from 'react';
      import { createRoot } from 'react-dom/client';

      // TODO: This is for `createDirectLineEmulator` only, should find ways to eliminate this line.
      window.WebChat = { createStoreWithOptions };

      run(async function () {
        const { directLine, store } = testHelpers.createDirectLineEmulator();
        const root = createRoot(document.getElementById('webchat'));
        const render = props =>
          root.render(
            createElement(ReactWebChat, {
              directLine,
              store,
              // Keeps the live region copy of new messages, so it can be seen in the snapshots.
              styleOptions: { hideSendBox: true, internalLiveRegionFadeAfter: 60000 },
              ...props
            })
          );

        // Role descriptions of the message and attachments, per activity.
        // Selects by role, not by the attribute, so an element missing its role description shows up as null.
        const getRoleDescriptions = () =>
          pageElements
            .activities()
            .map(activity =>
              Array.from(activity.querySelectorAll('[role="group"], [role="listitem"]'), element =>
                element.getAttribute('aria-roledescription')
              )
            );

        // GIVEN: Web Chat in the default locale (en-US).
        render({});

        await pageConditions.uiConnected();

        // GIVEN: A message with text and 2 attachments in each attachment layout.
        for (const attachmentLayout of ['list', 'carousel']) {
          await directLine.emulateIncomingActivity({
            attachmentLayout,
            attachments: [1, 2].map(index => ({
              content: { title: `Card ${index} (${attachmentLayout})` },
              contentType: 'application/vnd.microsoft.card.hero'
            })),
            from: { role: 'bot' },
            text: `Message with ${attachmentLayout} attachments`,
            type: 'message'
          });
        }

        await pageConditions.numActivitiesShown(2);
        await pageConditions.liveRegionStabilized();

        // THEN: A stacked message, then a carousel message, each with its text and 2 cards.
        // THEN: The live region (top) shows what screen readers announce for each: "Bot said:", the text, and "A card:" per card, without role descriptions.
        await host.snapshot('local');

        // THEN: Message and attachments are described in English.
        expect(getRoleDescriptions()).toEqual([
          ['message', 'attachment', 'attachment'],
          ['message', 'attachment', 'attachment']
        ]);

        // WHEN: The host switches to German and provides the strings (no translation in de-DE yet).
        render({
          locale: 'de-DE',
          overrideLocalizedStrings: {
            ACTIVITY_ATTACHMENT_ARIA_ROLE_ALT: 'Anhang',
            ACTIVITY_MESSAGE_ARIA_ROLE_ALT: 'Nachricht'
          }
        });

        // THEN: Message and attachments are described in German.
        await waitFor(() =>
          expect(getRoleDescriptions()).toEqual([
            ['Nachricht', 'Anhang', 'Anhang'],
            ['Nachricht', 'Anhang', 'Anhang']
          ])
        );

        // WHEN: The bot sends another message.
        await directLine.emulateIncomingActivity({
          attachments: [{ content: { title: 'Card 3' }, contentType: 'application/vnd.microsoft.card.hero' }],
          from: { role: 'bot' },
          text: 'Message after switching to German',
          type: 'message'
        });

        await pageConditions.numActivitiesShown(3);
        await pageConditions.liveRegionStabilized();

        // THEN: The live region shows the new message announced in German ("Bot sagte:", "Eine Karte:", from de-DE); the earlier copies are re-rendered in German too.
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
