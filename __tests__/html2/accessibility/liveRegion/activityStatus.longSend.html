<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
    <!-- Shows the live region, so the snapshots show what is announced. -->
    <link href="/assets/accessibility.liveRegionAttachment.css" rel="stylesheet" type="text/css" />
    <script crossorigin="anonymous" src="/test-harness.js"></script>
    <script crossorigin="anonymous" src="/test-page-object.js"></script>
    <script crossorigin="anonymous" src="/__dist__/webchat-es5.js"></script>
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for"
        }
      }
    </script>
    <script type="module">
      import { waitFor } from '@testduet/wait-for';

      run(async function () {
        const clock = lolex.createClock();
        const { directLine, store } = testHelpers.createDirectLineEmulator({ ponyfill: clock });

        // GIVEN: Web Chat keeps what it announced in the live region, so it can be checked and seen in the snapshots.
        WebChat.renderWebChat(
          {
            directLine,
            ponyfill: clock,
            store,
            styleOptions: {
              hideSendBox: true,
              internalLiveRegionFadeAfter: 60_000
            }
          },
          document.getElementById('webchat')
        );

        await pageConditions.webChatRendered();

        clock.tick(600); // Dismisses "Connecting…".

        await pageConditions.uiConnected();

        const getLiveRegionTexts = () =>
          Array.from(pageElements.liveRegion().children, child => testHelpers.getAllTextContents(child).join('\n'));

        // WHEN: The user sends a message, which the server does not acknowledge for a while.
        const sendMessage = await directLine.emulateOutgoingActivity('Hello, World!');

        await pageConditions.numActivitiesShown(1);

        // WHEN: 2.999 seconds later.
        clock.tick(2_999);

        // THEN: Only the message is announced.
        await waitFor(() =>
          expect(getLiveRegionTexts()).toEqual([
            'connecting', // Announced by the toaster, which announces the first notification of every ID.
            'You said\nHello, World!'
          ])
        );
        expect(pageElements.activityStatuses()[0].innerText).toContain('Sending');

        // THEN: The live region shows "You said Hello, World!", the message shows "Sending".
        await host.snapshot('local');

        // ---

        // WHEN: 3 seconds after sending.
        clock.tick(1);

        // THEN: "Sending message." is announced.
        await waitFor(() =>
          expect(getLiveRegionTexts()).toEqual(['connecting', 'You said\nHello, World!', 'Sending message.'])
        );

        // THEN: The live region shows "Sending message." under the message.
        await host.snapshot('local');

        // ---

        // WHEN: 19.999 seconds after sending, the message is still sending (`sendTimeout` defaults to 20 seconds).
        clock.tick(16_999);

        // THEN: "Sending message." is not announced again.
        // No wait needed: the fake clock runs timers inside `tick()` and React 16 (`webchat-es5.js`) renders synchronously.
        expect(pageElements.activityStatuses()[0].innerText).toContain('Sending');
        expect(getLiveRegionTexts()).toEqual(['connecting', 'You said\nHello, World!', 'Sending message.']);

        // ---

        // WHEN: The server acknowledges the message.
        await sendMessage.resolveAll();

        await waitFor(() => expect(pageElements.activityStatuses()[0].innerText).toContain('Just now'));

        // WHEN: 10 seconds later.
        clock.tick(10_000);

        // THEN: Nothing else is announced.
        expect(getLiveRegionTexts()).toEqual(['connecting', 'You said\nHello, World!', 'Sending message.']);

        // THEN: The message shows "Just now", the live region still shows "Sending message." once.
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
