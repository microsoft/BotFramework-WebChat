<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
    <!-- Shows the live region, so the snapshot shows the copy sent to screen readers. -->
    <link href="/assets/accessibility.liveRegionAttachment.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "botframework-webchat/": "/__dist__/packages/bundle/static/botframework-webchat/",
          "react": "/__dist__/packages/bundle/static/react.js",
          "react-dom": "/__dist__/packages/bundle/static/react-dom.js",
          "react-dom/client": "/__dist__/packages/bundle/static/react-dom/client.js"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { createStoreWithOptions, ReactWebChat } from 'botframework-webchat';
      import { createElement } from 'react';
      import { createRoot } from 'react-dom/client';

      // TODO: This is for `createDirectLineEmulator` only, should find ways to eliminate this line.
      window.WebChat = { createStoreWithOptions };

      run(async function () {
        const { directLine, store } = testHelpers.createDirectLineEmulator();

        // GIVEN: Web Chat keeps the live region copy of new messages, so it can be checked and seen in the snapshot.
        createRoot(document.getElementById('webchat')).render(
          createElement(ReactWebChat, {
            directLine,
            store,
            styleOptions: { hideSendBox: true, internalLiveRegionFadeAfter: 60000 }
          })
        );

        await pageConditions.uiConnected();

        // WHEN: The bot sends an Adaptive Card with date and time functions, and without "speak".
        await directLine.emulateIncomingActivity({
          attachments: [
            {
              content: {
                $schema: 'http://adaptivecards.io/schemas/adaptive-card.json',
                body: [
                  {
                    text: 'Arrives {{DATE(2026-10-20T15:00:00Z, SHORT)}} at {{TIME(2026-10-20T15:00:00Z)}}',
                    type: 'TextBlock',
                    wrap: true
                  }
                ],
                type: 'AdaptiveCard',
                version: '1.5'
              },
              contentType: 'application/vnd.microsoft.card.adaptive'
            }
          ],
          from: { role: 'bot' },
          type: 'message'
        });

        await pageConditions.numActivitiesShown(1);
        await pageConditions.liveRegionStabilized();

        // Adaptive Cards formats the date and time with the browser locale and time zone, so read them from the card as shown.
        const cardText = pageElements.activities()[0].querySelector('.ac-textBlock').textContent.trim();

        // THEN: The card shows the formatted date and time, not the functions.
        expect(cardText).toEqual(expect.stringMatching(/^Arrives \S.* at \S/u));
        expect(cardText).not.toContain('{{');

        // THEN: The live region copy reads the same formatted date and time as the card.
        expect(
          testHelpers
            .getAllTextContents(pageElements.liveRegion().querySelector('.webchat__live-region-activity'))
            .map(text => text.trim())
        ).toEqual(['Bot said:', `A card: ${cardText}`]);

        // THEN: The card and the live region below show the same formatted date and time.
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
