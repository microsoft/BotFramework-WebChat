<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
    <link href="/assets/accessibility.liveRegionAttachment.css" rel="stylesheet" type="text/css" />
    <script crossorigin="anonymous" src="https://unpkg.com/@babel/standalone@7.8.7/babel.min.js"></script>
    <script crossorigin="anonymous" src="https://unpkg.com/react@16.8.6/umd/react.development.js"></script>
    <script crossorigin="anonymous" src="https://unpkg.com/react-dom@16.8.6/umd/react-dom.development.js"></script>
    <script crossorigin="anonymous" src="/test-harness.js"></script>
    <script crossorigin="anonymous" src="/test-page-object.js"></script>
    <script crossorigin="anonymous" src="/__dist__/webchat-es5.js"></script>
  </head>
  <body>
    <main id="webchat"></main>
    <script type="text/babel" data-presets="env,stage-3,react">
      const {
        ReactDOM: { render },
        testHelpers: { createDirectLineEmulator },
        WebChat: {
          Components: { BasicWebChat, Composer }
        }
      } = window;

      run(async function () {
        const { directLine, store } = createDirectLineEmulator();

        render(
          <Composer directLine={directLine} store={store} styleOptions={{ internalLiveRegionFadeAfter: 60000 }}>
            <BasicWebChat />
          </Composer>,
          document.getElementById('webchat')
        );

        await pageConditions.uiConnected();

        await (
          await directLine.actPostActivity(() => pageObjects.sendMessageViaSendBox('audio', { waitForSend: false }))
        ).resolveAll();

        // Emulated, similar to the mock bot's "audio" command.
        await directLine.emulateIncomingActivity({
          attachments: [{ contentType: 'audio/wav', contentUrl: '/assets/hello-world.wav', name: 'BotFramework Test' }],
          text: '',
          type: 'message'
        });

        await pageConditions.numActivitiesShown(2);
        await pageConditions.allImagesLoaded();
        await pageConditions.allOutgoingActivitiesSent();
        await pageConditions.scrollToBottomCompleted();
        await pageConditions.liveRegionStabilized();

        const audioElement = document.getElementsByTagName('audio')[0];

        await pageConditions.mediaBufferStabilized(audioElement);

        audioElement.removeAttribute('controls');

        await pageObjects.verifyDOMIntegrity();
        await pageObjects.focusSendBoxTextBox();

        await host.sendShiftTab(3);

        // THEN: The live region announces the audio clip and the transcript shows the audio player without controls.
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
