<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
    <script crossorigin="anonymous" src="/test-harness.js"></script>
    <script crossorigin="anonymous" src="/test-page-object.js"></script>
    <script crossorigin="anonymous" src="/__dist__/webchat-es5.js"></script>
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for"
        }
      }
    </script>
    <script type="module">
      import { waitFor } from '@testduet/wait-for';

      run(
        async function () {
          const { directLine, store } = testHelpers.createDirectLineEmulator();

          WebChat.renderWebChat(
            {
              directLine,
              store,
              styleOptions: {
                groupTimestamp: 60000,
                sendTimeout: 5000
              }
            },
            document.getElementById('webchat')
          );

          await pageConditions.uiConnected();

          const sendMessage = await directLine.emulateOutgoingActivity('Hello, World!');

          // WHEN: The echo back of the message, which has a timestamp, arrives before the message is sent.
          await sendMessage.echoBack(activity => ({ ...activity, timestamp: '2026-10-17T11:50:00Z' }));

          await directLine.emulateIncomingActivity({ text: 'Aloha!', timestamp: '2026-10-17T11:51:00Z' });

          // Summaries are hidden from scan mode until selected with arrow keys, so read their text instead of innerText.
          // THEN: While the message is being sent, the time should not be narrated, like the activity status.
          await waitFor(() =>
            expect(pageElements.activityActiveDescendantLabels().map(({ textContent }) => textContent)).toEqual([
              'You said Hello, World!',
              'Bot said Aloha! Sent at October 17 at 11:51 AM'
            ])
          );

          expect(pageElements.activityStatuses()[0].innerText).toBe('Sending');

          // WHEN: The message is sent.
          sendMessage.resolvePostActivity();

          // THEN: The time should be narrated after the message, like the timestamp in the activity status.
          await waitFor(() =>
            expect(pageElements.activityActiveDescendantLabels().map(({ textContent }) => textContent)).toEqual([
              'You said Hello, World! Sent at October 17 at 11:50 AM',
              'Bot said Aloha! Sent at October 17 at 11:51 AM'
            ])
          );
        },
        { ignoreErrors: true }
      );
    </script>
  </body>
</html>
