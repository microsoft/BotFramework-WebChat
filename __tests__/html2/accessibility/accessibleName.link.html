<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
    <script crossorigin="anonymous" src="/test-harness.js"></script>
    <script crossorigin="anonymous" src="/test-page-object.js"></script>
    <script crossorigin="anonymous" src="/__dist__/webchat-es5.js"></script>
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for"
        }
      }
    </script>
    <script type="module">
      import { waitFor } from '@testduet/wait-for';

      run(async function () {
        const { directLine, store } = testHelpers.createDirectLineEmulator();

        WebChat.renderWebChat(
          {
            directLine,
            store,
            styleOptions: { hideSendBox: true }
          },
          document.getElementById('webchat')
        );

        await pageConditions.uiConnected();

        // The summary is hidden from scan mode until the activity is selected with arrow keys, so read its text.
        const getActivitySummary = activityElement =>
          activityElement.querySelector('.webchat__basic-transcript__activity-active-descendant').textContent;

        // GIVEN: a message without links.
        await directLine.emulateIncomingActivity({
          text: 'Hello, World!',
          timestamp: '2026-10-17T11:50:00Z',
          type: 'message'
        });

        await pageConditions.numActivitiesShown(1);

        // THEN: the summary has no interactive footnote, only the time the message was sent.
        await waitFor(() =>
          expect(getActivitySummary(pageElements.activities()[0])).toBe(
            'Bot said: Hello, World! Sent at October 17 at 11:50 AM'
          )
        );

        // GIVEN: a message with a link.
        await directLine.emulateIncomingActivity({
          text: 'Read the [documentation](https://example.com/docs).',
          timestamp: '2026-10-17T11:51:00Z',
          type: 'message'
        });

        await pageConditions.numActivitiesShown(2);

        // THEN: the summary tells the message has links and can be interacted with, followed by the time.
        // Zero-width spaces wrap every link for line breaking, screen readers do not pause on them.
        await waitFor(() =>
          expect(getActivitySummary(pageElements.activities()[1]).replace(/\u200b/gu, '')).toBe(
            'Bot said: Read the documentation. One or more links in the message. Click to interact. Sent at October 17 at 11:51 AM'
          )
        );
      });
    </script>
  </body>
</html>
