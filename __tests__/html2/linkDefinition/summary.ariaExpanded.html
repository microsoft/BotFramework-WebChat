<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "botframework-webchat/": "/__dist__/packages/bundle/static/botframework-webchat/",
          "react": "/__dist__/packages/bundle/static/react.js",
          "react-dom": "/__dist__/packages/bundle/static/react-dom.js",
          "react-dom/client": "/__dist__/packages/bundle/static/react-dom/client.js"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { waitFor } from '@testduet/wait-for';
      import { createStoreWithOptions, ReactWebChat } from 'botframework-webchat';
      import { createElement } from 'react';
      import { createRoot } from 'react-dom/client';

      // TODO: This is for `createDirectLineEmulator` only, should find ways to eliminate this line.
      window.WebChat = { createStoreWithOptions };

      run(async function () {
        const { directLine, store } = testHelpers.createDirectLineEmulator();

        createRoot(document.getElementById('webchat')).render(
          createElement(ReactWebChat, { directLine, store, styleOptions: { hideSendBox: true } })
        );

        await pageConditions.uiConnected();

        // GIVEN: A message with a Markdown link reference definition, shown as a reference list below the message, expanded by default.
        await directLine.emulateIncomingActivity({
          text: 'Override the proxy settings[1].\n\n[1]: https://example.com/proxy "Proxy settings"\n',
          type: 'message'
        });

        await pageConditions.numActivitiesShown(1);

        const summary = document.querySelector('.link-definitions__header');
        const getStates = async () =>
          Object.fromEntries(
            (await testHelpers.getAccessibilityNode(summary)).properties.map(({ name, value: { value } }) => [
              name,
              value
            ])
          );

        // THEN: The reference list header is a disclosure: expanded by `aria-expanded`, not a toggle button with `aria-pressed`.
        expect(summary.getAttribute('aria-expanded')).toBe('true');
        expect(summary.hasAttribute('aria-pressed')).toBe(false);
        expect(await getStates()).toHaveProperty('expanded', true);
        expect(await getStates()).not.toHaveProperty('pressed');

        // WHEN: The reference list header is clicked.
        await host.click(summary);

        // THEN: The reference list should be collapsed, still without `aria-pressed`.
        await waitFor(() => expect(summary.getAttribute('aria-expanded')).toBe('false'));
        expect(summary.hasAttribute('aria-pressed')).toBe(false);
        expect(await getStates()).toHaveProperty('expanded', false);
        expect(await getStates()).not.toHaveProperty('pressed');
      });
    </script>
  </body>
</html>
