<!doctype html>
<html lang="en-US">
  <head>
    <title>React 19: Web Chat shows activities added while an &lt;Activity&gt; hid it, without rendering on show</title>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "react": "https://esm.sh/react@19.3.1?dev",
          "react-dom": "https://esm.sh/react-dom@19.3.1?dev",
          "react-dom/client": "https://esm.sh/react-dom@19.3.1/client?dev"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { waitFor } from '@testduet/wait-for';
      import { createStoreWithOptions, ReactWebChat, testIds } from 'botframework-webchat';
      import { Activity, createElement, version } from 'react';
      import { createRoot } from 'react-dom/client';

      run(async function () {
        // TODO: This is for `createDirectLineEmulator` and `pageElements` only, should find ways to eliminate this line.
        window.WebChat = { createStoreWithOptions, testIds };

        const { directLine, store } = testHelpers.createDirectLineEmulator();

        // GIVEN: React 19.2 or later: a hidden <Activity> runs the cleanup of the effects of its children, and keeps their state.
        expect(version).toBe('19.3.1');

        const root = createRoot(document.getElementById('webchat'));
        // The same element each time: showing Web Chat again does not render it, only its effects run again.
        const webChat = createElement(ReactWebChat, { directLine, store, styleOptions: { hideSendBox: true } });
        const render = mode => root.render(createElement(Activity, { mode }, webChat));

        // WHEN: Web Chat is rendered in a visible <Activity> and the bot sends a message.
        render('visible');

        await pageConditions.uiConnected();
        await directLine.emulateIncomingActivity('Hello, World!');
        await pageConditions.numActivitiesShown(1);
        await pageConditions.scrollStabilized();

        const [activityElement] = pageElements.activities();

        // THEN: Web Chat shows the message.
        await host.snapshot('local');

        // WHEN: The <Activity> hides Web Chat.
        render('hidden');

        await waitFor(() => expect(activityElement).toHaveProperty('offsetParent', null));

        // WHEN: The host adds a message to the store while Web Chat is hidden.
        // Not through the Direct Line emulator: a hidden Web Chat is disconnected, as when unmounted.
        store.dispatch({
          payload: {
            activity: {
              from: { id: 'bot', role: 'bot' },
              id: 'a-00002',
              text: 'Added while hidden.',
              timestamp: new Date().toISOString(),
              type: 'message'
            }
          },
          type: 'DIRECT_LINE/INCOMING_ACTIVITY'
        });

        // WHEN: The <Activity> shows Web Chat again.
        render('visible');

        // THEN: Web Chat shows the element of the first message, which it kept while hidden, and the message added while hidden.
        // No snapshot: after it is shown again, Web Chat loses some styles (React 19.2 <Activity> support is not complete yet).
        await waitFor(() => expect(activityElement).not.toHaveProperty('offsetParent', null));
        await pageConditions.numActivitiesShown(2);

        expect(pageElements.activities()[0]).toBe(activityElement);
        expect(pageElements.activityContents().map(({ textContent }) => textContent)).toEqual([
          'Hello, World!',
          'Added while hidden.'
        ]);
      });
    </script>
  </body>
</html>
