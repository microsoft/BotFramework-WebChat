<!doctype html>
<html lang="en-US">
  <head>
    <title>React 19 in Strict Mode: Web Chat keeps its styles, and removes them when unmounted</title>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "react": "https://esm.sh/react@19.3.1?dev",
          "react-dom": "https://esm.sh/react-dom@19.3.1?dev",
          "react-dom/client": "https://esm.sh/react-dom@19.3.1/client?dev"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { waitFor } from '@testduet/wait-for';
      import { createStoreWithOptions, ReactWebChat, testIds } from 'botframework-webchat';
      import { createElement, StrictMode, version } from 'react';
      import { createRoot } from 'react-dom/client';

      run(async function () {
        // TODO: This is for `createDirectLineEmulator` and `pageElements` only, should find ways to eliminate this line.
        window.WebChat = { createStoreWithOptions, testIds };

        const { directLine, store } = testHelpers.createDirectLineEmulator();

        // Web Chat adds its styles as <style> elements to `styleOptions.stylesRoot`, which defaults to <head>.
        const getNumStyleElements = () => document.head.querySelectorAll('style').length;

        // GIVEN: The development build of React 19, which mounts, unmounts and mounts again in Strict Mode (React 18: strictMode/unmount.styles.html).
        expect(version).toBe('19.3.1');

        const numStyleElementsBeforeRender = getNumStyleElements();
        const root = createRoot(document.getElementById('webchat'));

        // WHEN: Web Chat is rendered in Strict Mode.
        root.render(createElement(StrictMode, {}, createElement(ReactWebChat, { directLine, store })));

        await pageConditions.uiConnected();

        // THEN: Web Chat added its <style> elements.
        expect(getNumStyleElements()).toBeGreaterThan(numStyleElementsBeforeRender);

        // THEN: Web Chat shows the send box with its styles.
        await host.snapshot('local');

        // WHEN: Web Chat is unmounted.
        root.unmount();

        // THEN: Web Chat removes all the <style> elements it added.
        expect(getNumStyleElements()).toBe(numStyleElementsBeforeRender);
      });
    </script>
  </body>
</html>
