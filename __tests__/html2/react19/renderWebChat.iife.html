<!doctype html>
<html lang="en-US">
  <head>
    <title>React 19: renderWebChat() of the IIFE build asks for createRoot()</title>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "react": "https://esm.sh/react@19.3.1?dev",
          "react-dom": "https://esm.sh/react-dom@19.3.1?dev",
          "react-dom/client": "https://esm.sh/react-dom@19.3.1/client?dev"
        }
      }
    </script>
    <script crossorigin="anonymous" src="/test-harness.js"></script>
    <script crossorigin="anonymous" src="/test-page-object.js"></script>
    <script type="module">
      // React 19 has no UMD build: the IIFE build of Web Chat uses `window.React` and `window.ReactDOM` when they are set.
      import React from 'react';
      import ReactDOM from 'react-dom';

      window.React = React;
      window.ReactDOM = ReactDOM;
    </script>
    <script crossorigin="anonymous" defer src="/__dist__/webchat-es5.js"></script>
  </head>
  <body>
    <main id="webchat"></main>
    <script type="module">
      import { waitFor } from '@testduet/wait-for';
      import { createElement, version } from 'react';
      import ReactDOM from 'react-dom';
      import { createRoot } from 'react-dom/client';

      run(async function () {
        const {
          WebChat: { ReactWebChat, renderWebChat }
        } = window; // Imports in UMD fashion.

        const { directLine, store } = testHelpers.createDirectLineEmulator();
        const webChatElement = document.getElementById('webchat');

        // GIVEN: React 19, which no longer has `ReactDOM.render()`.
        expect(version).toBe('19.3.1');
        expect(ReactDOM.render).toBeUndefined();

        // WHEN: Web Chat is rendered by renderWebChat().
        // THEN: It rejects, as the IIFE build cannot import "react-dom/client".
        await expect(renderWebChat({ directLine, store }, webChatElement)).rejects.toThrow(
          'renderWebChat() needs createRoot() from "react-dom/client" on React 19 or later.'
        );

        // WHEN: Web Chat is rendered with createRoot() without the send box, as the error says.
        const root = createRoot(webChatElement);

        root.render(createElement(ReactWebChat, { directLine, store, styleOptions: { hideSendBox: true } }));

        await pageConditions.uiConnected();

        await directLine.emulateIncomingActivity('Hello, World!');
        await pageConditions.numActivitiesShown(1);

        expect(pageElements.sendBoxTextBox()).toBeFalsy();

        // THEN: Web Chat shows the message without the send box.
        await host.snapshot('local');

        const transcript = pageElements.transcript();

        // WHEN: The same root renders Web Chat again, with the send box.
        root.render(createElement(ReactWebChat, { directLine, store, styleOptions: { hideSendBox: false } }));

        // THEN: The send box appears.
        await waitFor(() => expect(pageElements.sendBoxTextBox()).toBeTruthy());

        // THEN: Web Chat is updated, not mounted again: the transcript is the same element.
        expect(pageElements.transcript()).toBe(transcript);

        // THEN: Web Chat shows the same message with the send box.
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
