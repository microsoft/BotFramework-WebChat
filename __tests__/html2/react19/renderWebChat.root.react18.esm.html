<!doctype html>
<html lang="en-US">
  <head>
    <title>React 18: renderWebChat() renders with the root passed instead of ReactDOM.render() (ESM build)</title>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "react": "/__dist__/packages/bundle/static/react.js",
          "react-dom": "/__dist__/packages/bundle/static/react-dom.js",
          "react-dom/client": "/__dist__/packages/bundle/static/react-dom/client.js"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { waitFor } from '@testduet/wait-for';
      import { createStoreWithOptions, renderWebChat, testIds } from 'botframework-webchat';
      import { version } from 'react';
      import ReactDOM from 'react-dom';
      import { createRoot } from 'react-dom/client';

      run(async function () {
        // TODO: This is for `createDirectLineEmulator` and `pageElements` only, should find ways to eliminate this line.
        window.WebChat = { createStoreWithOptions, testIds };

        const { directLine, store } = testHelpers.createDirectLineEmulator();

        // GIVEN: React 18, which still has `ReactDOM.render()`.
        expect(version).toMatch(/^18\./u);
        expect(typeof ReactDOM.render).toBe('function');

        // GIVEN: A root from createRoot(), which records what it renders.
        const root = createRoot(document.getElementById('webchat'));
        const renderedChildren = [];
        const recordingRoot = {
          render(children) {
            renderedChildren.push(children);
            root.render(children);
          }
        };

        // WHEN: Web Chat is rendered by renderWebChat() with the root instead of the element, without the send box.
        await renderWebChat({ directLine, store, styleOptions: { hideSendBox: true } }, recordingRoot);

        // THEN: The root rendered Web Chat once.
        expect(renderedChildren).toHaveLength(1);

        await pageConditions.uiConnected();

        await directLine.emulateIncomingActivity('Hello, World!');
        await pageConditions.numActivitiesShown(1);

        expect(pageElements.sendBoxTextBox()).toBeFalsy();

        // THEN: Web Chat shows the message without the send box.
        await host.snapshot('local');

        const transcript = pageElements.transcript();

        // WHEN: renderWebChat() is called again with the same root, with the send box.
        await renderWebChat({ directLine, store, styleOptions: { hideSendBox: false } }, recordingRoot);

        // THEN: The root rendered Web Chat again.
        expect(renderedChildren).toHaveLength(2);

        // THEN: The send box appears.
        await waitFor(() => expect(pageElements.sendBoxTextBox()).toBeTruthy());

        // THEN: Web Chat is updated, not mounted again: the transcript is the same element.
        expect(pageElements.transcript()).toBe(transcript);

        // WHEN: The root is unmounted.
        root.unmount();

        // THEN: Web Chat is gone: it was rendered by the root, not by `ReactDOM.render()`.
        expect(pageElements.transcript()).toBeFalsy();
      });
    </script>
  </body>
</html>
