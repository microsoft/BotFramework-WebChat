<!doctype html>
<html lang="en-US">
  <head>
    <title>React 19: renderWebChat() renders with the ESM build</title>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main id="webchat"></main>
    <!--
      TODO: Remove ".skip" from the file name when spyip/react-film#110 is released and bumped:
      react-film, bundled in the static build, imports `render` from "react-dom", which React 19 no longer exports, so the static build cannot load.
    -->
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "react": "https://esm.sh/react@19.3.1?dev",
          "react-dom": "https://esm.sh/react-dom@19.3.1?dev",
          "react-dom/client": "https://esm.sh/react-dom@19.3.1/client?dev"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { waitFor } from '@testduet/wait-for';
      import { createStoreWithOptions, renderWebChat, testIds } from 'botframework-webchat';
      import { version } from 'react';
      import ReactDOM from 'react-dom';

      run(async function () {
        // TODO: This is for `createDirectLineEmulator` only, should find ways to eliminate this line.
        window.WebChat = { createStoreWithOptions };

        const { directLine, store } = testHelpers.createDirectLineEmulator();

        // GIVEN: React 19, which no longer has `ReactDOM.render()`.
        expect(version).toBe('19.3.1');
        expect(ReactDOM.render).toBeUndefined();

        // WHEN: Web Chat is rendered by renderWebChat().
        renderWebChat({ directLine, store, styleOptions: { hideSendBox: true } }, document.getElementById('webchat'));

        await pageConditions.uiConnected();

        // WHEN: The bot sends a code block.
        await directLine.emulateIncomingActivity({
          text: 'Here is the code:\n\n```\nconsole.log("Hello, World!");\n```',
          type: 'message'
        });

        await pageConditions.numActivitiesShown(1);

        // THEN: The code block should have a "Copy" button.
        await waitFor(() =>
          expect(document.querySelector(`[data-testid="${testIds.codeBlockCopyButton}"]`)).toBeTruthy()
        );

        // THEN: Web Chat shows the code block with the "Copy" button.
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
