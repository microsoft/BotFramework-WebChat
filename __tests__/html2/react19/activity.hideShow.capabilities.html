<!doctype html>
<html lang="en-US">
  <head>
    <title>React 19: Web Chat follows a change of capabilities made while an &lt;Activity&gt; hid it</title>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "react": "https://esm.sh/react@19.3.1?dev",
          "react-dom": "https://esm.sh/react-dom@19.3.1?dev",
          "react-dom/client": "https://esm.sh/react-dom@19.3.1/client?dev"
        }
      }
    </script>
    <script crossorigin="anonymous" src="/test-harness.js"></script>
    <script crossorigin="anonymous" src="/test-page-object.js"></script>
    <script type="module">
      // React 19 has no UMD build: the IIFE builds of Web Chat and the Fluent theme use `window.React` and `window.ReactDOM`.
      import React from 'react';
      import ReactDOM from 'react-dom';

      window.React = React;
      window.ReactDOM = ReactDOM;
    </script>
    <script crossorigin="anonymous" defer src="/__dist__/webchat-es5.js"></script>
    <script crossorigin="anonymous" defer src="/__dist__/botframework-webchat-fluent-theme.development.js"></script>
  </head>
  <body>
    <main id="webchat"></main>
    <script type="module">
      import { waitFor } from '@testduet/wait-for';
      import { Activity, createElement, version } from 'react';
      import { createRoot } from 'react-dom/client';

      run(async function () {
        const {
          WebChat: { FluentThemeProvider, ReactWebChat, testIds }
        } = window; // Imports in UMD fashion.

        const getMicrophoneButton = () =>
          document.querySelector(`[data-testid="${testIds.sendBoxMicrophoneButton}"]`);

        // GIVEN: React 19.2 or later: a hidden <Activity> runs the cleanup of the effects of its children, and keeps their state.
        expect(version).toBe('19.3.1');

        // GIVEN: The adapter has no voice configuration: the Fluent send box shows no microphone button.
        const { directLine, store } = testHelpers.createDirectLineEmulator();

        const root = createRoot(document.getElementById('webchat'));
        // A new element each time, as JSX does: showing Web Chat again renders it before its effects run again.
        const render = mode =>
          root.render(
            createElement(
              Activity,
              { mode },
              createElement(FluentThemeProvider, {}, createElement(ReactWebChat, { directLine, store }))
            )
          );

        // WHEN: Web Chat with the Fluent theme is rendered in a visible <Activity>.
        render('visible');

        await pageConditions.uiConnected();

        // THEN: The send box shows the send button, without a microphone button.
        expect(getMicrophoneButton()).toBeNull();
        await host.snapshot('local');

        // WHEN: The <Activity> hides Web Chat, and the adapter gets a voice configuration while it is hidden.
        render('hidden');

        await waitFor(() => expect(pageElements.sendBoxTextBox()).toHaveProperty('offsetParent', null));

        // Dispatches "capabilitieschanged", which Web Chat misses: it does not listen while hidden.
        directLine.setCapability('getVoiceConfiguration', { chunkIntervalMs: 100, sampleRate: 24000 });

        // WHEN: The <Activity> shows Web Chat again.
        render('visible');

        await waitFor(() => expect(pageElements.sendBoxTextBox()).not.toHaveProperty('offsetParent', null));

        // THEN: Web Chat reads the current capabilities when it listens again: the microphone button replaces the send button.
        await waitFor(() => expect(getMicrophoneButton()).toBeTruthy());
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
