<!doctype html>
<html lang="en-US">
  <head>
    <title>React 19: Web Chat with the Fluent theme keeps its styles when an &lt;Activity&gt; hides and shows it</title>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "react": "https://esm.sh/react@19.3.1?dev",
          "react-dom": "https://esm.sh/react-dom@19.3.1?dev",
          "react-dom/client": "https://esm.sh/react-dom@19.3.1/client?dev"
        }
      }
    </script>
    <script crossorigin="anonymous" src="/test-harness.js"></script>
    <script crossorigin="anonymous" src="/test-page-object.js"></script>
    <script type="module">
      // React 19 has no UMD build: the IIFE builds of Web Chat and the Fluent theme use `window.React` and `window.ReactDOM`.
      import React from 'react';
      import ReactDOM from 'react-dom';

      window.React = React;
      window.ReactDOM = ReactDOM;
    </script>
    <script crossorigin="anonymous" defer src="/__dist__/webchat-es5.js"></script>
    <script crossorigin="anonymous" defer src="/__dist__/botframework-webchat-fluent-theme.development.js"></script>
  </head>
  <body>
    <main id="webchat"></main>
    <script type="module">
      import { waitFor } from '@testduet/wait-for';
      import { Activity, createElement, version } from 'react';
      import { createRoot } from 'react-dom/client';

      run(async function () {
        const {
          WebChat: { FluentThemeProvider, ReactWebChat }
        } = window; // Imports in UMD fashion.

        const { directLine, store } = testHelpers.createDirectLineEmulator();

        // GIVEN: React 19.2 or later: a hidden <Activity> runs the cleanup of the effects of its children, and keeps them.
        expect(version).toBe('19.3.1');

        const root = createRoot(document.getElementById('webchat'));
        // The same element each time: showing Web Chat again does not re-render it, only its effects run again.
        const webChat = createElement(FluentThemeProvider, {}, createElement(ReactWebChat, { directLine, store }));
        const render = mode => root.render(createElement(Activity, { mode }, webChat));

        // WHEN: Web Chat with the Fluent theme is rendered in a visible <Activity>.
        render('visible');

        await pageConditions.uiConnected();

        // THEN: Web Chat shows the send box of the Fluent theme at the bottom.
        await host.snapshot('local');

        // WHEN: The <Activity> hides Web Chat.
        render('hidden');

        await waitFor(() => expect(pageElements.sendBoxTextBox()).toHaveProperty('offsetParent', null));

        // WHEN: The <Activity> shows Web Chat again.
        render('visible');

        await waitFor(() => expect(pageElements.sendBoxTextBox()).not.toHaveProperty('offsetParent', null));

        // THEN: Web Chat looks the same as before it was hidden: the send box stays at the bottom.
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
