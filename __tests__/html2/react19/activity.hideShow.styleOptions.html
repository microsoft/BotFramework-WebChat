<!doctype html>
<html lang="en-US">
  <head>
    <title>React 19: Web Chat applies the style options changed while an &lt;Activity&gt; hides it</title>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "react": "https://esm.sh/react@19.3.1?dev",
          "react-dom": "https://esm.sh/react-dom@19.3.1?dev",
          "react-dom/client": "https://esm.sh/react-dom@19.3.1/client?dev"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { waitFor } from '@testduet/wait-for';
      import { createStoreWithOptions, ReactWebChat, testIds } from 'botframework-webchat';
      import { Activity, createElement, version } from 'react';
      import { createRoot } from 'react-dom/client';

      run(async function () {
        // TODO: This is for `createDirectLineEmulator` and `pageElements` only, should find ways to eliminate this line.
        window.WebChat = { createStoreWithOptions, testIds };

        const { directLine, store } = testHelpers.createDirectLineEmulator();

        // GIVEN: React 19.2 or later: a hidden <Activity> runs the cleanup of the effects of its children, and keeps them.
        expect(version).toBe('19.3.1');

        const root = createRoot(document.getElementById('webchat'));
        const render = (mode, styleOptions) =>
          root.render(
            createElement(Activity, { mode }, createElement(ReactWebChat, { directLine, store, styleOptions }))
          );

        // WHEN: Web Chat is rendered in a visible <Activity>.
        render('visible', {});

        await pageConditions.uiConnected();

        // WHEN: The <Activity> hides Web Chat.
        render('hidden', {});

        await waitFor(() => expect(pageElements.sendBoxTextBox()).toHaveProperty('offsetParent', null));

        const getSurface = () => document.querySelector('.webchat__surface');
        const surfaceClassName = getSurface().className;

        // WHEN: The host changes the background color while Web Chat is hidden.
        render('hidden', { backgroundColor: '#FFFFE0' }); // Light yellow.

        // React renders hidden children at a lower priority: the new background color is a new class name.
        await waitFor(() => expect(getSurface().className).not.toBe(surfaceClassName));

        // WHEN: The <Activity> shows Web Chat again.
        render('visible', { backgroundColor: '#FFFFE0' });

        await waitFor(() => expect(pageElements.sendBoxTextBox()).not.toHaveProperty('offsetParent', null));

        // THEN: Web Chat applies the background color, and keeps the styles it had before: the file input is still hidden.
        await waitFor(() => expect(getComputedStyle(getSurface()).backgroundColor).toBe('rgb(255, 255, 224)'));
        expect(getComputedStyle(document.querySelector('.webchat__upload-button--file-input')).opacity).toBe('0');

        // THEN: Web Chat shows the send box on a light yellow background.
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
