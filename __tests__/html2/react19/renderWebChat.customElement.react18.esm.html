<!doctype html>
<html lang="en-US">
  <head>
    <title>renderWebChat() renders into a custom element that has its own render() method (ESM build)</title>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main>
      <!-- Custom elements are inline by default. -->
      <chat-container id="webchat" style="display: block"></chat-container>
    </main>
    <script type="importmap">
      {
        "imports": {
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "react": "/__dist__/packages/bundle/static/react.js",
          "react-dom": "/__dist__/packages/bundle/static/react-dom.js"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { createStoreWithOptions, renderWebChat, testIds } from 'botframework-webchat';
      import { version } from 'react';

      run(async function () {
        // TODO: This is for `createDirectLineEmulator` and `pageElements` only, should find ways to eliminate this line.
        window.WebChat = { createStoreWithOptions, testIds };

        const { directLine, store } = testHelpers.createDirectLineEmulator();

        // GIVEN: React 18, which still has `ReactDOM.render()`.
        expect(version).toMatch(/^18\./u);

        // GIVEN: A custom element with its own `render()` method, like Lit components.
        let numRenderCalls = 0;

        customElements.define(
          'chat-container',
          class extends HTMLElement {
            render() {
              numRenderCalls++;
            }
          }
        );

        const chatContainer = document.getElementById('webchat');

        expect(typeof chatContainer.render).toBe('function');

        // WHEN: Web Chat is rendered by renderWebChat() into the custom element, without the send box.
        await renderWebChat({ directLine, store, styleOptions: { hideSendBox: true } }, chatContainer);

        // THEN: The custom element is treated as an element, not as a root: its `render()` is not called.
        expect(numRenderCalls).toBe(0);

        await pageConditions.uiConnected();

        await directLine.emulateIncomingActivity('Hello, World!');
        await pageConditions.numActivitiesShown(1);

        // THEN: Web Chat is rendered inside the custom element.
        expect(chatContainer.contains(pageElements.transcript())).toBe(true);

        // THEN: Web Chat shows the message without the send box.
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
