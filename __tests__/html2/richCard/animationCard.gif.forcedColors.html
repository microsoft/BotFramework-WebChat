<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "botframework-webchat/": "/__dist__/packages/bundle/static/botframework-webchat/",
          "botframework-webchat-fluent-theme": "/__dist__/packages/fluent-theme/static/botframework-webchat-fluent-theme.js",
          "react": "/__dist__/packages/bundle/static/react.js",
          "react-dom": "/__dist__/packages/bundle/static/react-dom.js",
          "react-dom/client": "/__dist__/packages/bundle/static/react-dom/client.js"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { waitFor } from '@testduet/wait-for';
      import { createStoreWithOptions, ReactWebChat } from 'botframework-webchat';
      import { FluentThemeProvider } from 'botframework-webchat-fluent-theme';
      import { createElement } from 'react';
      import { createRoot } from 'react-dom/client';

      // TODO: This is for `createDirectLineEmulator` only, should find ways to eliminate this line.
      window.WebChat = { createStoreWithOptions };

      run(async function () {
        // GIVEN: Forced colors are active before Web Chat renders, such as with a Windows contrast theme.
        //        This replaces the emulated media of the test harness, so reduced motion is set again.
        await host.sendDevToolsCommand('Emulation.setEmulatedMedia', {
          features: [
            { name: 'forced-colors', value: 'active' },
            { name: 'prefers-reduced-motion', value: 'reduce' }
          ]
        });

        expect(matchMedia('(forced-colors: active)').matches).toBe(true);
        expect(matchMedia('(prefers-reduced-motion: reduce)').matches).toBe(true);

        const { directLine, store } = testHelpers.createDirectLineEmulator();
        const variant = new URLSearchParams(location.search).get('variant');
        // The send box is not under test: hide it, including the send box of the Fluent theme.
        const webChatElement = createElement(ReactWebChat, {
          directLine,
          sendBoxMiddleware: [() => () => () => false],
          store
        });

        createRoot(document.getElementById('webchat')).render(
          variant ? createElement(FluentThemeProvider, { variant }, webChatElement) : webChatElement
        );

        await pageConditions.uiConnected();

        // GIVEN: The bot sends an animation card with a GIF, similar to the "animationcard" command of the mock bot.
        // Like the GIF of the mock bot, it is served from another origin.
        // The GIF shows red with the ball on the left for 2 seconds, then stays on green with the ball on the right.
        const gifURL = new URL('/assets/red-green-animation.gif', location.href);
        const firstFrameColor = '#c50f1f'; // Red.

        gifURL.hostname = gifURL.hostname === 'localhost' ? 'cross-origin.localhost' : 'webchat2-cross-origin';

        await directLine.emulateIncomingActivity({
          attachments: [
            {
              content: {
                autoloop: true,
                autostart: true,
                media: [
                  {
                    profile: 'Ball moving from left to right',
                    url: gifURL.href
                  }
                ],
                subtitle: 'Animation with a GIF',
                text: 'No buttons, no image.',
                title: 'Animation card'
              },
              contentType: 'application/vnd.microsoft.card.animation'
            }
          ],
          from: { role: 'bot' },
          type: 'message'
        });

        await pageConditions.numActivitiesShown(1);
        await pageConditions.allImagesLoaded();

        const [[attachmentElement]] = pageElements.activityAttachments();
        const buttonElement = attachmentElement.querySelector('button');
        const imageElement = attachmentElement.querySelector('img[alt="Ball moving from left to right"]');

        // WHEN: Focus on the button via keyboard.
        pageObjects.focusTranscript();
        await host.sendKeys('ENTER');

        // THEN: The paused animation should offer a "Play animation" button, which has the keyboard focus.
        await waitFor(() => expect(document.activeElement).toBe(buttonElement));
        expect(buttonElement.matches(':focus-visible')).toBe(true);
        await expect(testHelpers.getAccessibleName(buttonElement)).resolves.toBe('Play animation');

        // THEN: The "Play animation" icon, the focus indicator, and the border of the message should be visible in forced colors, over the first frame (red).
        expect(await testHelpers.getRenderedColor(imageElement)).toBe(firstFrameColor);
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
