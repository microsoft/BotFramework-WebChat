<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "botframework-webchat/": "/__dist__/packages/bundle/static/botframework-webchat/",
          "react": "/__dist__/packages/bundle/static/react.js",
          "react-dom": "/__dist__/packages/bundle/static/react-dom.js",
          "react-dom/client": "/__dist__/packages/bundle/static/react-dom/client.js"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { waitFor } from '@testduet/wait-for';
      import { createStoreWithOptions, ReactWebChat } from 'botframework-webchat';
      import { createElement } from 'react';
      import { createRoot } from 'react-dom/client';

      // TODO: This is for `createDirectLineEmulator` only, should find ways to eliminate this line.
      window.WebChat = { createStoreWithOptions };

      run(async function () {
        // GIVEN: The user does not prefer reduced motion.
        await host.sendDevToolsCommand('Emulation.setEmulatedMedia', {
          features: [{ name: 'prefers-reduced-motion', value: 'no-preference' }]
        });

        expect(matchMedia('(prefers-reduced-motion: reduce)').matches).toBe(false);

        const { directLine, store } = testHelpers.createDirectLineEmulator();

        // GIVEN: Images are 120 pixels high, so the GIF is cropped.
        createRoot(document.getElementById('webchat')).render(
          createElement(ReactWebChat, {
            directLine,
            store,
            styleOptions: { bubbleImageMaxHeight: 120, bubbleImageMinHeight: 120 }
          })
        );

        await pageConditions.uiConnected();

        // GIVEN: The bot sends an animation card with a GIF and no "autostart", which defaults to true.
        // GIVEN: The bot sends another animation card with a GIF and "autostart" set to false.
        // The first frame of the GIF (ball on the left) is shown for 20 ms, the second frame (ball on the right) for about 11 minutes,
        // so a playing GIF settles on the second frame before the snapshot.
        for (const autostart of [undefined, false]) {
          await directLine.emulateIncomingActivity({
            attachments: [
              {
                content: {
                  autostart,
                  media: [
                    {
                      profile: 'Yellow ball moving from left to right',
                      url: new URL('/assets/yellow-ball-animation.gif', location.href).href
                    }
                  ],
                  title: autostart === false ? 'Animation card without autostart' : 'Animation card'
                },
                contentType: 'application/vnd.microsoft.card.animation'
              }
            ],
            from: { role: 'bot' },
            type: 'message'
          });
        }

        await pageConditions.numActivitiesShown(2);
        await pageConditions.allImagesLoaded();

        const [autostartButtonElement, noAutostartButtonElement] = pageElements
          .activityAttachments()
          .map(([attachmentElement]) => attachmentElement.querySelector('button'));

        // THEN: The first animation should play and offer a "Pause animation" button.
        await expect(testHelpers.getAccessibilityNode(autostartButtonElement)).resolves.toEqual(
          expect.objectContaining({
            name: expect.objectContaining({ value: 'Pause animation' }),
            role: expect.objectContaining({ value: 'button' })
          })
        );

        // THEN: The second animation should not play and offer a "Play animation" button.
        await expect(testHelpers.getAccessibilityNode(noAutostartButtonElement)).resolves.toEqual(
          expect.objectContaining({
            name: expect.objectContaining({ value: 'Play animation' }),
            role: expect.objectContaining({ value: 'button' })
          })
        );

        // THEN: The first animation should show its second frame and the second animation its first frame, with the button inside the cropped image.
        await host.snapshot('local');

        // WHEN: Click on the "Pause animation" button.
        await host.click(autostartButtonElement);

        // THEN: The first animation should stop and offer a "Play animation" button.
        await waitFor(() =>
          expect(testHelpers.getAccessibleName(autostartButtonElement)).resolves.toBe('Play animation')
        );

        // THEN: Both animations should show their first frame.
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
