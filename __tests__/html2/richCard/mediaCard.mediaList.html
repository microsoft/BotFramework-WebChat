<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "botframework-webchat/": "/__dist__/packages/bundle/static/botframework-webchat/",
          "react": "/__dist__/packages/bundle/static/react.js",
          "react-dom": "/__dist__/packages/bundle/static/react-dom.js",
          "react-dom/client": "/__dist__/packages/bundle/static/react-dom/client.js"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { createStoreWithOptions, ReactWebChat } from 'botframework-webchat';
      import { createElement } from 'react';
      import { createRoot } from 'react-dom/client';

      // TODO: This is for `createDirectLineEmulator` only, should find ways to eliminate this line.
      window.WebChat = { createStoreWithOptions };

      async function getAccessibilityAncestorRoles(element) {
        return (await testHelpers.getAccessibilityAncestors(element)).map(({ role }) => role.value);
      }

      run(async function () {
        const { directLine, store } = testHelpers.createDirectLineEmulator();

        createRoot(document.getElementById('webchat')).render(createElement(ReactWebChat, { directLine, store }));

        await pageConditions.uiConnected();

        // GIVEN: The bot sends an audio card, a video card and an animation card with a single medium each,
        //        similar to the "audiocard", "videocard" and "animationcard" commands of the mock bot.
        await directLine.emulateIncomingActivity({
          attachments: [
            {
              content: {
                media: [{ url: '/assets/hello-world.wav' }],
                subtitle: 'Audio with a single medium',
                title: 'Audio card'
              },
              contentType: 'application/vnd.microsoft.card.audio'
            }
          ],
          from: { role: 'bot' },
          type: 'message'
        });

        await directLine.emulateIncomingActivity({
          attachments: [
            {
              content: {
                // `VideoContent` parses the URL with `new URL()`, so it must be absolute.
                media: [{ url: new URL('/assets/dark-gray-video.webm', location.href).href }],
                subtitle: 'Video with a single medium',
                title: 'Video card'
              },
              contentType: 'application/vnd.microsoft.card.video'
            }
          ],
          from: { role: 'bot' },
          type: 'message'
        });

        await directLine.emulateIncomingActivity({
          attachments: [
            {
              content: {
                media: [{ profile: 'Yellow ball moving from left to right', url: '/assets/yellow-ball-animation.gif' }],
                subtitle: 'Animation with a single medium',
                title: 'Animation card'
              },
              contentType: 'application/vnd.microsoft.card.animation'
            }
          ],
          from: { role: 'bot' },
          type: 'message'
        });

        // GIVEN: The bot sends an audio card with 2 media.
        await directLine.emulateIncomingActivity({
          attachments: [
            {
              content: {
                media: [{ url: '/assets/hello-world.wav' }, { url: '/assets/hello-world.wav' }],
                subtitle: 'Audio with 2 media',
                title: 'Audio card'
              },
              contentType: 'application/vnd.microsoft.card.audio'
            }
          ],
          from: { role: 'bot' },
          type: 'message'
        });

        await pageConditions.numActivitiesShown(4);
        await pageConditions.allImagesLoaded();

        const [[audioCardElement], [videoCardElement], [animationCardElement], [twoMediaCardElement]] =
          pageElements.activityAttachments();

        const [firstAudioElement, secondAudioElement] = twoMediaCardElement.querySelectorAll('audio');

        // THEN: A single medium should not be announced as an item of a list, such as "1 of 1".
        expect(await getAccessibilityAncestorRoles(audioCardElement.querySelector('audio'))).not.toContain('listitem');
        expect(await getAccessibilityAncestorRoles(videoCardElement.querySelector('video'))).not.toContain('listitem');
        expect(await getAccessibilityAncestorRoles(animationCardElement.querySelector('img'))).not.toContain(
          'listitem'
        );

        // THEN: 2 media should be announced as the 2 items of a list.
        const [firstListItem, firstList] = await testHelpers.getAccessibilityAncestors(firstAudioElement);
        const [secondListItem, secondList] = await testHelpers.getAccessibilityAncestors(secondAudioElement);

        expect(firstListItem.role.value).toBe('listitem');
        expect(secondListItem.role.value).toBe('listitem');
        expect(secondListItem.backendDOMNodeId).not.toBe(firstListItem.backendDOMNodeId);
        expect(firstList.role.value).toBe('list');
        expect(secondList.backendDOMNodeId).toBe(firstList.backendDOMNodeId);

        // THEN: A single medium and a list of 2 media should be laid out alike, without list markers.
        await pageConditions.mediaBufferStabilized(firstAudioElement);
        await pageConditions.mediaBufferStabilized(secondAudioElement);
        await pageConditions.scrollToBottomCompleted();

        await host.snapshot('local');
      });
    </script>
  </body>
</html>
