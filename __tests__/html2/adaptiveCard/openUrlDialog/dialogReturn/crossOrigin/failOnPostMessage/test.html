<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "jest-mock": "https://esm.sh/jest-mock",
          "react": "/__dist__/packages/bundle/static/react.js",
          "react-dom": "/__dist__/packages/bundle/static/react-dom.js"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { waitFor } from '@testduet/wait-for';
      import { spyOn } from 'jest-mock';

      import { createDirectLine, createStoreWithOptions, renderWebChat } from 'botframework-webchat';

      testHelpers.hideKnownError();

      run(async function () {
        const {
          testHelpers: { createDirectLineEmulator }
        } = window;

        // TODO: This is for `createDirectLineEmulator` only, should find ways to eliminate this line.
        window.WebChat = { createStoreWithOptions };

        const { directLine, store } = createDirectLineEmulator();

        renderWebChat({ directLine, store }, document.getElementById('webchat'));

        await pageConditions.uiConnected();

        await directLine.emulateIncomingActivity({
          attachments: [
            {
              contentType: 'application/vnd.microsoft.card.adaptive',
              content: {
                $schema: 'http://adaptivecards.io/schemas/adaptive-card.json',
                type: 'AdaptiveCard',
                version: '1.2',
                body: [
                  {
                    text: 'Hello, World!',
                    type: 'TextBlock'
                  },
                  {
                    actions: [
                      {
                        title: 'Sign in (Action.OpenUrlDialog)',
                        type: 'Action.OpenUrlDialog',
                        url: new URL('dialog1.skip.html', location).toString()
                      }
                    ],
                    type: 'ActionSet'
                  }
                ]
              }
            }
          ],
          from: {
            id: 'bot',
            role: 'bot'
          },
          id: 'a-00001',
          timestamp: new Date().toISOString(),
          type: 'message'
        });

        const consoleWarnMock = spyOn(console, 'warn');
        const windowOpenMock = spyOn(window, 'open');

        // THEN: Should render the Adaptive Card with a "Sign in" button.
        await pageConditions.numActivitiesShown(1);

        // WHEN: The "Sign in" button is clicked.
        //       The `MessageEvent` will come from an external origin.
        await host.click(document.querySelector('[aria-label="Sign in (Action.OpenUrlDialog)"]'));

        // THEN: Should open a new popup.
        expect(windowOpenMock).toHaveBeenCalledTimes(1);

        // THEN: Should open popup window as trusted.
        expect(windowOpenMock).toHaveBeenNthCalledWith(
          1,
          expect.stringContaining('dialog1.skip.html'),
          '_blank',
          'height=640,popup,width=480'
        );

        // THEN: It should warn.
        await waitFor(() => expect(consoleWarnMock).toHaveBeenCalledTimes(1), { timeout: 5_000 });

        expect(consoleWarnMock).toHaveBeenNthCalledWith(
          1,
          expect.stringMatching(
            /botframework-webchat: Cannot handle return value from an untrusted cross origin\. Please add the origin "(http:\/\/cross-origin.localhost:5001|https:\/\/webchat2-cross-origin)" to style option named "callURLActionTrustedOrigin"\./u
          )
        );

        windowOpenMock.mock.results[0].value.close();
      });
    </script>
  </body>
</html>
