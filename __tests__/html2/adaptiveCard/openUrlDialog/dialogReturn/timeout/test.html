<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "jest-mock": "https://esm.sh/jest-mock",
          "react": "/__dist__/packages/bundle/static/react.js",
          "react-dom": "/__dist__/packages/bundle/static/react-dom.js"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { spyOn } from 'jest-mock';
      import { waitFor } from '@testduet/wait-for';

      import { createDirectLine, createStoreWithOptions, renderWebChat } from 'botframework-webchat';

      testHelpers.hideKnownError();

      run(async function () {
        const clock = lolex.createClock();

        const {
          testHelpers: { createDirectLineEmulator }
        } = window;

        // TODO: This is for `createDirectLineEmulator` only, should find ways to eliminate this line.
        window.WebChat = { createStoreWithOptions };

        const { directLine, store } = createDirectLineEmulator({ ponyfill: clock });

        renderWebChat({ directLine, ponyfill: clock, store }, document.getElementById('webchat'));

        await pageConditions.webChatRendered();

        // Wait for "Connecting..." message to dismiss
        clock.tick(600);

        await pageConditions.uiConnected();

        await directLine.emulateIncomingActivity({
          attachments: [
            {
              contentType: 'application/vnd.microsoft.card.adaptive',
              content: {
                $schema: 'http://adaptivecards.io/schemas/adaptive-card.json',
                type: 'AdaptiveCard',
                version: '1.2',
                body: [
                  {
                    text: '`postMessage` after 2 minutes',
                    type: 'TextBlock'
                  },
                  {
                    actions: [
                      {
                        title: 'Sign in (Action.OpenUrlDialog)',
                        type: 'Action.OpenUrlDialog',
                        url: new URL('dialog.skip.html', location).toString()
                      }
                    ],
                    type: 'ActionSet'
                  }
                ]
              }
            }
          ],
          from: {
            id: 'bot',
            role: 'bot'
          },
          id: 'a-00001',
          timestamp: new Date().toISOString(),
          type: 'message'
        });

        const messageEventHandlers = new Set();

        const windowAddEventListener = window.addEventListener.bind(window);
        const windowRemoveEventListener = window.removeEventListener.bind(window);
        const windowOpen = window.open.bind(window);
        let popupWindow;

        spyOn(window, 'addEventListener').mockImplementation((...args) => {
          const [name, handler] = args;

          name === 'message' && messageEventHandlers.add(handler);

          return windowAddEventListener(...args);
        });

        spyOn(window, 'removeEventListener').mockImplementation((...args) => {
          const [name, handler] = args;

          name === 'message' && messageEventHandlers.delete(handler);

          return windowRemoveEventListener(...args);
        });

        spyOn(window, 'open').mockImplementation((...args) => {
          // THEN: Should attach "message" event handler before window.open().
          expect(messageEventHandlers.size).toBe(1);

          return (popupWindow = windowOpen(...args));
        });

        // THEN: Should render the Adaptive Card with a "Sign in" button.
        await pageConditions.numActivitiesShown(1);

        // THEN: Should have no "message" event handler initially.
        expect(messageEventHandlers.size).toBe(0);

        // WHEN: The "Sign in" button is clicked.
        await host.click(document.querySelector('[aria-label="Sign in (Action.OpenUrlDialog)"]'));

        try {
          // THEN: Should add a "message" event handler.
          await waitFor(() => expect(messageEventHandlers.size).toBe(1));

          // WHEN: 2 minutes has passed.
          clock.tick(300_000);

          // THEN: Should remove the "message" event handler.
          await waitFor(() => expect(messageEventHandlers.size).toBe(0));

          // THEN: Should not close the popup window.
          expect(popupWindow).toHaveProperty('closed', false);
        } finally {
          popupWindow.close();
        }
      });
    </script>
  </body>
</html>
