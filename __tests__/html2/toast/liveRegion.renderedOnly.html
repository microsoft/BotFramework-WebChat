<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
    <!-- Shows the live region, so the snapshot shows what is announced. -->
    <link href="/assets/accessibility.liveRegionAttachment.css" rel="stylesheet" type="text/css" />
    <style>
      /* Shows the live region below the toast. */
      .webchat__live-region {
        bottom: 0;
      }
    </style>
    <script crossorigin="anonymous" src="/test-harness.js"></script>
    <script crossorigin="anonymous" src="/test-page-object.js"></script>
    <script crossorigin="anonymous" src="/__dist__/webchat-es5.js"></script>
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for"
        }
      }
    </script>
    <script type="module">
      import { waitFor } from '@testduet/wait-for';

      run(async function () {
        const { directLine, store } = testHelpers.createDirectLineEmulator();

        // GIVEN: Web Chat keeps what it announced in the live region, so it can be checked and seen in the snapshot.
        WebChat.renderWebChat(
          { directLine, store, styleOptions: { hideSendBox: true, internalLiveRegionFadeAfter: 60000 } },
          document.getElementById('webchat')
        );

        // WHEN: Web Chat connected, then a notification is shown as a toast.
        await pageConditions.uiConnected();

        pageObjects.dispatch({
          payload: { id: 'privacypolicy', level: 'info', message: 'Please read our privacy policy.' },
          type: 'WEB_CHAT/SET_NOTIFICATION'
        });

        await pageConditions.toastShown('Please read our privacy policy.');

        // THEN: Only the toast is announced, not the connectivity notification ("connecting"), which the toaster does not show.
        await waitFor(() =>
          expect(
            Array.from(pageElements.liveRegion().children, child => testHelpers.getAllTextContents(child).join('\n'))
          ).toEqual(['Please read our privacy policy.'])
        );

        // THEN: The toast is shown, the live region (bottom) shows only its text.
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
