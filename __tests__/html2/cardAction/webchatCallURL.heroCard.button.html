<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "react": "/__dist__/packages/bundle/static/react.js",
          "react-dom": "/__dist__/packages/bundle/static/react-dom.js"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { createDirectLine, createStoreWithOptions, renderWebChat } from 'botframework-webchat';

      testHelpers.hideKnownError();

      run(async function () {
        const {
          testHelpers: { createDirectLineEmulator }
        } = window;

        // TODO: This is for `createDirectLineEmulator` only, should find ways to eliminate this line.
        window.WebChat = { createStoreWithOptions };

        const { directLine, store } = createDirectLineEmulator();

        renderWebChat({ directLine, store }, document.getElementById('webchat'));

        await pageConditions.uiConnected();

        await directLine.emulateIncomingActivity({
          attachments: [
            {
              contentType: 'application/vnd.microsoft.card.hero',
              content: {
                buttons: [
                  {
                    title: 'Call URL',
                    type: 'webchat:callURL',
                    value: 'https://bing.com/'
                  }
                ],
                title: 'Card with a "webchat:callURL" button'
              }
            }
          ],
          from: {
            id: 'bot',
            role: 'bot'
          },
          id: '1',
          timestamp: new Date().toISOString(),
          type: 'message'
        });

        // THEN: Should render the Hero Card with a "Call URL" button.
        await pageConditions.numActivitiesShown(1);

        // GIVEN: Intercept `window.open`.
        const originalOpen = window.open.bind(window);
        let windowOpenArgs;

        window.open = (...args) => {
          windowOpenArgs = args;

          return originalOpen(...args);
        };

        // WHEN: The "Call URL" button is clicked.
        await host.click(document.querySelector('[aria-label="Call URL"]'));

        // THEN: Should call `window.open` with popup window features instead of "noopener noreferrer",
        //       which means the "webchat:callURL" type is preserved and not dispatched as "openUrl".
        expect(windowOpenArgs[0]).toBe('https://bing.com/');
        expect(windowOpenArgs[1]).toBe('_blank');
        expect(windowOpenArgs[2]).toContain('popup');
      });
    </script>
  </body>
</html>
