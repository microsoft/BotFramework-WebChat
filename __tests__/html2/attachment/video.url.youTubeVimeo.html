<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "botframework-webchat/": "/__dist__/packages/bundle/static/botframework-webchat/",
          "react": "/__dist__/packages/bundle/static/react.js",
          "react-dom": "/__dist__/packages/bundle/static/react-dom.js",
          "react-dom/client": "/__dist__/packages/bundle/static/react-dom/client.js"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { waitFor } from '@testduet/wait-for';
      import { createStoreWithOptions, ReactWebChat } from 'botframework-webchat';
      import { createElement } from 'react';
      import { createRoot } from 'react-dom/client';

      // TODO: This is for `createDirectLineEmulator` only, should find ways to eliminate this line.
      window.WebChat = { createStoreWithOptions };

      run(async function () {
        const { directLine, store } = testHelpers.createDirectLineEmulator();

        createRoot(document.getElementById('webchat')).render(
          createElement(ReactWebChat, { directLine, store, styleOptions: { hideSendBox: true } })
        );

        await pageConditions.uiConnected();

        // WHEN: The bot sends YouTube and Vimeo URLs without a video ID, which cannot be embedded.
        await directLine.emulateIncomingActivity({
          attachments: ['https://www.youtube.com/@Microsoft', 'https://youtu.be/', 'https://vimeo.com/'].map(
            contentUrl => ({ contentType: 'video/mp4', contentUrl, name: 'Video without a video ID' })
          ),
          from: { role: 'bot' },
          type: 'message'
        });

        await pageConditions.numActivitiesShown(1);

        // THEN: They should show a video player with the URL as-is, the same as other absolute URLs that cannot be embedded.
        expect(
          Array.from(document.querySelectorAll('video'), videoElement => videoElement.getAttribute('src'))
        ).toEqual(['https://www.youtube.com/@Microsoft', 'https://youtu.be/', 'https://vimeo.com/']);

        // THEN: They should not be embedded.
        expect(document.querySelector('iframe')).toBeNull();

        // These URLs are not videos, wait until every player gives up loading them.
        await waitFor(() =>
          expect(Array.from(document.querySelectorAll('video'), ({ networkState }) => networkState)).toEqual(
            new Array(3).fill(HTMLMediaElement.NETWORK_NO_SOURCE)
          )
        );

        // The three players do not fit in the transcript, take one snapshot at the top and one at the bottom.
        await pageObjects.scrollToTop();

        // THEN: It should show the first and second players (YouTube channel and short URL) as empty video players, not embedded.
        await host.snapshot('local');

        await pageObjects.scrollToBottom();

        // THEN: It should show the second and third players (YouTube short URL and Vimeo) as empty video players, not embedded.
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
