<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "react": "/__dist__/packages/bundle/static/react.js",
          "react-dom": "/__dist__/packages/bundle/static/react-dom.js",
          "react-dom/client": "/__dist__/packages/bundle/static/react-dom/client.js"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { createStoreWithOptions, ReactWebChat } from 'botframework-webchat';
      import { createElement } from 'react';
      import { createRoot } from 'react-dom/client';

      // TODO: This is for `createDirectLineEmulator` only, should find ways to eliminate this line.
      window.WebChat = { createStoreWithOptions };

      run(async function () {
        // GIVEN: A dark high contrast theme (such as "Aquatic" on Windows) is active before Web Chat renders.
        await host.sendDevToolsCommand('Emulation.setEmulatedMedia', {
          features: [
            { name: 'forced-colors', value: 'active' },
            { name: 'prefers-color-scheme', value: 'dark' }
          ]
        });

        expect(window.matchMedia('(forced-colors: active) and (prefers-color-scheme: dark)').matches).toBe(true);

        const { directLine, store } = testHelpers.createDirectLineEmulator();

        createRoot(document.getElementById('webchat')).render(createElement(ReactWebChat, { directLine, store }));

        await pageConditions.uiConnected();

        // WHEN: The bot sends an audio card, similar to the "audiocard" command of the mock bot.
        await directLine.emulateIncomingActivity({
          attachments: [
            {
              content: {
                media: [{ profile: 'audiocard', url: '/assets/hello-world.wav' }],
                subtitle: 'audio test',
                text: 'No buttons, No Image, Autoloop, Sharable',
                title: 'BotFramework Test'
              },
              contentType: 'application/vnd.microsoft.card.audio'
            }
          ],
          from: { role: 'bot' },
          type: 'message'
        });

        await pageConditions.numActivitiesShown(1);

        const audioElement = document.querySelector('audio');

        await pageConditions.mediaBufferStabilized(audioElement);

        // THEN: The audio player should show its controls.
        expect(audioElement.controls).toBe(true);

        // THEN: The play, mute and more icons of the audio player should be visible against the dark background.
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
