<!doctype html>
<html lang="en-US">
  <head>
    <title>Strict Mode: connects to the bot after Strict Mode mounted Web Chat twice</title>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "react": "https://esm.sh/react@18.3.1?dev",
          "react-dom": "https://esm.sh/react-dom@18.3.1?dev",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?dev"
        }
      }
    </script>
    <script crossorigin="anonymous" src="/test-harness.js"></script>
    <script crossorigin="anonymous" src="/test-page-object.js"></script>
    <script type="module">
      // Strict Mode only mounts twice with the development build of React 18 or later.
      import React from 'react';
      import ReactDOM from 'react-dom';

      window.React = React;
      window.ReactDOM = ReactDOM;
    </script>
    <script crossorigin="anonymous" defer src="/__dist__/webchat-es5.js"></script>
  </head>
  <body>
    <main id="webchat"></main>
    <script type="module">
      import { waitFor } from '@testduet/wait-for';
      import { createElement, StrictMode, useEffect } from 'react';
      import { createRoot } from 'react-dom/client';

      run(async function () {
        const {
          WebChat: { createDirectLine, ReactWebChat }
        } = window; // Imports in UMD fashion.

        let numMounts = 0;

        const MountCounter = () => {
          useEffect(() => {
            numMounts++;
          }, []);

          return null;
        };

        // GIVEN: DirectLineJS, which cannot start again after Web Chat unmounted while it was starting.
        const directLine = createDirectLine({ token: await testHelpers.token.fetchDirectLineToken() });

        // WHEN: Web Chat is rendered in Strict Mode.
        createRoot(document.getElementById('webchat')).render(
          createElement(
            StrictMode,
            {},
            createElement(MountCounter),
            createElement(ReactWebChat, { directLine, store: testHelpers.createStore() })
          )
        );

        // THEN: Strict Mode should mount, unmount, and mount again.
        await waitFor(() => expect(numMounts).toBe(2));

        // THEN: Web Chat should connect.
        await pageConditions.uiConnected();

        // WHEN: "echo Hello, World!" is sent.
        await pageObjects.sendMessageViaSendBox('echo Hello, World!', { waitForSend: true });

        // THEN: The bot should reply with "Echoing back in a separate activity." and "Hello, World!".
        await pageConditions.minNumActivitiesShown(3);
        await pageConditions.scrollStabilized();

        // THEN: The transcript shows the message and the 2 replies from the bot.
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
