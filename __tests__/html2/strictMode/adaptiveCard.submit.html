<!doctype html>
<html lang="en-US">
  <head>
    <title>Strict Mode: submits the typed value of an Adaptive Card on React 18</title>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "@testduet/wait-for": "https://esm.sh/@testduet/wait-for",
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "react": "/__dist__/packages/bundle/static/react.js",
          "react-dom": "/__dist__/packages/bundle/static/react-dom.js",
          "react-dom/client": "/__dist__/packages/bundle/static/react-dom/client.js"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { waitFor } from '@testduet/wait-for';
      import { createStoreWithOptions, ReactWebChat } from 'botframework-webchat';
      import { createElement, StrictMode, version } from 'react';
      import { createRoot } from 'react-dom/client';

      run(async function () {
        // TODO: This is for `createDirectLineEmulator` only, should find ways to eliminate this line.
        window.WebChat = { createStoreWithOptions };

        const { directLine, store } = testHelpers.createDirectLineEmulator();

        // GIVEN: The development build of React 18, which renders twice in Strict Mode (React 19: react19/strictMode.adaptiveCard.submit.html).
        expect(version).toBe('18.3.1');

        createRoot(document.getElementById('webchat')).render(
          createElement(
            StrictMode,
            {},
            createElement(ReactWebChat, { directLine, store, styleOptions: { hideSendBox: true } })
          )
        );

        await pageConditions.uiConnected();

        // GIVEN: A card with a text input and a "Submit" button without `data`, which sends the inputs as a post back.
        await directLine.emulateIncomingActivity({
          attachments: [
            {
              content: {
                $schema: 'http://adaptivecards.io/schemas/adaptive-card.json',
                actions: [{ title: 'Submit', type: 'Action.Submit' }],
                body: [{ id: 'firstName', label: 'First name', type: 'Input.Text' }],
                type: 'AdaptiveCard',
                version: '1.3'
              },
              contentType: 'application/vnd.microsoft.card.adaptive'
            }
          ],
          from: { role: 'bot' },
          type: 'message'
        });

        await pageConditions.numActivitiesShown(1);

        const input = document.querySelector('.ac-textInput input, input.ac-textInput');
        const submitButton = document.querySelector('.ac-pushButton');

        expect(submitButton).toHaveProperty('textContent', 'Submit');

        // WHEN: "John" is typed into the input and the "Submit" button is clicked.
        await host.click(input);
        await host.sendKeys('John');

        const { activity, resolveAll } = await directLine.actPostActivity(() => host.click(submitButton));

        await resolveAll();

        // THEN: The post back should have the typed value.
        expect(activity).toHaveProperty('value', { firstName: 'John' });

        // THEN: The input on screen should be the one the card read.
        expect(document.querySelector('.ac-textInput input, input.ac-textInput')).toBe(input);
        expect(input).toHaveProperty('value', 'John');

        // Clicking "Submit" selects it, after the post back.
        await waitFor(async () =>
          expect((await testHelpers.getAccessibilityNode(submitButton)).description?.value).toBe('Selected')
        );

        // THEN: The card shows "John" in the input.
        await host.snapshot('local');
      });
    </script>
  </body>
</html>
