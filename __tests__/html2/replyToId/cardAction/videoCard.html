<!doctype html>
<html lang="en-US">
  <head>
    <link href="/assets/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <main id="webchat"></main>
    <script type="importmap">
      {
        "imports": {
          "botframework-webchat": "/__dist__/packages/bundle/static/botframework-webchat.js",
          "botframework-webchat/": "/__dist__/packages/bundle/static/botframework-webchat/",
          "react": "https://esm.sh/react@18",
          "react-dom": "https://esm.sh/react-dom@18",
          "react-dom/": "https://esm.sh/react-dom@18/"
        }
      }
    </script>
    <script type="module">
      import '/test-harness.mjs';
      import '/test-page-object.mjs';

      import { createStoreWithOptions, testIds } from 'botframework-webchat';
      import { usePerformCardAction } from 'botframework-webchat/hook.js';
      import createRenderHook from '/assets/esm/createRenderHook.js';

      const { createDirectLineEmulator } = window.testHelpers;

      window.WebChat = { createStoreWithOptions, testIds };

      run(async function () {
        const { directLine, store } = createDirectLineEmulator();
        const renderHook = createRenderHook(
          document.getElementById('webchat'),
          {
            directLine,
            store
          },
          { renderWebChat: true }
        );

        await renderHook();
        await pageConditions.uiConnected();

        await directLine.emulateIncomingActivity({
          attachments: [
            {
              contentType: 'application/vnd.microsoft.card.video',
              content: {
                buttons: [{ title: 'Submit', type: 'postBack', value: { hello: 'World!' } }],
                text: 'Hello, World!',
                media: [
                  {
                    url: 'https://hawo-mockbot4-mock-bot-app.azurewebsites.net/assets/msband-FYTY3TX7.mp4',
                    profile: 'videocard'
                  }
                ],
                image: {
                  imageAltText: 'Microsoft Band',
                  url: 'https://hawo-mockbot4-mock-bot-app.azurewebsites.net/assets/ms-band1-ZNDPLK3X.jpg'
                },
                autoloop: true,
                autostart: false
              }
            }
          ],
          id: 'a-00001',
          type: 'message'
        });

        const submitButton = pageElements.activities()[0].querySelector('.ac-pushButton');

        const { activity, resolveAll } = await directLine.actPostActivity(() => host.click(submitButton));

        await resolveAll();

        directLine.emulateIncomingActivity(
          `\`\`\`\n${JSON.stringify(
            {
              ...activity,
              channelData: { ...activity.channelData, clientActivityID: '...' },
              entities: activity.entities ? '{ ... }' : undefined,
              from: '...',
              localTimestamp: '...',
              localTimezone: '...'
            },
            null,
            2
          )}\n\`\`\``
        );

        expect(activity).toEqual(
          expect.objectContaining({
            channelData: expect.objectContaining({ postBack: true }),
            replyToId: 'a-00001',
            type: 'message',
            value: { hello: 'World!' }
          })
        );

        await host.snapshot('local');
      });
    </script>
  </body>
</html>
